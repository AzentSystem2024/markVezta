<dx-validation-group #emailValidationGroup>
  <div class="mail-settings-wrapper">
    <!-- Email Type Row -->
    <div class="top-row">
      <div class="form-row">
        <label class="section-title">Email Type <span class="required-star">*</span></label>
        <div class="dropdown-group">
          <dx-select-box
            [dataSource]="emailTypeList"
            [(value)]="emailType"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
            [width]="380"
            placeholder="Select Email Type"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Email Type is required"
              ></dxi-validation-rule>
              <dxi-validation-rule
                type="custom"
                [validationCallback]="validateEmailTypeNotDuplicate"
                message="already created settings for this type"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>
      </div>
    </div>

    <!-- Main Settings Card Box -->
    <div class="settings-card">
      <!-- Sender ID Row -->
      <div class="form-row">
        <div class="field-col flex-1">
          <label class="field-label">Sender ID <span class="required-star">*</span></label>
          <dx-text-box
            [(value)]="senderId"
            class="field-input"
            [inputAttr]="{ autocomplete: 'off' }"
            placeholder="Enter Sender ID"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Sender ID is required"
              ></dxi-validation-rule>
              <dxi-validation-rule
                type="email"
                message="Sender ID must be a valid email"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
        <div class="checkbox-col">
          <dx-check-box
            [(value)]="enableSsl"
            text="Enable SSL"
          ></dx-check-box>
        </div>
      </div>

      <!-- Sender Name Row -->
      <div class="form-row">
        <div class="field-col full-width">
          <label class="field-label">Sender Name <span class="required-star">*</span></label>
          <dx-text-box
            [(value)]="senderName"
            class="field-input"
            [inputAttr]="{ autocomplete: 'off', readonly: false }"
            placeholder="Enter Sender Name"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Sender Name is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
      </div>

      <!-- Password and Confirm Password Row -->
      <div class="form-row two-cols">
        <div class="field-col half-width">
          <label class="field-label">Password <span class="required-star">*</span></label>
          <dx-text-box
            [mode]="isPasswordVisible ? 'text' : 'password'"
            [(value)]="password"
            valueChangeEvent="keyup input change"
            class="field-input"
            [inputAttr]="{ autocomplete: 'new-password', oncopy: 'return false;' }"
            placeholder="Enter Password"
          >
            <dxi-button
              name="passwordToggle"
              location="after"
              [options]="passwordButtonOptions"
            ></dxi-button>
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Password is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
        <div class="field-col half-width right-col">
          <label class="field-label right-label">Confirm Password <span class="required-star">*</span></label>
          <dx-text-box
            [mode]="isConfirmPasswordVisible ? 'text' : 'password'"
            [(value)]="confirmPassword"
            valueChangeEvent="keyup input change"
            class="field-input"
            [class.password-matched]="isPasswordMatching"
            [inputAttr]="{ autocomplete: 'new-password', onpaste: 'return false;' }"
            placeholder="Confirm Password"
          >
            <dxi-button
              name="confirmPasswordToggle"
              location="after"
              [options]="confirmPasswordButtonOptions"
            ></dxi-button>
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Confirm Password is required"
              ></dxi-validation-rule>
              <dxi-validation-rule
                type="compare"
                [comparisonTarget]="passwordComparison"
                message="Passwords do not match"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
      </div>

      <!-- SMTP Host and SMTP Port Row -->
      <div class="form-row two-cols">
        <div class="field-col half-width">
          <label class="field-label">SMTP Host <span class="required-star">*</span></label>
          <dx-text-box
            [(value)]="smtpHost"
            class="field-input"
            [inputAttr]="{ autocomplete: 'off' }"
            placeholder="Enter SMTP Host"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="SMTP Host is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
        <div class="field-col half-width right-col">
          <label class="field-label right-label">SMTP Port <span class="required-star">*</span></label>
          <dx-text-box
            [(value)]="smtpPort"
            class="field-input"
            [inputAttr]="{ autocomplete: 'off' }"
            placeholder="Enter SMTP Port"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="SMTP Port is required"
              ></dxi-validation-rule>
              <dxi-validation-rule
                type="pattern"
                pattern="^[0-9]+$"
                message="SMTP Port must be a valid number"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
      </div>

      <!-- Subject Row -->
      <div class="form-row">
        <div class="field-col full-width">
          <label class="field-label">Subject <span class="required-star">*</span></label>
          <dx-text-box
            [(value)]="subject"
            class="field-input"
            [inputAttr]="{ autocomplete: 'off' }"
            placeholder="Enter Subject"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Subject is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
      </div>

      <!-- Receiver ID Row -->
      <div class="form-row">
        <div class="field-col full-width">
          <label class="field-label">Receiver ID <span class="required-star">*</span></label>
          <dx-text-box
            [(value)]="receiverId"
            class="field-input"
            [inputAttr]="{ autocomplete: 'off' }"
            placeholder="Enter Receiver ID(s) separated by comma"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Receiver ID is required"
              ></dxi-validation-rule>
              <dxi-validation-rule
                type="custom"
                [validationCallback]="validateReceiverEmails"
                message="Receiver ID must contain valid email address(es)"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
      </div>

      <!-- Message Body Row -->
      <div class="form-row align-top">
        <div class="field-col full-width align-top">
          <label class="field-label">Message Body</label>
          <dx-text-area
            [height]="120"
            [(value)]="messageBody"
            class="field-input"
            placeholder="Enter Message Body"
          ></dx-text-area>
        </div>
      </div>
    </div>

    <!-- Bottom Action Buttons Bar -->
    <div class="mail-settings-footer">
      <dx-button
        text="Test Email"
        stylingMode="contained"
        class="test-email-btn"
        icon="email"
        [disabled]="isTestingEmail"
        (onClick)="onTestEmail(emailValidationGroup)"
      ></dx-button>

      <div class="right-buttons">
        <dx-button
          text="Cancel"
          stylingMode="outlined"
          type="normal"
          class="cancel-btn"
          [width]="110"
          (onClick)="onCancel()"
        ></dx-button>
        <dx-button
          [text]="isEditing ? 'Update' : 'Save'"
          stylingMode="contained"
          type="default"
          class="save-btn"
          [width]="110"
          (onClick)="onSave(emailValidationGroup)"
        ></dx-button>
      </div>
    </div>
  </div>
</dx-validation-group>
