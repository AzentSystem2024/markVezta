<dx-popup
  [title]="titleText"
  [(visible)]="visible"
  [fullScreen]="!!(screen.xSmallScreenChanged | async)"
  [width]="width"
  [wrapperAttr]="getWrapperAttrs | apply: wrapperAttr"
  (onHidden)="close()"
  [height]="height"
  [shading]="false"
>
  <dxi-toolbar-item toolbar="bottom" location="after">
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        width: 100%;
      "
    >
      <!-- Approve -->
      <div
        *ngIf="showApprove"
        style="display: flex; align-items: center; gap: 6px"
      >
        <label>Approve</label>
        <dx-check-box
          [value]="isApproved"
          (onValueChanged)="isApprovedChange.emit($event.value)"
        ></dx-check-box>
      </div>

      <!-- Buttons -->
      <div style="display: flex; gap: 10px">
        <dx-button
          text="Cancel"
          stylingMode="outlined"
          type="normal"
          (onClick)="close()"
        ></dx-button>

        <dx-button
          text="Save"
          stylingMode="contained"
          type="default"
          [disabled]="isSaveDisabled"
          (onClick)="onSaveClick()"
        ></dx-button>
      </div>
    </div>
  </dxi-toolbar-item>
  <dx-validation-group #validationGroup>
    <ng-content></ng-content>
  </dx-validation-group>
</dx-popup>
