<header>
  <dx-toolbar class="header-toolbar">
    <dxi-item
      *ngIf="menuToggleEnabled"
      location="before"
      widget="dxButton"
      cssClass="menu-button"
      [options]="{
        icon: 'menu',
        stylingMode: 'text',
        onClick: toggleMenu,
      }"
    >
    </dxi-item>
    <!-- <dxi-item
      location="before"
      cssClass="header-title"
      *ngIf="title"
      [text]="title"
    >
    </dxi-item> -->
    <dxi-item location="before" cssClass="header-title">
      <div *dxTemplate class="d-flex align-items-end">
        <img [src]="logoPath" alt="Logo" class="logo-image" />
        <span
          class="fw-bold versionText small"
          style="margin-bottom: -4px; margin-left: 5px"
          >V {{ version }}</span
        >
      </div>
    </dxi-item>


    <!-- Notification Bell  -->
 <dxi-item location="after" locateInMenu="never">
  <ng-container *dxTemplate>
    <div class="notification-column">

      <dx-button
        icon="bell"
        stylingMode="text"
        hint="Pending Activities"
        (onClick)="togglePanel()">
      </dx-button>

      <span class="notification-count" *ngIf="totalPending > 0">
        {{ totalPending }}
      </span>

    </div>
  </ng-container>
</dxi-item>

    <dxi-item location="after" locateInMenu="never">
      <ng-container *dxTemplate>
        <theme-switcher></theme-switcher>
      </ng-container>
    </dxi-item>

    <dxi-item location="after">
      <div class="toolbar-divider"></div>
    </dxi-item>

    <dxi-item location="after" locateInMenu="auto">
      <ng-container *dxTemplate>
        <div class="user-info">
          <div class="user-name">{{ UserName }}</div>
          <!-- <div class="company-name">{{ company }}</div> -->
          <div
            id="companyName"
            class="company-name"
            [class.disabled]="!canSwitchCompany"
            (click)="openCompanyPopup()"
          >
            {{ company }}

            <i class="dx-icon-chevron-down" *ngIf="canSwitchCompany"></i>
          </div>
          <!-- <div class="company-switcher">
            <dx-select-box
              [dataSource]="companyList"
              displayExpr="COMPANY_NAME"
              valueExpr="COMPANY_ID"
              [(value)]="selectedCompanyId"
              [searchEnabled]="true"
              [showClearButton]="false"
              [dropDownOptions]="{ width: 280 }"
              stylingMode="underlined"
              (onValueChanged)="onCompanyChanged($event)"
              [elementAttr]="{ class: 'company-select' }"
            >
            </dx-select-box>
          </div> -->
          <div class="financial-year">Fin Year : {{ finId }}</div>
        </div>
      </ng-container>
    </dxi-item>

    <!-- <dxi-item
      location="after"
      locateInMenu="auto"
      widget="dxButton"
      [options]="{
        text: UserName,
        stylingMode: 'text',
        elementAttr: { class: 'userNameLabel' }
      }"
    ></dxi-item> -->

    <dxi-item location="after" locateInMenu="auto" menuItemTemplate="menuItem">
      <div *dxTemplate="let data of 'item'">
        <user-panel
          [user]="user"
          [menuItems]="userMenuItems"
          menuMode="context"
        ></user-panel>
      </div>
    </dxi-item>
    <div *dxTemplate="let data of 'menuItem'">
      <user-panel
        [user]="user"
        [menuItems]="userMenuItems"
        menuMode="list"
      ></user-panel>
    </div>
  </dx-toolbar>

  <dx-popup
    [(visible)]="companyPopupVisible"
    [width]="300"
    [height]="'auto'"
    [showTitle]="false"
    [showCloseButton]="false"
    [dragEnabled]="false"
    [hideOnOutsideClick]="true"
    [position]="{
      of: '#companyName',
      my: 'left top',
      at: 'left bottom',
      offset: '0 5',
    }"
  >
    <div *dxTemplate="let data of 'content'">
      <div class="company-list">
        <div
          class="company-item"
          *ngFor="let item of companyList"
          (click)="onCompanyChanged(item)"
        >
          <span>{{ item.COMPANY_NAME }}</span>

          <i
            *ngIf="item.COMPANY_ID == selectedCompanyId"
            class="dx-icon-check"
          ></i>
        </div>
      </div>
    </div>
  </dx-popup>
</header>

 <app-pending-activity
  *ngIf="showPendingActivity"
  (close)="showPendingActivity = false">
</app-pending-activity>
