<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ✅ Collapsible Filter Panel -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          labelMode="floating"
          label="Year"
          [width]="150"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <dx-select-box
          labelMode="floating"
          label="Month"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
        ></dx-select-box>

        <dx-date-box
          [width]="150"
          label="Date From"
          labelMode="floating"
          [displayFormat]="'dd-MM-yyyy'"
          [value]="formatted_from_date"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <dx-date-box
          [width]="150"
          label="Date To"
          labelMode="floating"
          [displayFormat]="'dd-MM-yyyy'"
          [value]="formatted_To_date"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <dx-button
          text="Apply"
          type="default"
          stylingMode="contained"
          (onClick)="get_PDC_list()"
        ></dx-button>

        <dx-button
          text="Cancel"
          type="danger"
          stylingMode="outlined"
          (onClick)="cancelReport()"
        ></dx-button>
      </div>
    </div>

    <!-- ✅ Toggle Bar -->
    <div class="toggle-bar" (click)="toggleParameters()">
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="PDCReport"
      width="100%"
      noDataText=""
      height="75vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      id="dataGrid"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="font-weight: 600; font-size: 20px; margin-left: 12px"
          >
            PDC Report
          </div>
        </dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <dxi-column
        dataField="CHEQUE_NO"
        caption="Cheque No."
        dataType="string"
      ></dxi-column>
      <dxi-column
        dataField="CHEQUE_DATE"
        caption="Due Date"
        dataType="date"
        format="dd/MM/yyyy"
      ></dxi-column>
      <dxi-column
        dataField="BANK"
        caption="Bank"
        dataType="string"
      ></dxi-column>
      <dxi-column
        dataField="BENEFICIARY_NAME"
        caption="Beneficiary Name"
        dataType="string"
      ></dxi-column>
      <dxi-column
        dataField="PAID"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Issued"
        dataType="number"
      ></dxi-column>
      <dxi-column
        dataField="RECEIVED"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Received"
        dataType="number"
      ></dxi-column>
      <dxi-column
        dataField="PDC_STATUS"
        caption="Status"
        dataType="string"
      ></dxi-column>
      <dxi-column
        dataField="REMARKS"
        caption="Remarks"
        dataType="string"
      ></dxi-column>

      <dxi-column *ngIf="PDCReport.length > 0" type="buttons" [width]="100">
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <!-- Custom Column Chooser -->
    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>
          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>
        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>
        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>

    <!-- Edit PDC Popup -->
    <dx-popup
      [(visible)]="editPDCPopupOpened"
      [width]="'50vw'"
      [height]="'90vh'"
      title="Edit PDC"
      (onHiding)="handleClose()"
    >
      <app-pdc-edit-form
        [selectedPDC]="selectedPDC"
        [isOpen]="editPDCPopupOpened"
        [isEditReadOnly]="true"
        (formClosed)="handleClose()"
      ></app-pdc-edit-form>
    </dx-popup>
  </div>
</div>

<!-- =============================drildown========================= -->

<dx-popup
  [(visible)]="editPDCPopupOpened"
  [width]="'50vw'"
  [height]="'90vh'"
  title="Edit PDC"
  (onHiding)="handleClose()"
>
  <app-pdc-edit-form
    [selectedPDC]="selectedPDC"
    [isOpen]="editPDCPopupOpened"
    [isReadOnly]="isEditReadOnly"
    (formClosed)="handleClose()"
  ></app-pdc-edit-form>
</dx-popup>
