<div class="salary-grid-wrapper">
  <div class="grid-container">
    <div
      class="top-fields"
      style="
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
        width: 100%;
        align-items: flex-end;
      "
    >
      <!-- Column 1 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <dx-text-box
          class="custom-select-box"
          [placeholder]="'Select Employee'"
          label="Salary Month"
          [labelMode]="'floating'"
          [(value)]="payRollData.MONTH"
          [readOnly]="true"
          [width]="200"
        ></dx-text-box>

        <dx-text-box
          class="custom-text-box"
          [placeholder]="'Employee '"
          label="Employee"
          [labelMode]="'floating'"
          [(value)]="payRollData.EMPLOYEE_NAME"
          [width]="200"
          [readOnly]="true"
        ></dx-text-box>
      </div>

      <!-- Column 2 -->
      <div>
        <dx-text-box
          class="basic-salary-box"
          label="Basic Salary"
          [labelMode]="'floating'"
          [(value)]="payRollData.BASIC_SALARY"
          [width]="180"
          format="#,##0.00"
          [inputAttr]="{ style: 'text-align: right;' }"
          [readOnly]="true"
        ></dx-text-box>
      </div>

      <!-- Column 3 -->
      <div style="margin-left: auto;">
        <dx-number-box
          [placeholder]="'OT Hours'"
          label="OT Hours"
          [labelMode]="'floating'"
          [(value)]="payRollData.OT_HOURS"
          [width]="180"
          [min]="0"
          [max]="12"
          [readOnly]="true"
        ></dx-number-box>
      </div>

      <!-- Column 4 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <dx-text-box
          [placeholder]="'Worked Days'"
          label="Worked Days"
          [labelMode]="'floating'"
          [(value)]="payRollData.WORKED_DAYS"
          [width]="180"
          [readOnly]="true"
        ></dx-text-box>

        <dx-number-box
          [placeholder]="'Less Hours'"
          label="Less Hours"
          [labelMode]="'floating'"
          [(value)]="payRollData.LESS_HOURS"
          [width]="180"
          [min]="0"
          [max]="12"
          [readOnly]="true"
        ></dx-number-box>
      </div>
    </div>

    <dx-data-grid
      [dataSource]="payRollData.PAY_DETAILS"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="false"
      [showColumnHeaders]="true"
      [allowColumnResizing]="true"
      [height]="'55vh'"
      [columnResizingMode]="'nextColumn'"
      [scrolling]="{ mode: 'virtual' }"
      [selection]="{ mode: 'single' }"
      (onEditorPreparing)="onEditorPreparing($event)"
      (onContentReady)="onContentReady($event)"
      (onRowInserted)="onRowInserted($event)"
      (onRowRemoved)="onRowRemoved($event)"
    >
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="standard"></dxo-scrolling>
      
      <dxi-column
        dataField="SNO"
        caption="Sl. No"
        [width]="70"
        [allowEditing]="false"
      ></dxi-column>

      <dxi-column
        dataField="HEAD_NAME"
        caption="Salary Head"
        [allowEditing]="false"
      ></dxi-column>

      <dxi-column
        dataField="GROSS_AMOUNT"
        caption="Gross"
        dataType="number"
        [width]="180"
        [allowEditing]="false"
        [format]="{ type: 'fixedPoint', precision: 2 }"
        [editorOptions]="{ format: '#,##0.00' }"
      ></dxi-column>
      
      <dxi-column
        dataField="DEDUCTION_AMOUNT"
        caption="Deduction"
        dataType="number"
        [width]="140"
        [allowEditing]="false"
        [format]="{ type: 'fixedPoint', precision: 2 }"
        [editorOptions]="{ format: '#,##0.00' }"
      ></dxi-column>

      <dxo-summary>
        <dxi-total-item
          column="GROSS_AMOUNT"
          summaryType="sum"
          [valueFormat]="customFormat"
          displayFormat="{0}"
          showInColumn="GROSS_AMOUNT"
        ></dxi-total-item>

        <dxi-total-item
          column="DEDUCTION_AMOUNT"
          summaryType="sum"
          [valueFormat]="customFormat"
          displayFormat="{0}"
          showInColumn="DEDUCTION_AMOUNT"
        ></dxi-total-item>
      </dxo-summary>
    </dx-data-grid>

    <div
      style="
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 15px;
      "
    >
      <label style="margin-right: 10px; font-weight: 500;">Net Payable:</label>
      <dx-number-box
        [value]="payRollData.NET_AMOUNT"
        [readOnly]="true"
        width="200"
        [editorOptions]="{ format: '#,##0.00' }"
        [format]="{ type: 'fixedPoint', precision: 2 }"
        [rtlEnabled]="true"
      ></dx-number-box>
    </div>
  </div>
</div>

<div
  class="form-popup-buttons-container"
  style="display: flex; justify-content: flex-end; width: 100%; margin-top: 10px;"
>
  <div class="popup-footer">
    <dx-button class="mt-3"
      text="Close"
      stylingMode="outlined"
      type="normal"
      (onClick)="handleClose()"
    ></dx-button>
  </div>
</div>
