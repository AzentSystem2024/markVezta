<div class="salary-grid-wrapper">
  <div class="grid-container">
    <div class="custom-toolbar" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 16px;">
      <div class="toolbar-left" style="display: flex; gap: 16px; flex-wrap: wrap;">
        <div class="stacked-toolbar-group" style="display: flex; gap: 8px;">
          <dx-date-box
            class="custom-select-box"
            label="Salary Month"
            [labelMode]="'floating'"
            [(value)]="payRollData.MONTH"
            [readOnly]="true"
            displayFormat="MMMM yyyy"
            [calendarOptions]="{
              maxZoomLevel: 'year',
              minZoomLevel: 'century',
            }"
          ></dx-date-box>
          <dx-text-box
            class="custom-text-box"
            [placeholder]="'Employee '"
            label="Employee"
            [labelMode]="'floating'"
            [(value)]="payRollData.EMPLOYEE_NAME"
            [width]="200"
            [readOnly]="true"
          ></dx-text-box>
        </div>
        
        <div class="stacked-toolbar-group basic-salary-container">
          <dx-number-box
            class="basic-salary-box"
            [showClearButton]="true"
            label="Basic Salary"
            [labelMode]="'floating'"
            [(value)]="payRollData.BASIC_SALARY"
            [width]="180"
            [readOnly]="true"
            format="#,##0.00"
            [inputAttr]="{ style: 'text-align: right;' }"
          ></dx-number-box>
        </div>
      </div>

      <div class="toolbar-right">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px">
            <dx-text-box
              [placeholder]="'Worked Days'"
              label="Worked Days"
              [labelMode]="'floating'"
              [(value)]="payRollData.WORKED_DAYS"
              [width]="139"
              [readOnly]="true"
            ></dx-text-box>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <dx-number-box
              [placeholder]="'OT Hours'"
              [label]="'OT Hours'"
              [labelMode]="'floating'"
              [(value)]="payRollData.OT_HOURS"
              [width]="139"
              [readOnly]="is_approve"
            ></dx-number-box>
            <dx-button class="mt-2"
              *ngIf="!is_approve"
              icon="plus"
              type="default"
              stylingMode="contained"
              (onClick)="addNewRow()"
            ></dx-button>
          </div>
        </div>
      </div>
    </div>
    <dx-data-grid
      #itemsGridRef
      [dataSource]="payRollData.PAY_DETAILS"
      [showBorders]="true"
      [showColumnLines]="true"
      [showColumnHeaders]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [columnResizingMode]="'nextColumn'"
      [headerFilter]="{ visible: true }"
      [height]="'55vh'"
      [scrolling]="{ mode: 'virtual' }"
      [selection]="{ mode: 'single' }"
      [editing]="{
        mode: 'cell',
        allowAdding: !is_approve,
        allowDeleting: !is_approve,
        allowUpdating: !is_approve,
        useIcons: true,
      }"
      (onEditorPreparing)="onEditorPreparing($event)"
      (onContentReady)="onContentReady($event)"
    >
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="standard"></dxo-scrolling>
      <dxo-filter-builder [allowHierarchicalFields]="true">
      </dxo-filter-builder>
      <dxi-column
        dataField="SNO"
        caption="Sl No"
        [width]="90"
        [allowEditing]="false"
        alignment="left"
      ></dxi-column>

      <dxi-column
        dataField="HEAD_ID"
        caption="Salary Head"
        [lookup]="{
          dataSource: salaryHeadList || [],
          valueExpr: 'ID',
          displayExpr: 'HEAD_NAME',
        }"
        [calculateDisplayValue]="getHeadName"
      >
      </dxi-column>

      <dxi-column
        dataField="GROSS_AMOUNT"
        caption="Gross"
        dataType="number"
        [width]="160"
        [format]="{ type: 'fixedPoint', precision: 2 }"
        [editorOptions]="{ format: '#,##0.00' }"
      ></dxi-column>
      <dxi-column
        dataField="DEDUCTION_AMOUNT"
        caption="Deduction"
        [format]="{ type: 'fixedPoint', precision: 2 }"
        dataType="number"
        [width]="160"
        [editorOptions]="{ format: '#,##0.00' }"
      ></dxi-column>
      <dxi-column type="buttons" width="110" [visible]="!is_approve">
        <dxi-button name="edit"></dxi-button>
        <dxi-button name="delete"></dxi-button>
      </dxi-column>
      <dxo-summary>
        <dxi-total-item
          column="GROSS_AMOUNT"
          summaryType="sum"
          [valueFormat]="customFormat"
          displayFormat="{0}"
          showInColumn="GROSS_AMOUNT"
        >
        </dxi-total-item>

        <dxi-total-item
          column="DEDUCTION_AMOUNT"
          summaryType="sum"
          [valueFormat]="customFormat"
          displayFormat="{0}"
          showInColumn="DEDUCTION_AMOUNT"
        >
        </dxi-total-item>
      </dxo-summary>
    </dx-data-grid>
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      "
    >
      <!-- Left Section: Leave Salary and End of Service -->
      <div style="display: flex; gap: 20px; align-items: center"></div>

      <!-- Right Section: Net Payable -->
      <div style="display: flex; align-items: center">
        <label style="margin-right: 10px; min-width: 100px">Net Payable:</label>
        <dx-number-box
          [value]="payRollData.NET_AMOUNT"
          [readOnly]="true"
          width="200"
          dataType="number"
          dataType="number"
          [editorOptions]="{ format: '#,##0.00' }"
          [format]="{ type: 'fixedPoint', precision: 2 }"
          [rtlEnabled]="true"
        ></dx-number-box>
      </div>
    </div>

    <div
      style="display: flex; align-items: center; gap: 20px; margin-top: 10px"
    >
      <div style="flex: 1"></div>
    </div>
  </div>
</div>

<div class="form-popup-buttons-container mt-4">
  <div class="popup-footer">
    <dx-button
      text="Cancel"
      stylingMode="outlined"
      type="normal"
      (onClick)="handleClose()"
    ></dx-button>
    <dx-button
      text="Verify"
      stylingMode="contained"
      (onClick)="verify()"
      type="default"
      [visible]="is_verify || (payRollData?.STATUS === 'Open' && !is_approved)"
    ></dx-button>
    <dx-button
      text="Update"
      stylingMode="contained"
      (onClick)="update(false)"
      type="default"
      [visible]="!is_verify && !is_approved && !isReadOnlyMode"
    ></dx-button>
    <dx-button
      text="Approve"
      stylingMode="contained"
      (onClick)="approve()"
      type="default"
      [visible]="is_approved && !is_verify"
    ></dx-button>
  </div>
</div>
