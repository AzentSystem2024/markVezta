<div class="view-wrapper list-page">
  <div>
    <dx-data-grid
      #dataGrid
      [width]="'100%'"
      [height]="'75vh'"
      class="grid theme-dependent"
      [dataSource]="logList"
      [showBorders]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [showColumnLines]="true"
      rowAlternationInterval="2"
      (onSelectionChanged)="onSelectionChanged($event)"
      (onEditingStart)="openEditingStart($event)"
      (onRowRemoving)="onRowRemoving($event)"
      (onCellPrepared)="onCellPrepared($event)"
      [keyExpr]="'ID'"
      [selection]="{ mode: 'single' }"
      (onExporting)="onExporting($event)"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-scrolling
        mode="standard"
        columnRenderingMode="virtual"
      ></dxo-scrolling>
      <dxo-editing
        mode="popup"
        [allowUpdating]="canEdit"
        [allowDeleting]="canDelete"
      ></dxo-editing>
      <dxo-search-panel
        [visible]="true"
        [highlightCaseSensitive]="false"
      ></dxo-search-panel>
      <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Change Item Price
          </div>
        </dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>
        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <!-- Divider -->
        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <!-- Export (built-in, kept) -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
        <!-- <dxi-item location="after">
          <dx-button
            text="Add"
            icon="plus"
            type="default"
            stylingMode="contained"
            (click)="onAddClick()"
          ></dx-button>
        </dxi-item> -->
      </dxo-toolbar>

      <dxi-column
        dataField="ID"
        caption="ID"
        [width]="'auto'"
        [allowEditing]="false"
        [visible]="false"
      ></dxi-column>
      <dxi-column
        dataField="WS_NO"
        caption="Work Sheet No."
        [width]="'auto'"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="WS_DATE"
        caption="Date"
        dataType="date"
        [width]="'auto'"
        [allowEditing]="false"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column
        dataField="NARRATION"
        caption="Remarks"
        [minWidth]="250"
        [allowEditing]="false"
      ></dxi-column>
      <!-- <dxi-column
        dataField="Status"
        caption="Status"
        [width]="150"
        [allowEditing]="false"
        cellTemplate="statusCellTemplate"
        alignment="center"
      ></dxi-column>

      <div *dxTemplate="let cellData of 'statusCellTemplate'">
        <i
          class="fas fa-flag"
          [ngClass]="getStatusFlagClass(cellData.value)"
          [attr.title]="cellData.value"
        ></i>
      </div>
      <dxi-column
        type="buttons"
        [width]="200"
        [buttons]="allButtons"
      ></dxi-column> -->
      <dxi-column
        caption="Status"
        dataField="Status"
        [width]="140"
        cellTemplate="statusCellRender"
        [allowHeaderFiltering]="true"
        [headerFilter]="{
          dataSource: getStatusFilterData,
          encodeHtml: false,
        }"
      >
      </dxi-column>
      <div *dxTemplate="let data of 'statusCellRender'">
        <div style="text-align: center; width: 100%">
          <span
            [ngClass]="{
              'flag-approved': data.data.Status === 'Approved',
              'flag-verified': data.data.Status === 'Verified',
              'flag-pending':
                data.data.Status !== 'Verified' &&
                data.data.Status !== 'Approved',
            }"
          >
            {{
              data.data.Status === "Open"
                ? "Open"
                : data.data.Status === "Verified"
                  ? "Verified"
                  : data.data.Status === "Approved"
                    ? "Approved"
                    : "Unknown"
            }}
          </span>
        </div>
      </div>
      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      >
      </dxi-column>
      <div *dxTemplate="let cellData of 'actionTemplate'">
        <div class="action-icons">
          <i
            *ngIf="canEdit"
            class="dx-icon dx-icon-edit"
            [title]="cellData.data.Status === 'Open' ? 'Edit' : 'Details'"
            (click)="openEditingStart({ data: cellData.data, cancel: false })"
          ></i>

          <!-- Delete -->
          <i
            *ngIf="canDelete"
            class="dx-icon dx-icon-trash"
            [style.opacity]="
              cellData.data.Status === 'Verified' ||
              cellData.data.Status === 'Approved'
                ? '0.4'
                : '1'
            "
            [style.pointer-events]="
              cellData.data.Status === 'Verified' ||
              cellData.data.Status === 'Approved'
                ? 'none'
                : 'auto'
            "
            title="Delete"
            (click)="onRowRemoving({ data: cellData.data, cancel: false })"
          ></i>

          <!-- Verify -->
          <span
            *ngIf="
              !(canEdit && !canVerify && !canApprove) &&
              (canVerify || canApprove || cellData.data.Status === 'Approved')
            "
            class="verify-badge"
            [ngClass]="{
              'status-pending': cellData.data.Status === 'Open',
              'status-verified': cellData.data.Status === 'Verified',
              'status-approved': cellData.data.Status === 'Approved',

              disabled:
                (cellData.data.Status === 'Open' && !canVerify) ||
                (cellData.data.Status === 'Verified' && !canApprove) ||
                (cellData.data.Status === 'Approved' && canEdit),
            }"
            (click)="onVerifyClick({ row: { data: cellData.data } })"
          >
          </span>
        </div>
      </div>
    </dx-data-grid>
  </div>
  <app-item-store-pricess
    *ngIf="isFormVisible"
    (afterSave)="getLoglist()"
  ></app-item-store-pricess>
</div>
