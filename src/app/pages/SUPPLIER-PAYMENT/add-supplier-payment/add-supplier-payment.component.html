<dx-validation-group #journalVoucherGroup>
  <div
    class="invoice-wrapper"
    style="
      height: 80vh;
      display: flex;
      flex-direction: column;

      box-sizing: border-box;
    "
  >
    <div
      class="salary-grid-wrapper"
      style="
        padding: 10px 15px;
        display: flex;
        flex-direction: column;
        height: 100%;
      "
    >
      <!-- Header Fields Row -->
      <div
        class="form-header-row"
        style="
          display: flex;
          gap: 20px;
          align-items: center;
          margin-bottom: 15px;
        "
      >
        <dx-text-box
          [(value)]="paymentFormData.DOC_NO"
          label="Payment No"
          labelMode="floating"
          [width]="200"
          [readOnly]="true"
        ></dx-text-box>

        <dx-select-box
          [(value)]="paymentFormData.SUPP_ID"
          [dataSource]="supplierList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [width]="350"
          [searchEnabled]="true"
          [showClearButton]="true"
          label="Supplier"
          labelMode="floating"
          (onValueChanged)="onSupplierChanged($event)"
          style="flex: 1; max-width: 400px"
        ></dx-select-box>

        <dx-date-box
          [(value)]="paymentFormData.TRANS_DATE"
          label="Date"
          labelMode="floating"
          displayFormat="dd-MM-yyyy"
          type="date"
          [width]="200"
        ></dx-date-box>
      </div>

      <!-- Grid Section (Flex: 1 to fill available space) -->
      <div
        class="grid-section"
        style="
          flex: 1;
          display: flex;
          flex-direction: column;
          min-height: 200px;
        "
      >
        <dx-data-grid
          #itemsGridRef
          [dataSource]="pendingInvoicelist"
          keyExpr="BILL_ID"
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [columnAutoWidth]="false"
          [wordWrapEnabled]="false"
          [rowAlternationEnabled]="true"
          [headerFilter]="{ visible: true, allowSearch: true }"
          [allowColumnReordering]="true"
          [showColumnHeaders]="true"
          [allowColumnResizing]="true"
          [columnResizingMode]="'nextColumn'"
          rowAlternationInterval="2"
          [height]="'100%'"
          [selection]="{
            mode: 'multiple',
            showCheckBoxesMode: 'always',
            selectAllMode: 'allPages',
          }"
          (onContentReady)="onGridContentReady($event)"
          (onSelectionChanged)="onSelectionChanged($event)"
          (onEditorPreparing)="onEditorPreparing($event)"
        >
          <dxo-editing
            mode="cell"
            [allowUpdating]="true"
            [allowAdding]="false"
            [allowDeleting]="false"
          ></dxo-editing>
          <dxo-load-panel [showPane]="false"></dxo-load-panel>
          <dxo-filter-builder
            [allowHierarchicalFields]="true"
          ></dxo-filter-builder>

          <dxi-column
            dataField="DOC_NO"
            caption="Doc No"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="PURCH_DATE"
            caption="Date"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="SUPP_INV_NO"
            caption="Supplier Invoice No"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="NET_AMOUNT"
            caption="Inv Amount"
            [allowEditing]="false"
            [width]="120"
            [format]="{ type: 'fixedPoint', precision: 2 }"
          ></dxi-column>
          <dxi-column
            dataField="PENDING_AMOUNT"
            caption="Balance"
            [allowEditing]="false"
            [format]="{ type: 'fixedPoint', precision: 2 }"
          ></dxi-column>
          <dxi-column
            dataField="RECEIVED_AMOUNT"
            caption="Received Amount"
            dataType="number"
            [allowEditing]="true"
            alignment="right"
            [format]="{ type: 'fixedPoint', precision: 2 }"
          >
            <dxi-validation-rule
              type="custom"
              [validationCallback]="validateReceivedAmount"
              message="Received Amount must equal Balance"
            ></dxi-validation-rule>
          </dxi-column>

          <dxo-summary
            [calculateCustomSummary]="calculateSelectedPendingSummary"
          >
            <dxi-total-item
              name="selectedPendingTotal"
              summaryType="custom"
              showInColumn="PENDING_AMOUNT"
              valueFormat="#,##0.00"
              displayFormat="Total: {0}"
              alignment="right"
            ></dxi-total-item>
            <dxi-total-item
              column="RECEIVED_AMOUNT"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="Total: {0}"
              alignment="right"
            ></dxi-total-item>
          </dxo-summary>
        </dx-data-grid>

        <!-- Fill Amount Button below grid -->
        <div
          style="
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            margin-bottom: 5px;
          "
        >
          <dx-button
            text="Fill Amount"
            hint="Fill Amount"
            icon="plus"
            type="normal"
            class="blue-outline-btn"
            [disabled]="selectedRowsCount === 0"
            (onClick)="onFillAmountClick()"
          ></dx-button>
        </div>
      </div>

      <!-- Details Section -->
      <div class="payment-details-card">
        <!-- Headers -->
        <div style="display: flex; gap: 10px">
          <div class="section-label" style="flex: 1">Payment Details</div>
          <div
            class="section-label"
            style="flex: 1"
            [ngClass]="{ dimmed: receiptMode !== 'Bank' }"
          >
            Bank Remittance Details
          </div>
        </div>

        <!-- Row 1: Radio & Ref/Date -->
        <div style="display: flex; gap: 10px; align-items: flex-end">
          <div style="flex: 1; margin-bottom: 2px">
            <dx-radio-group
              [items]="['Cash', 'Bank', 'PDC']"
              layout="horizontal"
              [width]="'100%'"
              (onValueChanged)="onReceiptModeChange($event)"
            ></dx-radio-group>
          </div>
          <div style="flex: 1; display: flex; gap: 10px; align-items: flex-end">
            <dx-button
              *ngIf="receiptMode === 'PDC'"
              icon="search"
              stylingMode="outlined"
              type="default"
              (onClick)="onSearchCheque()"
              style="width: 45px; height: 35px"
              [disabled]="
                !(receiptMode === 'PDC' && paymentFormData.PAY_HEAD_ID)
              "
            ></dx-button>
            <dx-text-box
              [(value)]="paymentFormData.CHEQUE_NO"
              label="Reference No"
              labelMode="floating"
              style="flex: 1"
              [disabled]="
                !(
                  receiptMode === 'Bank' ||
                  (receiptMode === 'PDC' && paymentFormData.PAY_HEAD_ID)
                )
              "
            ></dx-text-box>
            <dx-date-box
              [(value)]="paymentFormData.CHEQUE_DATE"
              label="Due Date"
              labelMode="floating"
              type="date"
              displayFormat="dd-MM-yyyy"
              style="width: 150px"
              [disabled]="
                !(
                  receiptMode === 'Bank' ||
                  (receiptMode === 'PDC' && paymentFormData.PAY_HEAD_ID)
                )
              "
            ></dx-date-box>
          </div>
        </div>

        <!-- Row 2: Ledger & Bank Name -->
        <div style="display: flex; gap: 10px">
          <div style="flex: 1">
            <dx-select-box
              [dataSource]="filteredLedgerList"
              [(value)]="paymentFormData.PAY_HEAD_ID"
              displayExpr="HEAD_NAME"
              valueExpr="HEAD_ID"
              label="Ledger"
              labelMode="floating"
              [searchEnabled]="true"
              [width]="'100%'"
              (onValueChanged)="onLedgerChanged($event)"
            ></dx-select-box>
          </div>
          <div style="flex: 1">
            <dx-text-box
              [(value)]="paymentFormData.BANK_NAME"
              label="Bank Name"
              labelMode="floating"
              [width]="'100%'"
              [disabled]="
                !(
                  receiptMode === 'Bank' ||
                  (receiptMode === 'PDC' && paymentFormData.PAY_HEAD_ID)
                )
              "
            ></dx-text-box>
          </div>
        </div>

        <!-- Narration Row -->
        <div class="narration-row" style="display: flex; gap: 10px">
          <div style="flex: 1">
            <dx-text-box
              [(value)]="paymentFormData.NARRATION"
              label="Narration"
              labelMode="floating"
              [width]="'100%'"
            ></dx-text-box>
          </div>
          <div style="flex: 1" *ngIf="receiptMode === 'PDC'">
            <dx-number-box
              [(value)]="paymentFormData.AMOUNT"
              label="Amount"
              labelMode="floating"
              [format]="{ type: 'fixedPoint', precision: 2 }"
              [width]="'100%'"
            ></dx-number-box>
          </div>
          <div style="flex: 1" *ngIf="receiptMode !== 'PDC'"></div>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>

<div class="form-popup-buttons-container">
  <div class="popup-footer">
    <!-- Approve + Cancel column -->
    <div class="approve-cancel-group">
      <div class="approve-container" *ngIf="canApprove">
        <dx-check-box
          text="Approve"
          [(value)]="paymentFormData.IS_APPROVED"
        ></dx-check-box>
      </div>
      <!-- Cancel -->
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        (onClick)="handleCancel()"
        type="normal"
      ></dx-button>
    </div>
    <dx-button
      #saveButtonRef
      [text]="
        isSaving
          ? paymentFormData.IS_APPROVED
            ? 'Committing...'
            : 'Saving...'
          : paymentFormData.IS_APPROVED
            ? 'Commit'
            : 'Save'
      "
      [disabled]="isSaving"
      stylingMode="contained"
      type="default"
      (onClick)="saveReceipt()"
    ></dx-button>
  </div>
</div>

<dx-popup
  [(visible)]="showFillAmountPopup"
  [width]="400"
  [height]="300"
  title="Fill Amount"
  [showTitle]="true"
  [dragEnabled]="true"
  [closeOnOutsideClick]="true"
>
  <div
    style="
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      overflow: auto;
    "
  >
    <!-- Display Total Pending Amount (read-only) -->
    <dx-number-box
      [value]="totalPending"
      [displayValueFormatter]="formatPending"
      label="Total Pending Amount"
      labelMode="floating"
      [readOnly]="true"
      format="#,##0.00"
    ></dx-number-box>

    <!-- Editable Amount Field -->
    <dx-number-box
      [(value)]="fillAmountData.field1"
      label="Received Amount"
      labelMode="floating"
      [showClearButton]="true"
      [format]="'#,##0.00'"
      [min]="0"
      (onValueChanged)="validateAmount($event)"
    ></dx-number-box>

    <div style="min-height: 16px; font-size: 12px; color: red"></div>
    <!-- Action Buttons -->
    <div
      style="
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      "
    >
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        type="normal"
        (onClick)="Cancel()"
      ></dx-button>
      <dx-button
        text="Submit"
        stylingMode="contained"
        type="default"
        (onClick)="submitAmountPopup()"
      ></dx-button>
    </div>
  </div>
</dx-popup>

<dx-popup
  [(visible)]="pdcPopupVisible"
  [width]="700"
  [height]="400"
  [showTitle]="true"
  title="Select PDC"
  [dragEnabled]="true"
  [closeOnOutsideClick]="true"
>
  <div *dxTemplate="let data of 'content'">
    <dx-data-grid
      [dataSource]="pdcList"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [headerFilter]="{ visible: true, allowSearch: true }"
      [allowColumnReordering]="true"
      [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [height]="'45vh'"
      [columnResizingMode]="'nextColumn'"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [selection]="{
        mode: 'single',
        showCheckBoxesMode: 'always',
      }"
      (onRowDblClick)="onPdcSelected($event)"
    >
      <dxi-column dataField="CHEQUE_NO" caption="Cheque No"></dxi-column>
      <dxi-column
        dataField="DUE_DATE"
        caption="Cheque Date"
        dataType="date"
      ></dxi-column>
      <dxi-column dataField="BANK_NAME" caption="Bank Name"></dxi-column>
      <dxi-column
        dataField="AMOUNT"
        caption="Amount"
        dataType="number"
      ></dxi-column>
    </dx-data-grid>
  </div>
</dx-popup>
