<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ================= COLLAPSIBLE FILTER PANEL ================= -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <!-- ROW 1 -->
      <div class="filter-row">
        <dx-select-box
          class="filter-control-year"
          label="Year"
          labelMode="floating"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <dx-select-box
          class="filter-control-month"
          label="Month"
          labelMode="floating"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          placeholder="Month"
        ></dx-select-box>

        <dx-date-box
          class="filter-control-date"
          label="From Date"
          labelMode="floating"
          [(value)]="selected_from_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <dx-date-box
          class="filter-control-date"
          label="To Date"
          labelMode="floating"
          [(value)]="selected_To_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <dx-tag-box
          class="filter-control-unit"
          label="Unit"
          labelMode="floating"
          [dataSource]="unitList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedUnits"
          [showSelectionControls]="true"
          applyValueMode="useButtons"
          [searchEnabled]="true"
          placeholder="Unit"
          [showClearButton]="true"
          [multiline]="false"
        ></dx-tag-box>

        <dx-select-box
          class="filter-control-brand"
          label="Brand"
          labelMode="floating"
          [dataSource]="brandList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedBrand"
          [searchEnabled]="true"
          [showClearButton]="true"
          placeholder="Brand"
        ></dx-select-box>

        <dx-select-box
          class="filter-control-orderfilter"
          label="OrderFilter"
          labelMode="floating"
          [dataSource]="orderFilterList"
          displayExpr="DESCRIPTION"
          valueExpr="DESCRIPTION"
          [(value)]="orderFilter"
          [searchEnabled]="true"
          [acceptCustomValue]="true"
          [showClearButton]="true"
          placeholder="OrderFilter"
          (onCustomItemCreating)="onOrderFilterCustomItemCreating($event)"
        ></dx-select-box>
      </div>

      <!-- ROW 2 -->
      <div class="filter-row">
        <dx-tag-box
          class="filter-control-dealer"
          label="Dealer"
          labelMode="floating"
          [dataSource]="dealerDataSource"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedDealers"
          [showSelectionControls]="true"
          applyValueMode="useButtons"
          [searchEnabled]="true"
          placeholder="Dealer"
          [showClearButton]="true"
          [multiline]="false"
          (onValueChanged)="onDealerChanged($event)"
        ></dx-tag-box>

        <dx-tag-box
          class="filter-control-subdealer"
          label="SubDealer"
          labelMode="floating"
          [dataSource]="subDealerDataSource"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedSubDealers"
          [showSelectionControls]="true"
          applyValueMode="useButtons"
          [searchEnabled]="true"
          placeholder="SubDealer"
          [showClearButton]="true"
          [multiline]="false"
          (onValueChanged)="onSubDealerChanged($event)"
        ></dx-tag-box>

        

        <div class="filter-btn-group">
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            [disabled]="isLoading"
            (onClick)="loadReportData()"
          ></dx-button>
        </div>
      </div>
    </div>

    <!-- ================= HORIZONTAL TOGGLE BAR ================= -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      hint="Toggle Filter Panel"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- ================= DATA GRID ================= -->
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [class.hide-summary]="!isSummaryVisible"
      [dataSource]="reportDataSource"
      width="100%"
      height="82vh"
      noDataText="No records found."
      [showBorders]="true"
      [showColumnLines]="true"
      [showRowLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'widget'"
      [scrolling]="{ mode: 'virtual', showScrollbar: 'always' }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading report...' }"
    >
      <dxo-paging [pageSize]="20"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <!-- Toolbar -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">
            <span>Sales Through Report</span>
          </div>
        </dxi-item>

        <!-- Show/Hide Filter Row -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <!-- Refresh -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <!-- Column Chooser -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show/Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <!-- Excel Export -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="multiple"></dxo-sorting>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterRowVisible">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <!-- Data Columns (Matching API Response: OrderRpt/SalesThrough) -->
      <dxi-column
        dataField="PACKING_ID"
        caption="Packing ID"
        dataType="number"
        alignment="right"
        [visible]="false"
        [width]="110"
      ></dxi-column>

      <dxi-column
        dataField="CATEGORY"
        caption="Category"
        [minWidth]="120"
      ></dxi-column>

      <dxi-column
        dataField="ART_NO"
        caption="Art No"
        [width]="120"
      ></dxi-column>

      <dxi-column
        dataField="COLOR"
        caption="Color"
        [width]="130"
      ></dxi-column>

      <dxi-column
        dataField="PACKING"
        caption="Packing"
        [width]="120"
      ></dxi-column>

      <dxi-column
        dataField="CONTENT"
        caption="Content"
        [minWidth]="140"
      ></dxi-column>

      <dxi-column
        dataField="UNIT"
        caption="Unit"
        [width]="110"
      ></dxi-column>

      <dxi-column
        dataField="ORDER_QTY"
        caption="Order Qty"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="120"
      ></dxi-column>

      <dxi-column
        dataField="ISSUED_QTY"
        caption="Issued Qty"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="120"
      ></dxi-column>

      <dxi-column
        dataField="CANCELLED_QTY"
        caption="Cancelled Qty"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="130"
      ></dxi-column>

      <dxi-column
        dataField="BALANCE_QTY"
        caption="Balance Qty"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="120"
      ></dxi-column>

    </dx-data-grid>

    <!-- ================= CUSTOM COLUMN CHOOSER POPUP ================= -->
    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
      (onHiding)="cancelColumnChooser()"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>
          <div class="column-chooser-actions">
            <dx-button
              text="Select All"
              stylingMode="text"
              (onClick)="selectAllColumns(true)"
            ></dx-button>
            <dx-button
              text="Deselect All"
              stylingMode="text"
              (onClick)="selectAllColumns(false)"
            ></dx-button>
            <dx-button
              text="Reset"
              stylingMode="text"
              (onClick)="resetColumnSelection()"
            ></dx-button>
          </div>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
