<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ================= COLLAPSIBLE FILTER PANEL ================= -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          class="filter-control-year"
          label="Year"
          labelMode="floating"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <dx-tag-box
          class="filter-control-states"
          label="States"
          labelMode="floating"
          [dataSource]="statesList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedStates"
          [showSelectionControls]="true"
          applyValueMode="useButtons"
          [searchEnabled]="true"
          placeholder="States"
          [showClearButton]="true"
          [multiline]="false"
        ></dx-tag-box>

        <dx-tag-box
          class="filter-control-unit"
          label="Unit"
          labelMode="floating"
          [dataSource]="unitList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedUnits"
          [showSelectionControls]="true"
          applyValueMode="useButtons"
          [searchEnabled]="true"
          placeholder="Unit"
          [showClearButton]="true"
          [multiline]="false"
        ></dx-tag-box>

        <div class="filter-btn-group">
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            [disabled]="isLoading"
            (onClick)="loadReportData()"
          ></dx-button>
        </div>
      </div>
    </div>

    <!-- ================= HORIZONTAL TOGGLE BAR ================= -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      hint="Toggle Filter Panel"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- ================= DATA GRID ================= -->
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [class.hide-summary]="!isSummaryVisible"
      [dataSource]="reportDataSource"
      width="100%"
      height="82vh"
      noDataText="No records found."
      [showBorders]="true"
      [showColumnLines]="true"
      [showRowLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'widget'"
      [scrolling]="{ mode: 'virtual', showScrollbar: 'always' }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading report...' }"
    >
      <dxo-paging [pageSize]="20"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <!-- Toolbar -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">
            <span>Dispatch Yearly Report</span>
          </div>
        </dxi-item>

        <!-- Show/Hide Filter Row -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <!-- Refresh -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <!-- Column Chooser -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show/Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <!-- Excel Export -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="multiple"></dxo-sorting>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterRowVisible">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <!-- Article & Entity Info Columns -->
      <dxi-column dataField="BRAND" caption="Brand" [width]="120"></dxi-column>

      <dxi-column
        dataField="ART_NO"
        caption="Art No"
        [width]="120"
      ></dxi-column>

      <dxi-column dataField="COLOR" caption="Color" [width]="120"></dxi-column>

      <dxi-column
        dataField="CATEGORY"
        caption="Category"
        [minWidth]="120"
      ></dxi-column>

      <dxi-column
        dataField="PACKING"
        caption="Packing"
        [width]="130"
      ></dxi-column>

      <dxi-column
        dataField="UNIT_CODE"
        caption="Unit"
        [width]="90"
      ></dxi-column>

      <!-- Monthly Dispatch Columns (Financial Year Order: Apr -> Mar) -->
      <dxi-column
        dataField="APR"
        caption="Apr"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="MAY"
        caption="May"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="JUN"
        caption="Jun"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="JUL"
        caption="Jul"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="AUG"
        caption="Aug"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="SEP"
        caption="Sep"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="OCT"
        caption="Oct"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="NOV"
        caption="Nov"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="DEC"
        caption="Dec"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="JAN"
        caption="Jan"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="FEB"
        caption="Feb"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <dxi-column
        dataField="MAR"
        caption="Mar"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>

      <!-- Total Column -->
      <dxi-column
        dataField="TOTAL"
        caption="Total"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="100"
        cssClass="total-column"
      ></dxi-column>
    </dx-data-grid>

    <!-- ================= CUSTOM COLUMN CHOOSER POPUP ================= -->
    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
      (onHiding)="cancelColumnChooser()"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>
          <div class="column-chooser-actions">
            <dx-button
              text="Select All"
              stylingMode="text"
              (onClick)="selectAllColumns(true)"
            ></dx-button>
            <dx-button
              text="Deselect All"
              stylingMode="text"
              (onClick)="selectAllColumns(false)"
            ></dx-button>
            <dx-button
              text="Reset"
              stylingMode="text"
              (onClick)="resetColumnSelection()"
            ></dx-button>
          </div>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
