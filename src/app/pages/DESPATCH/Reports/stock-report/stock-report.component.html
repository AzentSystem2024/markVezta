<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ================= COLLAPSIBLE FILTER PANEL ================= -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          class="filter-control-brand"
          label="Brand"
          labelMode="floating"
          [dataSource]="brandList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedBrand"
          [searchEnabled]="true"
          [showClearButton]="true"
          placeholder="Brand"
        ></dx-select-box>

        <dx-select-box
          class="filter-control-export"
          label="Export"
          labelMode="floating"
          [dataSource]="exportList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedExport"
          [searchEnabled]="true"
          [showClearButton]="true"
          placeholder="Export"
        ></dx-select-box>

        <div class="filter-btn-group">
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            [disabled]="isLoading"
            (onClick)="loadStockReportData()"
          ></dx-button>
        </div>
      </div>
    </div>

    <!-- ================= HORIZONTAL TOGGLE BAR ================= -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      hint="Toggle Filter Panel"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- ================= DATA GRID ================= -->
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [class.hide-summary]="!isSummaryVisible"
      [dataSource]="stockReportDataSource"
      width="100%"
      height="82vh"
      noDataText="No stock found."
      [showBorders]="true"
      [showColumnLines]="true"
      [showRowLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'widget'"
      [scrolling]="{ mode: 'virtual', showScrollbar: 'always' }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading stock...' }"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">
            <span>Stock Report</span>
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="multiple"></dxo-sorting>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterRowVisible">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <dxi-column
        dataField="IMAGE_NAME"
        caption="Image"
        [width]="75"
        alignment="center"
        cellTemplate="imageCellTemplate"
        [allowFiltering]="false"
        [allowSorting]="false"
      ></dxi-column>

      <dxi-column dataField="ARTICLE_TYPE" caption="Article Type" [width]="100"></dxi-column>
      <dxi-column dataField="BRAND_NAME" caption="Brand" [width]="110"></dxi-column>
      <dxi-column dataField="ART_NO" caption="Art No" [width]="100"></dxi-column>
      <dxi-column dataField="COLOR" caption="Color" [width]="110"></dxi-column>
      <dxi-column dataField="CATEGORY" caption="Category" [width]="110"></dxi-column>
      <dxi-column dataField="SIZE" caption="Size" alignment="center" [width]="80"></dxi-column>

      <dxi-column
        dataField="RFC"
        caption="RFC"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="80"
      ></dxi-column>
      <dxi-column
        dataField="RMC"
        caption="RMC"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="80"
      ></dxi-column>
      <dxi-column
        dataField="BYZ"
        caption="BYZ"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="80"
      ></dxi-column>
      <dxi-column
        dataField="BFC"
        caption="BFC"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="80"
      ></dxi-column>
      <dxi-column
        dataField="HFC"
        caption="HFC"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="80"
      ></dxi-column>
      <dxi-column
        dataField="BPI_KL"
        caption="BPI KL"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>
      <dxi-column
        dataField="BPI_TN"
        caption="BPI TN"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="85"
      ></dxi-column>
      <dxi-column
        dataField="PGS"
        caption="PGS"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="80"
      ></dxi-column>
      <dxi-column
        dataField="QTY_STOCK"
        caption="Qty Stock"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>
      <dxi-column
        dataField="QTY_ORDER"
        caption="Qty Order"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>
      <dxi-column
        dataField="QTY_AVAILABLE"
        caption="Qty Available"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="105"
      ></dxi-column>

      <div *dxTemplate="let cell of 'imageCellTemplate'">
        <img
          *ngIf="cell.value"
          [src]="getImageUrl(cell.value)"
          alt="Art"
          class="art-thumb"
          title="Click to zoom"
          (click)="openImageZoom($event, cell.value)"
        />
        <span *ngIf="!cell.value" class="art-thumb-empty">-</span>
      </div>
    </dx-data-grid>

    <!-- ================= IMAGE ZOOM POPUP (near thumbnail) ================= -->
    <dx-popup
      [(visible)]="isImageZoomVisible"
      [width]="280"
      [height]="'auto'"
      [maxHeight]="360"
      [showTitle]="false"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.25)"
      [position]="imageZoomPosition"
      [wrapperAttr]="{ class: 'image-zoom-popup' }"
      (onHiding)="closeImageZoom()"
    >
      <div class="image-zoom-content">
        <img
          *ngIf="zoomImageUrl"
          [src]="zoomImageUrl"
          alt="Article zoom"
          class="image-zoom-preview"
        />
      </div>
    </dx-popup>

    <!-- ================= CUSTOM COLUMN CHOOSER POPUP ================= -->
    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
      (onHiding)="cancelColumnChooser()"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>
          <div class="column-chooser-actions">
            <dx-button
              text="Select All"
              stylingMode="text"
              (onClick)="selectAllColumns(true)"
            ></dx-button>
            <dx-button
              text="Deselect All"
              stylingMode="text"
              (onClick)="selectAllColumns(false)"
            ></dx-button>
            <dx-button
              text="Reset"
              stylingMode="text"
              (onClick)="resetColumnSelection()"
            ></dx-button>
          </div>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
