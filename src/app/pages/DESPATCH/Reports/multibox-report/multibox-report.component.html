<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ================= COLLAPSIBLE FILTER PANEL ================= -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          class="filter-control-year"
          label="Year"
          labelMode="floating"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <dx-select-box
          class="filter-control-month"
          label="Month"
          labelMode="floating"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          placeholder="Month"
        ></dx-select-box>

        <dx-date-box
          class="filter-control-date"
          label="From Date"
          labelMode="floating"
          [(value)]="selected_from_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <dx-date-box
          class="filter-control-date"
          label="To Date"
          labelMode="floating"
          [(value)]="selected_To_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <div class="filter-btn-group">
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            [disabled]="isLoading"
            (onClick)="loadMultiboxData()"
          ></dx-button>
        </div>
      </div>
    </div>

    <!-- ================= HORIZONTAL TOGGLE BAR ================= -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      hint="Toggle Filter Panel"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- ================= DATA GRID ================= -->
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [class.hide-summary]="!isSummaryVisible"
      [dataSource]="multiboxDataSource"
      keyExpr="ID"
      width="100%"
      height="82vh"
      noDataText="No records found."
      [showBorders]="true"
      [showColumnLines]="true"
      [showRowLines]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'widget'"
      [scrolling]="{ mode: 'virtual', showScrollbar: 'always' }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      (onRowExpanding)="onRowExpanding($event)"
      (onRowCollapsed)="onRowCollapsed($event)"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading multibox report...' }"
    >
      <dxo-paging [pageSize]="20"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <!-- Toolbar -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">
            <span>Multibox Report</span>
          </div>
        </dxi-item>

        <!-- Show/Hide Filter Row -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <!-- Refresh -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <!-- Column Chooser -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show/Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <!-- Excel Export -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="multiple"></dxo-sorting>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterRowVisible">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <!-- Master Detail Configuration -->
      <dxo-master-detail
        [enabled]="true"
        template="detailTemplate"
      ></dxo-master-detail>

      <!-- Master Detail Template (Order View style) -->
      <div
        class="master-detail-flow-container"
        *dxTemplate="let masterData of 'detailTemplate'"
      >
        <div class="flow-arrow"></div>
        <div
          class="detail-grid-container"
          style="position: relative; min-height: 50px"
        >
          <div
            *ngIf="detailLoadingMap[masterData.key]"
            style="text-align: center; padding: 20px"
          >
            <dx-load-indicator [visible]="true"></dx-load-indicator>
            <div style="margin-top: 10px; color: #666">Loading details...</div>
          </div>

          <dx-data-grid
            *ngIf="!detailLoadingMap[masterData.key]"
            [dataSource]="detailDataMap[masterData.key] || []"
            noDataText="No details available"
            [showBorders]="true"
            [showColumnLines]="true"
            [showRowLines]="true"
            [columnAutoWidth]="false"
            [wordWrapEnabled]="false"
            [rowAlternationEnabled]="true"
            rowAlternationInterval="2"
            [allowColumnResizing]="true"
            [columnResizingMode]="'widget'"
            [height]="'30vh'"
          >
            <dxo-scrolling
              mode="virtual"
              rowRenderingMode="virtual"
            ></dxo-scrolling>
            <dxo-paging [pageSize]="20"></dxo-paging>
            <dxo-pager
              [visible]="true"
              [allowedPageSizes]="[10, 20, 50, 'all']"
              [showPageSizeSelector]="true"
              [showInfo]="true"
            ></dxo-pager>

            <dxi-column
              dataField="ART_NO"
              caption="Art No"
              alignment="left"
              [width]="120"
            ></dxi-column>
            <dxi-column
              dataField="COLOR"
              caption="Color"
              alignment="left"
              
            ></dxi-column>
            <dxi-column
              dataField="CATEGORY"
              caption="Category"
              alignment="left"
              
            ></dxi-column>
            <dxi-column
              dataField="SIZE"
              caption="Size"
              alignment="center"
              [width]="90"
            ></dxi-column>
            <dxi-column
              dataField="QUANTITY"
              caption="Quantity"
              dataType="number"
              alignment="right"
              [width]="140"
            ></dxi-column>

            <dxo-summary>
              <dxi-total-item
                column="QUANTITY"
                summaryType="sum"
                displayFormat="Total: {0}"
              ></dxi-total-item>
            </dxo-summary>
          </dx-data-grid>
        </div>
      </div>

      <!-- Grid Columns with fixed widths and user resizable -->
      <dxi-column
        dataField="COMPANY_CODE"
        caption="Unit"
        alignment="left"
        [width]="120"
      ></dxi-column>

      <dxi-column
        dataField="BARCODE"
        caption="Barcode"
        alignment="left"
        [width]="180"
      ></dxi-column>

      <dxi-column
        dataField="PRODUCTION_TIME"
        caption="Production Time"
        alignment="center"
        dataType="datetime"
        [format]="{ type: 'custom', formatter: formatDateTime }"
        [calculateDisplayValue]="formatDateTime"
        [width]="200"
      ></dxi-column>
    </dx-data-grid>
  </div>
</div>

<!-- ================= CUSTOM COLUMN CHOOSER POPUP ================= -->
<dx-popup
  [width]="420"
  [height]="'auto'"
  [showTitle]="true"
  title="Column Chooser"
  [dragEnabled]="true"
  [hideOnOutsideClick]="true"
  [showCloseButton]="true"
  [(visible)]="isColumnChooserVisible"
  [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
>
  <div *dxTemplate="let data of 'content'" class="column-chooser-content">
    <div class="chooser-quick-actions">
      <dx-button
        text="Select All"
        stylingMode="text"
        icon="check"
        (onClick)="selectAllColumns(true)"
      ></dx-button>
      <dx-button
        text="Deselect All"
        stylingMode="text"
        icon="close"
        (onClick)="selectAllColumns(false)"
      ></dx-button>
      <dx-button
        text="Reset"
        stylingMode="text"
        icon="revert"
        (onClick)="resetColumnSelection()"
      ></dx-button>
    </div>

    <div class="chooser-columns-list">
      <div *ngFor="let col of tempColumns" class="chooser-column-item">
        <dx-check-box
          [text]="col.caption"
          [(value)]="col.visible"
        ></dx-check-box>
      </div>
    </div>

    <div class="chooser-footer">
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        (onClick)="cancelColumnChooser()"
      ></dx-button>
      <dx-button
        text="Apply"
        type="default"
        stylingMode="contained"
        (onClick)="applyColumnChooser()"
      ></dx-button>
    </div>
  </div>
</dx-popup>
