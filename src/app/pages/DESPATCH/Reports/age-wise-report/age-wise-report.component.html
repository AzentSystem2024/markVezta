<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ================= COLLAPSIBLE FILTER PANEL ================= -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          class="filter-control-unit"
          label="Unit"
          labelMode="floating"
          [dataSource]="unitList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedUnit"
          [searchEnabled]="true"
          [showClearButton]="true"
          placeholder="Unit"
        ></dx-select-box>

        <dx-select-box
          class="filter-control-export"
          label="Export"
          labelMode="floating"
          [dataSource]="exportList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="selectedExport"
          [searchEnabled]="true"
          [showClearButton]="true"
          placeholder="Export"
        ></dx-select-box>

        <div class="filter-btn-group">
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            [disabled]="isLoading"
            (onClick)="loadAgewiseOrderData()"
          ></dx-button>
        </div>
      </div>
    </div>

    <!-- ================= HORIZONTAL TOGGLE BAR ================= -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      hint="Toggle Filter Panel"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- ================= DATA GRID ================= -->
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [class.hide-summary]="!isSummaryVisible"
      [dataSource]="agewiseOrderDataSource"
      width="100%"
      height="82vh"
      noDataText="No records found."
      [showBorders]="true"
      [showColumnLines]="true"
      [showRowLines]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'widget'"
      [scrolling]="{ mode: 'virtual', showScrollbar: 'always' }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading age-wise report...' }"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <!-- Toolbar -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">
            <span>Age Wise Order Report</span>
          </div>
        </dxi-item>

        <!-- Show/Hide Filter Row -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <!-- Refresh -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <!-- Column Chooser -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show/Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <!-- Excel Export -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="multiple"></dxo-sorting>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterRowVisible">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <!-- Image Column (First column, matching Stock View) -->
      <dxi-column
        dataField="IMAGE_NAME"
        caption="Image"
        [width]="75"
        alignment="center"
        cellTemplate="imageCellTemplate"
        [allowFiltering]="false"
        [allowSorting]="false"
      ></dxi-column>

      <!-- Data Columns (Fixed width, resizable by user) -->
      <dxi-column dataField="BRAND" caption="Brand" [width]="110"></dxi-column>

      <dxi-column dataField="UNIT" caption="Unit" [width]="90"></dxi-column>

      <dxi-column dataField="ArtNo" caption="Art No" [width]="100"></dxi-column>

      <dxi-column dataField="COLOR" caption="Color" [width]="110"></dxi-column>

      <dxi-column
        dataField="CATEGORY"
        caption="Category"
        [width]="110"
      ></dxi-column>

      <dxi-column
        dataField="PACKING"
        caption="Packing"
        [width]="100"
      ></dxi-column>

      <dxi-column
        dataField="TO_30"
        caption="<= 30 Days"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <dxi-column
        dataField="TO_60"
        caption="31-60 Days"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <dxi-column
        dataField="TO_90"
        caption="61-90 Days"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <dxi-column
        dataField="Above_90"
        caption="> 90 Days"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <dxi-column
        dataField="In_Transit"
        caption="In Transit"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <dxi-column
        dataField="TOTAL"
        caption="Total"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 0, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <dxi-column
        dataField="MRP"
        caption="MRP"
        dataType="number"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        [width]="95"
      ></dxi-column>

      <!-- Image Cell Template -->
      <div *dxTemplate="let cell of 'imageCellTemplate'">
        <img
          *ngIf="cell.value"
          [src]="getImageUrl(cell.value)"
          alt="Art"
          class="art-thumb"
          title="Click to zoom"
          (click)="openImageZoom($event, cell.value)"
        />
        <span *ngIf="!cell.value" class="art-thumb-empty">-</span>
      </div>
    </dx-data-grid>

    <!-- ================= IMAGE ZOOM POPUP (near thumbnail) ================= -->
    <dx-popup
      [(visible)]="isImageZoomVisible"
      [width]="280"
      [height]="'auto'"
      [maxHeight]="360"
      [showTitle]="false"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.25)"
      [position]="imageZoomPosition"
      [wrapperAttr]="{ class: 'image-zoom-popup' }"
      (onHiding)="closeImageZoom()"
    >
      <div class="image-zoom-content">
        <img
          *ngIf="zoomImageUrl"
          [src]="zoomImageUrl"
          alt="Article zoom"
          class="image-zoom-preview"
        />
      </div>
    </dx-popup>

    <!-- ================= CUSTOM COLUMN CHOOSER POPUP ================= -->
    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
      (onHiding)="cancelColumnChooser()"
    >
      <div *dxTemplate="let data of 'content'" class="column-chooser-wrapper">
        <!-- Quick Actions Toolbar -->
        <div class="column-chooser-toolbar">
          <dx-button
            text="Select All"
            icon="check"
            stylingMode="text"
            type="default"
            (onClick)="selectAllColumns(true)"
          ></dx-button>
          <dx-button
            text="Deselect All"
            icon="close"
            stylingMode="text"
            type="danger"
            (onClick)="selectAllColumns(false)"
          ></dx-button>
          <dx-button
            text="Reset"
            icon="revert"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <!-- Checkbox List -->
        <div class="column-chooser-list">
          <div *ngFor="let col of tempColumns" class="column-item">
            <dx-check-box
              [(value)]="col.visible"
              [text]="col.caption"
            ></dx-check-box>
          </div>
        </div>

        <!-- Footer Buttons -->
        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            type="normal"
            (onClick)="cancelColumnChooser()"
          ></dx-button>
          <dx-button
            text="Apply"
            stylingMode="contained"
            type="default"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
