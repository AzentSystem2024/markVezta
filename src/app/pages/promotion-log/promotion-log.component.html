<div class="view-wrapper list-page">
  <div>
    <dx-data-grid
      #dataGrid
      [width]="'100%'"
      [height]="'530px'"
      class="grid theme-dependent"
      [dataSource]="promotionLogList"
      [showBorders]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      (onEditingStart)="openEditingStart($event)"
      (onRowRemoving)="onRowRemoving($event)"
      [selection]="{ mode: 'single' }"
    >
      <dxo-scrolling
        mode="standard"
        columnRenderingMode="virtual"
      ></dxo-scrolling>
      <dxo-editing
        mode="popup"
        [allowUpdating]="true"
        [allowDeleting]="true"
      ></dxo-editing>
      <dxo-search-panel
        [visible]="true"
        [highlightCaseSensitive]="false"
      ></dxo-search-panel>
      <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">Promotion</div>
        </dxi-item>
        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="addButtonOptions"
        >
        </dxi-item>
      </dxo-toolbar>

      <dxi-column
        dataField="WS_NO"
        caption="Document No."
        [width]="'150'"
        [allowEditing]="false"
        [visible]="true"
      ></dxi-column>
      <dxi-column
        dataField="WS_DATE"
        caption="Document Date"
        [width]="'180'"
        [allowEditing]="false"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column
        dataField="NARRATION"
        caption="Remarks"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="Status"
        caption="Status"
        [width]="'150'"
        [allowEditing]="false"
        cellTemplate="statusCellTemplate"
      ></dxi-column>
      <div *dxTemplate="let cellData of 'statusCellTemplate'">
        <i
          class="fas fa-flag"
          [ngClass]="getStatusFlagClass(cellData.value)"
          [attr.title]="cellData.value"
        ></i>
      </div>
      <dxi-column
        type="buttons"
        [width]="200"
        [buttons]="allButtons"
      ></dxi-column>
    </dx-data-grid>
  </div>
</div>
<dx-popup
  [(visible)]="editPackPopupOpened"
  [width]="'80vw'"
  [height]="'90vh'"
  title="Update Promotion"
  (onHiding)="handleClose()"
>
  <div *dxTemplate="let data of 'content'">
    <app-edit-promotion
      (popupClosed)="handleClose()"
      [selectedData]="selectedPromotion"
      [status]="StatusType"
    ></app-edit-promotion>
  </div>
</dx-popup>
<dx-popup
  [(visible)]="ViewPopupOpened"
  [width]="'80vw'"
  [height]="'90vh'"
  title="View Promotion"
  (onHiding)="handleClose()"
>
  <div *dxTemplate="let data of 'content'">
    <app-view-promotion-wizard
      (popupClosed)="handleClose()"
      [selectedData]="selectedPromotion"
    ></app-view-promotion-wizard>
  </div>
</dx-popup>
