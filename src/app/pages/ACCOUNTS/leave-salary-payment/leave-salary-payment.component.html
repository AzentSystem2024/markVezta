<div class="view-wrapper list-page">
  <div class="grid">
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="leavePaymentList"
      [showBorders]="true"
      [showColumnLines]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [height]="'calc(100vh - 150px)'"
      [scrolling]="{ mode: 'virtual' }"
      [selection]="{ mode: 'single' }"
    >
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Leave Salary Payments
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-paging [pageSize]="10"></dxo-paging>

      <dxo-pager
        [visible]="true"
        displayMode="full"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-scrolling mode="standard"></dxo-scrolling>

      <dxo-filter-row [visible]="isFilterOpened"></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened"> </dxo-header-filter>

      <dxi-column dataField="VOUCHER_NO" caption="Voucher No"></dxi-column>
      <dxi-column
        dataField="TRANS_DATE"
        caption="Date"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column dataField="EMP_NAME" caption="Employee"></dxi-column>
      <dxi-column
        dataField="LEAVE_SALARY"
        caption="Leave Salary"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="STATUS_DESC"
        caption="Status"
        alignment="center"
        cellTemplate="statusCellRender"
      ></dxi-column>
      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      ></dxi-column>

      <div
        *dxTemplate="let data of 'statusCellRender'"
        style="text-align: center; width: 100%"
      >
        <i
          class="fas fa-flag"
          [style.color]="
            data.data.STATUS_DESC === 'Paid'
              ? '#8B5CF6'
              : data.data.STATUS_DESC === 'Approved'
                ? '#10B981'
                : data.data.STATUS_DESC === 'Verified'
                  ? '#0073D8'
                  : '#FFA500'
          "
          [attr.title]="data.data.STATUS_DESC"
          style="cursor: default"
        ></i>
      </div>

      <div *dxTemplate="let cellData of 'actionTemplate'">
        <!-- Edit -->
        <i
          *ngIf="canEdit"
          class="dx-icon dx-icon-edit"
          [style.opacity]="
            cellData.data.STATUS_DESC === 'Verified' ||
            cellData.data.STATUS_DESC === 'Approved' ||
            cellData.data.STATUS_DESC === 'Paid'
              ? '0.4'
              : '1'
          "
          [style.pointer-events]="
            cellData.data.STATUS_DESC === 'Verified' ||
            cellData.data.STATUS_DESC === 'Approved' ||
            cellData.data.STATUS_DESC === 'Paid'
              ? 'none'
              : 'auto'
          "
          style="cursor: pointer; margin-right: 10px"
          title="Edit"
          (click)="onEditingStart({ data: cellData.data, cancel: false })"
        ></i>

        <!-- Delete -->
        <i
          *ngIf="canDelete"
          class="dx-icon dx-icon-trash"
          [style.opacity]="
            cellData.data.STATUS_DESC === 'Verified' ||
            cellData.data.STATUS_DESC === 'Approved' ||
            cellData.data.STATUS_DESC === 'Paid'
              ? '0.4'
              : '1'
          "
          [style.pointer-events]="
            cellData.data.STATUS_DESC === 'Verified' ||
            cellData.data.STATUS_DESC === 'Approved' ||
            cellData.data.STATUS_DESC === 'Paid'
              ? 'none'
              : 'auto'
          "
          style="cursor: pointer; margin-right: 10px"
          title="Delete"
          (click)="deleteData({ data: cellData.data, cancel: false })"
        ></i>

        <!-- Verify -->
        <span
          *ngIf="
            (cellData.data.STATUS_DESC === 'Verified' && canApprove) ||
            (cellData.data.STATUS_DESC !== 'Verified' &&
              cellData.data.STATUS_DESC !== 'Approved' &&
              cellData.data.STATUS_DESC !== 'Paid' &&
              canVerify)
          "
          style="
            position: relative;
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-left: 10px;
            cursor: pointer;
            vertical-align: middle;
          "
          [title]="
            cellData.data.STATUS_DESC === 'Verified' ? 'Approve' : 'Verify'
          "
          (click)="onVerifyClick({ row: { data: cellData.data } })"
        >
          <!-- Blue badge -->
          <i
            class="fas fa-certificate"
            [style.color]="
              cellData.data.STATUS_DESC === 'Verified' ? '#0073D8' : '#FFA500'
            "
            style="font-size: 18px; position: absolute; top: 0; left: 0"
          ></i>

          <!-- White tick -->
          <i
            class="fas fa-check"
            style="
              color: white;
              font-size: 7px;
              position: absolute;
              top: 5px;
              left: 5px;
              pointer-events: none;
            "
          ></i>
        </span>

        <!-- View -->
        <i
          *ngIf="
            cellData.data.STATUS_DESC === 'Approved' ||
            cellData.data.STATUS_DESC === 'Paid'
          "
          class="fas fa-eye"
          style="
            cursor: pointer;
            margin-left: 10px;
            font-size: 16px;
            color: #6c757d;
            vertical-align: middle;
          "
          title="View"
          (click)="onVerifyClick({ row: { data: cellData.data } })"
        ></i>
      </div>
    </dx-data-grid>
  </div>

  <dx-load-panel
    #loadPanel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ of: '.grid' }"
    container=".grid"
    [(visible)]="isLoading"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="false"
    [hideOnOutsideClick]="false"
  >
  </dx-load-panel>
</div>

<dx-popup
  [(visible)]="popupVisible"
  [width]="'70%'"
  [height]="'auto'"
  [title]="popupTitle"
  [showCloseButton]="true"
  (onHiding)="handleClose()"
>
  <div
    *dxTemplate="let data of 'content'"
    class="leave-form-container"
    style="padding-bottom: 50px"
  >
    <!-- Row 1: Voucher No & Date -->
    <div class="row mb-2 align-items-center">
      <div class="col-md-2">
        <label
          class="form-label mb-0"
          style="font-weight: bold; font-size: 13px"
          >Voucher No</label
        >
      </div>
      <div class="col-md-4">
        <dx-text-box
          [(value)]="leaveFormData.VOUCHER_NO"
          [readOnly]="true"
          width="100%"
        ></dx-text-box>
      </div>
      <div class="col-md-3 text-end">
        <label class="form-label mb-0" style="font-size: 13px">Date</label>
      </div>
      <div class="col-md-3">
        <dx-date-box
          [(value)]="leaveFormData.TRANS_DATE"
          displayFormat="dd-MM-yyyy"
          [readOnly]="true"
          width="100%"
        ></dx-date-box>
      </div>
    </div>

    <!-- Row 2: Employee -->
    <div class="row mb-2 align-items-center">
      <div class="col-md-2">
        <label
          class="form-label mb-0"
          style="font-weight: bold; font-size: 13px"
          >Employee*</label
        >
      </div>
      <div class="col-md-10 d-flex gap-2">
        <dx-select-box
          [dataSource]="EmployeeDropdown"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="leaveFormData.EMP_ID"
          (onValueChanged)="onFetchEmployeeDetails($event)"
          [readOnly]="isReadOnlyMode || !!leaveFormData.TRANS_ID"
          [searchEnabled]="true"
          style="flex: 1"
          placeholder="Select Employee"
        >
          <dx-validator validationGroup="leaveForm">
            <dxi-validation-rule
              type="required"
              message="Employee is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>
      </div>
    </div>

    <!-- Row 3: Leave Credit, Basic Pay, Allowances -->
    <div class="row mb-2 align-items-center">
      <div class="col-md-2">
        <label class="form-label mb-0" style="font-size: 13px"
          >Leave Credit</label
        >
      </div>
      <div class="col-md-2">
        <dx-number-box
          [(value)]="leaveFormData.LEAVE_CREDIT"
          [readOnly]="true"
          width="100%"
          format="#,##0"
        ></dx-number-box>
      </div>
      <div class="col-md-2 text-end">
        <label class="form-label mb-0" style="font-size: 13px">Basic Pay</label>
      </div>
      <div class="col-md-2">
        <dx-number-box
          [(value)]="leaveFormData.BASIC_PAY"
          [readOnly]="true"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
      </div>
      <div class="col-md-2 text-end">
        <label class="form-label mb-0" style="font-size: 13px"
          >Allowances</label
        >
      </div>
      <div class="col-md-2">
        <dx-number-box
          [(value)]="leaveFormData.ALLOWANCES"
          [readOnly]="true"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
      </div>
    </div>

    <!-- Row 4: Radio group for leave type and select vacation button -->
    <div class="row mb-2 align-items-center mt-3">
      <div class="col-md-8 d-flex align-items-center gap-3">
        <dx-radio-group
          [items]="leaveTypeOptions"
          displayExpr="text"
          valueExpr="id"
          [(value)]="leaveFormData.LEAVE_TYPE"
          (onValueChanged)="onLeaveTypeChange($event)"
          layout="horizontal"
          [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
        ></dx-radio-group>
        <dx-button
          text="Select Vacation"
          (onClick)="onSelectVacationClick()"
          [disabled]="
            leaveFormData.LEAVE_TYPE !== 2 ||
            (isReadOnlyMode && !isVerifyMode && !isApproveMode) ||
            !leaveFormData.EMP_ID
          "
        ></dx-button>
      </div>
    </div>

    <!-- Vacation details GroupBox -->
    <fieldset
      class="border p-2 mt-2 mb-3"
      style="border-radius: 5px"
      [style.opacity]="leaveFormData.LEAVE_TYPE === 2 ? 1 : 0.5"
    >
      <legend class="float-none w-auto mb-0 px-2" style="font-size: 13px">
        Vacation details
      </legend>
      <div class="row">
        <div class="col-md-3">
          <dx-text-box
            [(value)]="leaveFormData.VACATION_DOC_NO"
            [readOnly]="true"
            width="100%"
            label="Doc. No"
            labelMode="floating"
          ></dx-text-box>
        </div>
        <div class="col-md-3">
          <dx-date-box
            [(value)]="leaveFormData.VACATION_DEPT_DATE"
            displayFormat="dd-MM-yyyy"
            [readOnly]="true"
            width="100%"
            label="Departure Date"
            labelMode="floating"
          ></dx-date-box>
        </div>
        <div class="col-md-3">
          <dx-number-box
            [(value)]="leaveFormData.VACATION_DAYS"
            [readOnly]="true"
            width="100%"
            format="#,##0"
            label="Vacation Days"
            labelMode="floating"
          ></dx-number-box>
        </div>
        <div class="col-md-3">
          <dx-number-box
            [(value)]="leaveFormData.VACATION_SALARY"
            [readOnly]="true"
            width="100%"
            format="#,##0.00"
            label="Vacation Salary"
            labelMode="floating"
          ></dx-number-box>
        </div>
      </div>
    </fieldset>

    <!-- Row 5: Leave days encashed and Leave Salary -->
    <div class="row mb-2 align-items-center">
      <div class="col-md-3">
        <label class="form-label mb-0" style="font-size: 13px"
          >Leave days Encashed</label
        >
      </div>
      <div class="col-md-3 d-flex align-items-center gap-2">
        <dx-number-box
          [(value)]="leaveFormData.LEAVE_DAYS"
          (onValueChanged)="onLeaveDaysChanged($event)"
          [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
          width="100%"
          format="#,##0"
        ></dx-number-box>
        <span style="font-size: 12px; white-space: nowrap"
          >(Other than vacation days)</span
        >
      </div>
      <div class="col-md-3 text-end">
        <label class="form-label mb-0" style="font-size: 13px"
          >Leave Salary</label
        >
      </div>
      <div class="col-md-3">
        <dx-number-box
          [(value)]="leaveFormData.LEAVE_SALARY"
          (onValueChanged)="calculateTotals()"
          [readOnly]="true"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
      </div>
    </div>

    <!-- Row 6: Total Days and Total Amount -->
    <div class="row mb-2 align-items-center">
      <div class="col-md-3">
        <label
          class="form-label mb-0"
          style="font-weight: bold; font-size: 13px"
          >Total Days</label
        >
      </div>
      <div class="col-md-3">
        <dx-number-box
          [(value)]="leaveFormData.TOTAL_DAYS"
          [readOnly]="true"
          width="100%"
          format="#,##0"
        ></dx-number-box>
      </div>
      <div class="col-md-3 text-end">
        <label
          class="form-label mb-0"
          style="font-weight: bold; font-size: 13px"
          >Total Amount</label
        >
      </div>
      <div class="col-md-3">
        <dx-number-box
          [(value)]="leaveFormData.TOTAL_PAID"
          [readOnly]="true"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
      </div>
    </div>

    <!-- Payment Details GroupBox -->
    <fieldset class="border p-2 mt-3" style="border-radius: 5px">
      <legend class="float-none w-auto mb-0 px-2" style="font-size: 14px">
        Payment Details
      </legend>
      <div class="row mb-2 align-items-center">
        <div class="col-md-2">
          <label class="form-label mb-0" style="font-size: 13px"
            >Payment Mode</label
          >
        </div>
        <div class="col-md-4">
          <dx-radio-group
            [items]="paymentModes"
            displayExpr="text"
            valueExpr="id"
            [(value)]="leaveFormData.PAY_TYPE_ID"
            (onValueChanged)="onReceiptModeChange($event)"
            layout="horizontal"
            [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
          ></dx-radio-group>
        </div>
      </div>
      <div class="row mb-2 align-items-center">
        <div class="col-md-2">
          <label class="form-label mb-0" style="font-size: 13px"
            >Payment Ac</label
          >
        </div>
        <div class="col-md-10 d-flex gap-2">
          <dx-select-box
            [dataSource]="filteredLedgerList"
            displayExpr="HEAD_NAME"
            valueExpr="HEAD_ID"
            [(value)]="leaveFormData.PAY_HEAD_ID"
            [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
            [searchEnabled]="true"
            style="flex: 1"
          >
            <dx-validator validationGroup="leaveForm" *ngIf="isApproveMode">
              <dxi-validation-rule
                type="required"
                message="Ledger is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>
      </div>

      <fieldset
        class="border p-2 mt-2 mx-1"
        style="border-radius: 5px"
        [style.opacity]="leaveFormData.PAY_TYPE_ID == 2 ? 1 : 0.5"
      >
        <legend class="float-none w-auto mb-0 px-2" style="font-size: 12px">
          Bank remittance details
        </legend>
        <div class="row">
          <div class="col-md-6 d-flex align-items-center">
            <label
              class="form-label me-3 mb-0"
              style="font-size: 13px; white-space: nowrap"
              >Cheque No</label
            >
            <dx-text-box
              [(value)]="leaveFormData.CHEQUE_NO"
              [readOnly]="
                (isReadOnlyMode && !isApproveMode && !isVerifyMode) ||
                leaveFormData.PAY_TYPE_ID != 2
              "
              width="100%"
            >
              <dx-validator
                validationGroup="leaveForm"
                *ngIf="isApproveMode && leaveFormData.PAY_TYPE_ID == 2"
              >
                <dxi-validation-rule
                  type="required"
                  message="Reference No is required"
                ></dxi-validation-rule>
              </dx-validator>
            </dx-text-box>
          </div>
          <div class="col-md-6 d-flex align-items-center">
            <label
              class="form-label me-3 mb-0"
              style="font-size: 13px; white-space: nowrap"
              >Due Date</label
            >
            <dx-date-box
              [(value)]="leaveFormData.CHEQUE_DATE"
              displayFormat="dd-MM-yyyy"
              [readOnly]="
                (isReadOnlyMode && !isApproveMode && !isVerifyMode) ||
                leaveFormData.PAY_TYPE_ID != 2
              "
              width="100%"
            >
              <dx-validator
                validationGroup="leaveForm"
                *ngIf="isApproveMode && leaveFormData.PAY_TYPE_ID == 2"
              >
                <dxi-validation-rule
                  type="required"
                  message="Date is required"
                ></dxi-validation-rule>
              </dx-validator>
            </dx-date-box>
          </div>
        </div>
      </fieldset>
    </fieldset>

    <!-- Narration -->
    <div class="row mt-3 mb-2 align-items-center">
      <div class="col-md-2">
        <label class="form-label mb-0" style="font-size: 13px">Narration</label>
      </div>
      <div class="col-md-10">
        <dx-text-box
          [(value)]="leaveFormData.NARRATION"
          [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
          width="100%"
        ></dx-text-box>
      </div>
    </div>

    <!-- Footer Buttons -->
    <div
      class="d-flex justify-content-end align-items-end p-2"
      style="position: absolute; bottom: 0; left: 0; right: 0; height: 50px"
    >
      <div class="d-flex me-2">
        <dx-button
          text="Cancel"
          icon=""
          type="normal"
          stylingMode="outlined"
          (onClick)="handleClose()"
          class="me-2"
        ></dx-button>
        <dx-button
          [text]="leaveFormData.TRANS_ID ? 'Update' : 'Save'"
          icon=""
          type="default"
          stylingMode="outlined"
          validationGroup="leaveForm"
          class="me-2"
          (onClick)="onSave($event)"
          *ngIf="!isReadOnlyMode && !isApproveMode && !isVerifyMode"
        ></dx-button>
        <dx-button
          text="Verify"
          icon=""
          stylingMode="outlined"
          type="default"
          validationGroup="leaveForm"
          class="me-2"
          (onClick)="onVerify($event)"
          *ngIf="isVerifyMode"
        ></dx-button>
        <dx-button
          text="Approve"
          icon=""
          stylingMode="outlined"
          type="default"
          validationGroup="leaveForm"
          class="me-2"
          (onClick)="onApprove($event)"
          *ngIf="isApproveMode"
        ></dx-button>
      </div>
    </div>
  </div>
</dx-popup>

<!-- Vacation Selection Popup -->
<dx-popup
  [(visible)]="vacationPopupVisible"
  [width]="'50%'"
  [height]="'auto'"
  title="Select Vacation"
  [showCloseButton]="true"
>
  <div *dxTemplate="let data of 'content'">
    <dx-data-grid
      [dataSource]="vacationList"
      [showBorders]="true"
      [rowAlternationEnabled]="true"
      [selection]="{ mode: 'single' }"
      height="35vh"
      (onSelectionChanged)="onVacationSelected($event)"
    >
      <dxi-column dataField="DOC_NO" caption="Doc No"></dxi-column>
      <dxi-column
        dataField="DEPT_DATE"
        caption="Departure Date"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column dataField="VAC_DAYS" caption="Days"></dxi-column>
      <dxi-column
        dataField="VACATION_SALARY"
        caption="Vacation Salary"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>
    </dx-data-grid>
    <div class="d-flex justify-content-end mt-3">
      <dx-button
        text="Cancel"
        (onClick)="vacationPopupVisible = false"
        class="me-2"
      ></dx-button>
      <dx-button
        text="Select"
        type="default"
        (onClick)="confirmVacationSelection()"
      ></dx-button>
    </div>
  </div>
</dx-popup>
