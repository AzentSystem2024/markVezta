<div class="zone-add-container">
  <dx-validation-group #validationGroup>
    <dx-form
      [formData]="zoneData"
      [colCount]="2"
      labelLocation="top"
      [showColonAfterLabel]="false"
    >
      <!-- Zone Name -->
      <dxi-item>
        <dx-text-box
          [(value)]="zoneData.ZONE"
          placeholder="Zone"
          stylingMode="outlined"
          label="Zone Name"
          labelMode="floating"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Zone Name is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </dxi-item>

      <!-- Sales Head -->
      <dxi-item>
        <dx-text-box
          [(value)]="zoneData.SALES_HEAD"
          placeholder="Sales Head"
          stylingMode="outlined"
          label="Sales Head"
          labelMode="floating"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Sales Head is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </dxi-item>

      <!-- Zone Email -->
      <dxi-item [colSpan]="2">
        <dx-text-box
          [(value)]="zoneData.EMAIL"
          placeholder="Emails"
          stylingMode="outlined"
          label="Zone Email"
          labelMode="floating"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Email is required"
            ></dxi-validation-rule>
            <!-- <dxi-validation-rule
              type="email"
              message="Please enter a valid email address"
            ></dxi-validation-rule> -->

            <dxi-validation-rule
              type="custom"
              [validationCallback]="validateMultipleEmails"
              message="Please enter valid email addresses separated by commas"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </dxi-item>
    </dx-form>

    <div class="form-buttons">
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        (onClick)="cancelZone()"
      ></dx-button>

      <dx-button
        text="Save"
        type="default"
        stylingMode="contained"
        (onClick)="saveZone()"
      ></dx-button>
    </div>
  </dx-validation-group>

  <!-- Confirmation Popup -->
  <dx-popup
    [(visible)]="isConfirmPopupVisible"
    title="Save Zone Master"
    [width]="300"
    [height]="'auto'"
    [showCloseButton]="true"
    [dragEnabled]="false"
    [hideOnOutsideClick]="false"
  >
    <div class="confirmation-content">
      <p>Do you want to save the zone ?</p>

      <div class="form-buttons">
        <dx-button
          text="Cancel"
          stylingMode="outlined"
          (onClick)="cancelConfirmation()"
        ></dx-button>

        <dx-button
          text="Save"
          type="default"
          stylingMode="contained"
          (onClick)="confirmSaveZone()"
        ></dx-button>
      </div>
    </div>
  </dx-popup>
</div>
