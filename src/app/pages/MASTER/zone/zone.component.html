<div class="view-wrapper list-page">
  <dx-data-grid
    class="grid theme-dependent"
    [dataSource]="ZoneDataSource"
    (onRowRemoving)="onRowRemoving($event)"
    [width]="'100%'"
    [height]="'82vh'"
    [showBorders]="true"
    [allowColumnReordering]="true"
    [showColumnHeaders]="true"
    [columnAutoWidth]="true"
    [allowColumnResizing]="true"
    [rowAlternationEnabled]="true"
    [showColumnLines]="true"
    [scrolling]="{ mode: 'virtual' }"
    (onEditingStart)="onEditingRow($event)"
    (onExporting)="onExporting($event)"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="true"
      [showNavigationButtons]="true"
    ></dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row>
    <dxo-header-filter [visible]="isFilterOpened">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>

    <dxo-filter-builder [allowHierarchicalFields]="true"> </dxo-filter-builder>

    <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row>
    <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>

    <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>

    <dxo-editing
      mode="popup"
      [allowUpdating]="canEdit"
      [allowDeleting]="canDelete"
    >
      <dxo-form [colCount]="1"> </dxo-form>
    </dxo-editing>

    <dxo-toolbar>
      <dxi-item location="before">
        <div
          class="grid-header"
          style="
            font-weight: 600;
            font-size: 20px;
            margin-left: 12px;
            padding: -3px;
            margin-right: 3px;
          "
        >
          Zone
        </div>
      </dxi-item>
      <dxi-item name="searchPanel" locateInMenu="auto"></dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [options]="searchButtonOptions"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [options]="refreshButtonOptions"
      ></dxi-item>
      <dxi-item location="after">
        <div class="toolbar-divider"></div>
      </dxi-item>
      <dxi-item
        name="exportButton"
        location="after"
        cssClass="export-btn"
      ></dxi-item>
      <!-- Divider -->

      <dxi-item
        [visible]="canAdd"
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <dxi-column
      dataField="SL_NO"
      caption="SLNo."
      alignment="center"
    ></dxi-column>
    <dxi-column dataField="ZONE" caption="Zone Name"></dxi-column>
    <dxi-column dataField="SALES_HEAD" caption="Sales Head"></dxi-column>
    <dxi-column dataField="EMAIL" caption="Email"></dxi-column>
  </dx-data-grid>

  <dx-popup
    [(visible)]="isAddZonePopupOpened"
    title="New Zone"
    [height]="'auto'"
    [width]="500"
    (onHiding)="CloseEditForm()"
  >
    <div *ngIf="isAddZonePopupOpened">
      <app-zone-add
        (saveZoneData)="onClickSaveZone($event)"
        (formClosed)="CloseEditForm()"
        [zoneArray]="zoneArray"
      ></app-zone-add>
    </div>
  </dx-popup>

  <dx-popup
    [(visible)]="isEditPopupOpened"
    title="Edit Zone"
    [height]="'auto'"
    [width]="500"
    (onHiding)="CloseEditForm()"
  >
    <div *ngIf="isEditPopupOpened">
      <app-zone-edit
        [selectedZone]="selectedZone"
        (saveZoneData)="onClickUpdateZone($event)"
        (formClosed)="CloseEditForm()"
        [zoneArray]="zoneArray"
      ></app-zone-edit>
    </div>
  </dx-popup>
</div>
