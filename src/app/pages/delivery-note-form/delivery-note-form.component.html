<dx-validation-group #creditNoteGroup>
  <div class="delivery-note-wrapper">
    <!-- Header Card -->
    <div class="delivery-header-card">
      <div class="header-grid">
        <!-- Date -->
        <div class="field-item">
          <dx-date-box
            [(value)]="deliveryFormData.DN_DATE"
            label="Date"
            labelMode="floating"
            displayFormat="dd-MM-yyyy"
            [readOnly]="true"
            width="100%"
          ></dx-date-box>
        </div>

        <!-- Delivery No -->
        <div class="field-item">
          <dx-text-box
            [(value)]="deliveryFormData.DN_NO"
            label="Delivery No"
            labelMode="floating"
            [readOnly]="true"
            width="100%"
          ></dx-text-box>
        </div>

        <!-- Reference No -->
        <div class="field-item">
          <dx-text-box
            [(value)]="deliveryFormData.REF_NO"
            label="Reference No"
            labelMode="floating"
            [readOnly]="isReadOnlyMode"
            width="100%"
          ></dx-text-box>
        </div>

        <!-- Customer -->
        <div class="field-item customer-item">
          <dx-select-box
            [(value)]="deliveryFormData.DISTRIBUTOR_ID"
            [dataSource]="distributorList"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            label="Customer *"
            labelMode="floating"
            [searchEnabled]="true"
            [readOnly]="isReadOnlyMode"
            width="100%"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Customer is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>

        <!-- Add Row Action Button -->
        <div class="field-item action-item" *ngIf="!isReadOnlyMode">
          <dx-button
            text="Add Row"
            icon="plus"
            type="default"
            stylingMode="contained"
            class="add-row-btn"
            [disabled]="isReadOnlyMode"
            (onClick)="addNewRow()"
          >
          </dx-button>
        </div>
      </div>
    </div>

    <!-- Data Grid Container -->
    <div class="grid-container">
      <dx-data-grid
        #itemsGridRef
        [dataSource]="deliveryFormData.Details"
        [showBorders]="true"
        [showColumnLines]="true"
        [columnAutoWidth]="true"
        [rowAlternationEnabled]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [height]="'50vh'"
        [columnResizingMode]="'nextColumn'"
        [scrolling]="{ mode: 'virtual' }"
        rowAlternationInterval="2"
        [selection]="{ mode: 'single' }"
        [editing]="{
          mode: 'cell',
          allowUpdating: !isReadOnlyMode,
          allowDeleting: !isReadOnlyMode,
          allowAdding: false
        }"
        (onInitNewRow)="onInitNewRow($event)"
        (onRowUpdated)="onRowUpdated($event)"
        (onCellValueChanged)="onCellValueChanged($event)"
        (onEditorPreparing)="onEditorPreparing($event)"
        class="custom-retail-grid"
      >
        <dxo-load-panel [showPane]="false"></dxo-load-panel>

        <dxi-column dataField="ITEM_ID" [visible]="false"></dxi-column>
        <dxi-column
          dataField="ITEM_CODE"
          caption="Item Code"
          [allowEditing]="!isReadOnlyMode"
          [editorType]="'dxSelectBox'"
          [lookup]="{
            dataSource: itemsList,
            valueExpr: 'ID',
            displayExpr: 'DESCRIPTION',
            searchEnabled: true,
            searchMode: 'contains',
            minSearchLength: 2,
            showDataBeforeSearch: false,
            paginate: true,
            pageSize: 50
          }"
        ></dxi-column>
        <dxi-column
          dataField="DESCRIPTION"
          caption="Description"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="UOM"
          caption="UOM"
          alignment="center"
          [width]="90"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="QTY_STOCK"
          caption="Stock Qty"
          alignment="center"
          [width]="110"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="PAIR_QTY"
          caption="Pair Qty"
          alignment="center"
          [width]="100"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="TOTAL_PAIR_QTY"
          caption="Total Pair Qty"
          alignment="center"
          [width]="120"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="QUANTITY"
          caption="Quantity"
          alignment="right"
          [width]="120"
          [allowEditing]="true"
        >
          <dxi-validation-rule
            type="custom"
            [validationCallback]="validateQuantity"
            message="Quantity cannot be greater than Stock Qty"
          ></dxi-validation-rule>
        </dxi-column>

        <dxo-summary>
          <dxi-total-item
            column="QUANTITY"
            summaryType="sum"
            displayFormat="Total Qty: {0}"
          ></dxi-total-item>
        </dxo-summary>
      </dx-data-grid>
    </div>

    <!-- Form Footer -->
    <div class="form-footer">
      <!-- Left side: Contact fields -->
      <div class="footer-left">
        <dx-text-box
          [(value)]="deliveryFormData.CONTACT_NAME"
          label="Contact Name"
          labelMode="floating"
          [width]="280"
          [readOnly]="isReadOnlyMode"
        ></dx-text-box>

        <dx-text-box
          [(value)]="deliveryFormData.CONTACT_MOBILE"
          label="Mobile"
          labelMode="floating"
          [width]="200"
          [readOnly]="isReadOnlyMode"
        ></dx-text-box>
      </div>

      <!-- Right side: Approve checkbox & Action buttons -->
      <div class="footer-right">
        <dx-check-box
          [value]="isReadOnlyMode ? true : deliveryFormData.IS_APPROVED"
          (valueChange)="
            !isReadOnlyMode ? (deliveryFormData.IS_APPROVED = $event) : null
          "
          [text]="isReadOnlyMode ? 'Approved' : 'Approve'"
          [readOnly]="isReadOnlyMode"
          class="approve-checkbox"
        ></dx-check-box>

        <div class="footer-actions">
          <dx-button
            text="Cancel"
            (onClick)="cancel()"
            stylingMode="outlined"
            type="normal"
            [width]="95"
          ></dx-button>

          <dx-button
            #saveButtonRef
            [text]="
              isReadOnlyMode
                ? 'PDF'
                : deliveryFormData.IS_APPROVED
                  ? 'Commit'
                  : 'Save'
            "
            (onClick)="isReadOnlyMode ? openPDF() : saveDeliveryNote()"
            stylingMode="contained"
            type="default"
            [width]="110"
          ></dx-button>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>

<dx-popup
  [(visible)]="salesOrderPopupOpened"
  [width]="'70vw'"
  [height]="'75vh'"
  [showTitle]="true"
  title="Add Sales Order"
  (onHiding)="salesOrderPopupOpened = false"
>
  <dx-data-grid
    #quotationGrid
    [dataSource]="salesOrderList"
    [height]="'50vh'"
    [showBorders]="true"
    [showColumnLines]="true"
    [showBorders]="true"
    [columnAutoWidth]="false"
    [wordWrapEnabled]="false"
    [rowAlternationEnabled]="true"
    [allowColumnReordering]="true"
    [showColumnHeaders]="true"
    [columnAutoWidth]="true"
    [allowColumnResizing]="true"
    [columnResizingMode]="'nextColumn'"
    [filterRow]="{ visible: false }"
    [headerFilter]="{ visible: false }"
    [scrolling]="{ mode: 'virtual' }"
    rowAlternationInterval="2"
    [selection]="{ mode: 'multiple', showCheckBoxesMode: 'always' }"
    focusStateEnabled="false"
  >
    <dxo-editing mode="popup"></dxo-editing>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="true"
      [showNavigationButtons]="true"
    ></dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row>
    <dxo-header-filter [visible]="isFilterOpened">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
    <dxo-filter-builder [allowHierarchicalFields]="true"> </dxo-filter-builder>
    <dxo-toolbar>
      <dxi-item
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [visible]="canAdd"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>
    <dxi-column
      dataField="SO_DETAIL_ID"
      caption="Item Code"
      visible="false"
    ></dxi-column>
    <dxi-column dataField="BRAND" caption="Brand"></dxi-column>
    <dxi-column dataField="ART_NO" caption="Art No"></dxi-column>
    <dxi-column dataField="PACKING" caption="Packing"></dxi-column>
    <dxi-column dataField="ARTICLE_TYPE" caption="Article Type"></dxi-column>
    <dxi-column dataField="COLOR" caption="Article Type"></dxi-column>
    <dxi-column dataField="CATEGORY" caption="Category"></dxi-column>
    <dxi-column dataField="QUANTITY" caption="Quantity"></dxi-column>
    <dxi-column dataField="REMARKS" caption="Remark"></dxi-column>
    <!-- <dxi-column
      dataField="totalAmount"
      caption="Amount"
      dataType="number"
    ></dxi-column>
    <dxi-column dataField="status" caption="Status"></dxi-column> -->
  </dx-data-grid>
</dx-popup>
