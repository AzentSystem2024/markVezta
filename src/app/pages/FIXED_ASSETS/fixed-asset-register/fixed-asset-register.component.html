<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="FixedAssetRegister"
      width="100%"
      noDataText=""
      height="82vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      id="dataGrid"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
    >
      <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>

      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <!-- <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="font-weight: 600; font-size: 20px; margin-left: 12px"
          >
            Trial Balance
          </div>
        </dxi-item>
      </dxo-toolbar> -->

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Fixed Asset Register
          </div>
        </dxi-item>

        <dxi-item location="after" template="locationTemplate"></dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <!-- Refresh -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <!-- <dxi-item name="columnChooserButton" locateInMenu="auto"></dxi-item> -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="applyButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <div *dxTemplate="let data of 'locationTemplate'">
        <dx-select-box
          [width]="200"
          label="Location"
          labelMode="floating"
          [items]="DepartmentWithAll"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="select_department_id"
          [searchEnabled]="true"
          [showClearButton]="true"
        >
        </dx-select-box>
      </div>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>

      <!-- <dxi-column dataField="DEPARTMENT_NAME" caption="Department Name" dataType="string"></dxi-column> -->
      <!-- Customer ID -->
      <!-- <dxi-column dataField="CUSTOMER_ID" caption="Customer ID" dataType="number"></dxi-column> -->

      <!-- Customer Name -->
      <dxi-column
        dataField="ASSET_NAME"
        caption="Asset Name"
        dataType="string"
      ></dxi-column>

      <!-- Invoice Date -->
      <dxi-column
        dataField="STORE_CODE"
        caption="Store Code"
        dataType="string"
      ></dxi-column>

      <!-- Age -->
      <dxi-column
        dataField="LOCATION"
        caption="Location"
        dataType="string"
      ></dxi-column>

      <!-- Invoice No -->
      <dxi-column
        dataField="TRANS_DATE"
        caption="Trans Date"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>

      <!-- Reference No -->
      <dxi-column
        dataField="PURCH_VALUE"
        caption="Purch Value"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>

      <!-- Narration -->
      <dxi-column
        dataField="USEFUL_LIFE"
        caption="Useful Life"
        dataType="string"
      ></dxi-column>

      <!-- Net Amount -->
      <dxi-column
        dataField="NET_DEPRECIATION"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Net Depreciation"
        dataType="number"
        format="currency"
      ></dxi-column>

      <!-- Received Amount -->
      <dxi-column
        dataField="CURRENT_ASSETVALUE"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Current Asset Value"
        dataType="number"
        format="currency"
      ></dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      [showTitle]="true"
      title="Choose Columns"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [showCloseButton]="true"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{
        my: 'center',
        at: 'center',
        of: 'window',
      }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select the columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            type="normal"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            type="normal"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            stylingMode="contained"
            type="default"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
