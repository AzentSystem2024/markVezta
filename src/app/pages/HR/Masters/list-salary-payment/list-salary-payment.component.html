<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      noDataText=" "
      [width]="'100%'"
      [height]="'80vh'"
      [loadPanel]="{
        enabled: true,
        text: 'Loading...',
        showIndicator: true,
        showPane: true,
      }"
      class="grid theme-dependent"
      [dataSource]="filteredInvoiceList"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: true, applyFilter: 'auto' }"
      [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'nextColumn'"
      [headerFilter]="{ visible: false }"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [selection]="{ mode: 'single' }"
      focusStateEnabled="false"
      (onEditingStart)="onEditOrViewSalaryPayment($event)"
      (onRowRemoving)="onDeleteSalaryPayment($event)"
      (onExporting)="onExporting($event)"
      (onToolbarPreparing)="onToolbarPreparing($event)"
    >
      <dxo-column-chooser
        [height]="500"
        hideOnOutsideClick="true"
        [enabled]="true"
        mode="select"
      >
      </dxo-column-chooser>
      <dxo-editing
        mode="popup"
        [allowUpdating]="canEdit"
        [allowDeleting]="canDelete"
      ></dxo-editing>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="standard"></dxo-scrolling>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="'auto'"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <!-- <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel> -->
      <dxo-filter-builder [allowHierarchicalFields]="true">
      </dxo-filter-builder>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-header-filter
        [visible]="true"
        [search]="{ enabled: true }"
      ></dxo-header-filter>
      <!-- <dxo-filter-panel [visible]="true"></dxo-filter-panel> -->
      <dxo-filter-builder [allowHierarchicalFields]="true"></dxo-filter-builder>
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Salary Payment
          </div>
        </dxi-item>

        <dxi-item location="after" template="dateFilterTemplate"></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <!-- Export (built-in, kept) -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <div *dxTemplate="let data of 'dateFilterTemplate'">
        <dx-select-box
          [dataSource]="dateRanges"
          [displayExpr]="displayExpr"
          valueExpr="value"
          [(value)]="selectedDateRange"
          (onValueChanged)="onDateRangeChanged($event)"
          (onOpened)="attachItemClickHandler($event)"
          width="250"
        >
          <!-- This controls the dropdown list rendering -->
          <div *dxTemplate="let item of 'item'">
            {{ item.value === "custom" ? "Custom" : item.label }}
          </div>
        </dx-select-box>
      </div>
      <dxi-column dataField="DOC_NO" caption="Voucher No"></dxi-column>

      <dxi-column
        dataField="TRANS_DATE"
        caption="Date"
        dataType="date"
        [allowEditing]="false"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column dataField="BANK_NAME" caption="Bank"></dxi-column>
      <dxi-column dataField="NARRATION" caption="Narration"></dxi-column>

      <dxi-column
        caption="Status"
        dataField="TRANS_STATUS"
        [width]="140"
        cellTemplate="statusCellRender"
        [allowHeaderFiltering]="true"
        [headerFilter]="{
          dataSource: getStatusFilterData,
          encodeHtml: false,
        }"
      >
      </dxi-column>
      <div *dxTemplate="let data of 'statusCellRender'">
        <div style="text-align: center; width: 100%">
          <span
            [ngClass]="{
              'flag-pending': data.data.TRANS_STATUS == 1,
              'flag-verified': data.data.TRANS_STATUS == 2,
              'flag-approved': data.data.TRANS_STATUS == 5,
              'flag-paid': data.data.TRANS_STATUS == 6,
            }"
          >
            {{
              data.data.TRANS_STATUS == 1
                ? "Open"
                : data.data.TRANS_STATUS == 2
                  ? "Verified"
                  : data.data.TRANS_STATUS == 5
                    ? "Approved"
                    : data.data.TRANS_STATUS == 6
                      ? "Paid"
                      : ""
            }}
          </span>
        </div>
      </div>
      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      >
      </dxi-column>
      <div *dxTemplate="let cellData of 'actionTemplate'">
        <div class="action-icons">
          <!-- edit icon -->
          <i
            *ngIf="canEdit || canView"
            class="dx-icon dx-icon-edit"
            [title]="cellData.data.TRANS_STATUS === 1 ? 'Edit' : 'Details'"
            (click)="
              onEditOrViewSalaryPayment({ data: cellData.data, cancel: false })
            "
          ></i>

          <!-- Delete -->
          <i
            *ngIf="canDelete"
            class="dx-icon dx-icon-trash"
            [style.opacity]="
              canDelete && cellData.data.TRANS_STATUS === 1 ? '1' : '0.4'
            "
            [style.pointer-events]="
              canDelete && cellData.data.TRANS_STATUS === 1 ? 'auto' : 'none'
            "
            title="Delete"
            (click)="
              onDeleteSalaryPayment({ data: cellData.data, cancel: false })
            "
          ></i>

          <!-- Verify/Approve/View Icon -->
          <span
            class="verify-badge"
            [ngClass]="{
              'status-pending': cellData.data.TRANS_STATUS == 1,
              'status-verified': cellData.data.TRANS_STATUS == 2,
              'status-approved': cellData.data.TRANS_STATUS == 5,
            }"
            [class.disabled]="isVerifyApproveDisabled(cellData.data)"
            (click)="onverifyClick({ row: { data: cellData.data } })"
          >
          </span>
        </div>
      </div>
    </dx-data-grid>
  </div>
</div>

<dx-popup
  [(visible)]="addSalaryPopup"
  [width]="'60vw'"
  [height]="'auto'"
  title="Salary Payment"
>
  <app-add-salary-payment
    *ngIf="addSalaryPopup"
    (popupClosed)="handleClose()"
  ></app-add-salary-payment>
</dx-popup>

<dx-popup
  [(visible)]="editSalaryPopup"
  [width]="'60vw'"
  [height]="'auto'"
  title="Salary Payment"
>
  <app-add-salary-payment
    *ngIf="editSalaryPopup"
    [isEditing]="true"
    [EditingResponseData]="selectedSalaryData"
    [isReadOnlyMode]="isReadOnlyPayment"
    (popupClosed)="handleClose()"
  ></app-add-salary-payment>
</dx-popup>

<dx-popup
  [(visible)]="verifySalaryPopup"
  [width]="'60vw'"
  [height]="'auto'"
  title="Verify Salary Payment"
>
  <app-add-salary-payment
    *ngIf="verifySalaryPopup"
    [isEditing]="true"
    [isVerifying]="true"
    [EditingResponseData]="selectedSalaryData"
    [isReadOnlyMode]="false"
    (popupClosed)="handleClose()"
  ></app-add-salary-payment>
</dx-popup>

<dx-popup
  [(visible)]="approveSalaryPopup"
  [width]="'60vw'"
  [height]="'auto'"
  title="Approve Salary Payment"
>
  <app-add-salary-payment
    *ngIf="approveSalaryPopup"
    [isEditing]="true"
    [isApproving]="true"
    [EditingResponseData]="selectedSalaryData"
    [isReadOnlyMode]="false"
    (popupClosed)="handleClose()"
  ></app-add-salary-payment>
</dx-popup>

<app-custom-date-popup
  [(visible)]="showCustomDatePopup"
  [startDate]="customStartDate"
  [endDate]="customEndDate"
  (applyDates)="onCustomDateApplied($event)"
>
</app-custom-date-popup>
