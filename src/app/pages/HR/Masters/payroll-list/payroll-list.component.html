<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      noDataText="No data available"
      [width]="'100%'"
      [height]="'82vh'"
      [loadPanel]="{
        enabled: true,
        text: 'Loading...',
        showIndicator: true,
        showPane: true,
      }"
      class="grid theme-dependent"
      [dataSource]="payrollList"
      [showBorders]="true"
      [showColumnLines]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'nextColumn'"
      [headerFilter]="{ visible: false }"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [repaintChangesOnly]="true"
      (onEditingStart)="onEditOrViewPayroll($event)"
      (onRowRemoving)="onDeletePayroll($event)"
      (onSelectionChanged)="onSelectionChanged($event)"
      (onCellPrepared)="onCellPrepared($event)"
      (onEditorPreparing)="onEditorPreparing($event)"
      [selectedRowKeys]="selectedRowKeys"
      keyExpr="SALARY_BILL_NO"
    >
      <dxo-editing
        mode="popup"
        [allowUpdating]="canEdit"
        [allowDeleting]="canDelete"
      ></dxo-editing>
      <dxo-export
        [enabled]="true"
        [allowExportSelectedData]="false"
        [formats]="['xlsx']"
      >
      </dxo-export>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
      <dxo-filter-builder [allowHierarchicalFields]="true">
      </dxo-filter-builder>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Payroll
          </div>
        </dxi-item>

        <dxi-item location="after">
          <div
            class="month-selector"
            style="display: flex; align-items: center; gap: 8px"
          >
            <div class="nav-btn" (click)="goToPreviousMonth()">
              <i class="dx-icon dx-icon-chevronleft"></i>
            </div>
            <span class="month-label" (click)="toggleCalendar()">
              {{ selectedMonth | date: "MMMM yyyy" }}
            </span>
            <!-- ▶ Next -->
            <div class="nav-btn" (click)="goToNextMonth()">
              <i class="dx-icon dx-icon-chevronright"></i>
            </div>
          </div>
          <div *ngIf="calendarVisible" class="calendar-popup">
            <div class="calendar-header" style="justify-content: center">
              <!-- <dx-button [options]="previousYearButtonOptions"></dx-button> -->

              <span class="year-clickable" (click)="toggleYearSelector()">
                {{ selectedYear }}
              </span>

              <!-- <dx-button [options]="nextYearButtonOptions"></dx-button> -->
            </div>

            <div
              class="year-selector-popup"
              *ngIf="yearSelectorVisible"
              (click)="$event.stopPropagation()"
            >
              <div class="year-grid">
                <div
                  class="year-option"
                  *ngFor="let year of years"
                  (click)="selectYear(year, $event)"
                >
                  {{ year }}
                </div>
              </div>
            </div>

            <div class="calendar-body">
              <div
                *ngFor="let monthName of monthNames; let idx = index"
                class="month-cell"
                [class.selected]="
                  idx === selectedMonth.getMonth() &&
                  selectedYear === selectedMonth.getFullYear()
                "
                (click)="selectMonthByIndex(idx)"
              >
                {{ monthName }}
              </div>
            </div>
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
        <!-- <dxi-item
          name="approveButton"
          location="after"
          widget="dxButton"
          [options]="approveButtonOptions"
        ></dxi-item> -->
        <!-- <dxi-item
          *ngIf="canVerify"
          location="after"
          widget="dxButton"
          [options]="VerifyButtonOptions"
        ></dxi-item>
        <dxi-item
          *ngIf="canApprove"
          location="after"
          widget="dxButton"
          [options]="approveButtonOptions"
        ></dxi-item> -->
      </dxo-toolbar>

      <dxi-column dataField="EMPLOYEE_NO" caption="Employee No."></dxi-column>
      <dxi-column
        dataField="EMPLOYEE_NAME"
        caption="Employee Name"
      ></dxi-column>
      <dxi-column
        dataField="WORKED_DAYS"
        caption="Total Days"
        alignment="right"
      ></dxi-column>
      <dxi-column
        dataField="NET_AMOUNT"
        caption="Net Salary"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="STATUS"
        caption="Status"
        alignment="center"
        cellTemplate="statusCellRender"
      >
      </dxi-column>

      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      >
      </dxi-column>

      <!-- <div
        *dxTemplate="let data of 'statusCellRender'"
        style="text-align: center; width: 100%"
      >
        <i
          class="fas fa-flag"
          [style.color]="
            data.data.STATUS === 'Paid'
              ? '#8B5CF6'
              : data.data.STATUS === 'Approved'
                ? '#10B981'
                : data.data.STATUS === 'Verified'
                  ? '#0073D8'
                  : '#FFA500'
          "
          [attr.title]="data.data.STATUS"
          style="cursor: default"
        ></i>
      </div> -->

      <div
        *dxTemplate="let data of 'statusCellRender'"
        style="text-align: center; width: 100%"
      >
        <span
          [ngClass]="{
            'flag-paid': data.data.STATUS === 'Paid',
            'flag-approved': data.data.STATUS === 'Approved',
            'flag-verified': data.data.STATUS === 'Verified',
            'flag-pending': data.data.STATUS === 'Pending',
          }"
        >
          {{ data.data.STATUS === "Pending" ? "Open" : data.data.STATUS }}
        </span>
      </div>
      <div *dxTemplate="let cellData of 'actionTemplate'">
        <div class="action-icons">
          <!-- Edit -->
          <i
            *ngIf="canEdit || canView"
            class="dx-icon dx-icon-edit"
            [title]="cellData.data.STATUS === 'Pending' ? 'Edit' : 'Details'"
            (click)="
              onEditOrViewPayroll({ data: cellData.data, cancel: false })
            "
          ></i>

          <!-- Delete -->
          <i
            *ngIf="canDelete"
            class="dx-icon dx-icon-trash"
            [style.opacity]="cellData.data.STATUS !== 'Pending' ? '0.4' : '1'"
            [style.pointer-events]="
              cellData.data.STATUS !== 'Pending' ? 'none' : 'auto'
            "
            (click)="onDeletePayroll({ data: cellData.data, cancel: false })"
          >
          </i>

          <!-- Verify -->
          <span
            *ngIf="canVerify || canApprove"
            class="verify-badge"
            [ngClass]="{
              'status-paid': cellData.data.STATUS === 'Paid',
              'status-approved': cellData.data.STATUS === 'Approved',
              'status-verified': cellData.data.STATUS === 'Verified',
              'status-pending': cellData.data.STATUS === 'Pending',
            }"
            [class.disabled]="
              (cellData.data.STATUS === 'Approved' && canEdit) ||
              (cellData.data.STATUS === 'Pending' && !canVerify) ||
              (cellData.data.STATUS === 'Verified' && !canApprove) ||
              (cellData.data.STATUS === 'Paid' && canEdit)
            "
            [title]="
              cellData.data.STATUS === 'Paid'
                ? 'Paid'
                : cellData.data.STATUS === 'Approved'
                  ? 'Approved'
                  : cellData.data.STATUS === 'Verified'
                    ? 'Approve'
                    : 'Verify'
            "
            (click)="
              onVerifyOrApproveIconClick({ data: cellData.data, cancel: false })
            "
          >
          </span>
        </div>
      </div>
    </dx-data-grid>
  </div>
</div>

<dx-popup
  *ngIf="addPayrollPopupOpened"
  [(visible)]="addPayrollPopupOpened"
  [width]="'60vw'"
  [height]="'80vh'"
  title="New Payroll - Select Timesheet - {{ selectedMonthForAdd }}"
  (onHiding)="handleClose()"
>
  <app-payroll-add
    [selectedMonth]="selectedMonthForAdd"
    (popupClosed)="handleClose()"
  ></app-payroll-add>
</dx-popup>

<dx-popup
  [(visible)]="editPayrollPopupOpened"
  [width]="'70vw'"
  [height]="'85vh'"
  title="{{ PopupTitle }}"
  (onHiding)="handleClose()"
>
  <app-payroll-edit
    *ngIf="editPayrollPopupOpened"
    [selectedMonth]="selectedMonthForAdd"
    [payroll]="selectedPayroll"
    [isVerifyMode]="isVerifyMode"
    [isApproveMode]="isApproveMode"
    [isReadOnlyMode]="isReadOnlyMode"
    (popupClosed)="handleClose()"
  ></app-payroll-edit>
</dx-popup>
