<div class="view-wrapper list-page">
  <div *ngIf="isLoading" class="loading-overlaaay">
    <div class="spinner"></div>
  </div>
  <dx-data-grid
    class="grid theme-dependent"
    [dataSource]="Advance_Options"
    [remoteOperations]="false"
    [showBorders]="true"
    [width]="'100%'"
    [height]="'82vh'"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    noDataText=" "
    [showColumnLines]="true"
    (onEditingStart)="onEditStart($event)"
    (onRowRemoved)="deleteData($event)"
    [scrolling]="{ mode: 'virtual' }"
    [filterRow]="{ visible: false }"
    [headerFilter]="{ visible: false }"
    (onExporting)="onExporting($event)"
  >
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>

    <dxo-header-filter [visible]="isFilterOpened">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-builder [allowHierarchicalFields]="true"> </dxo-filter-builder>
    <dxo-editing mode="popup" [allowUpdating]="true" [allowDeleting]="true">
    </dxo-editing>
    <dxo-scrolling mode="standard"></dxo-scrolling>

    <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
    <dxo-paging [pageSize]="10"></dxo-paging>

    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="true"
      [showNavigationButtons]="true"
    ></dxo-pager>

    <dxo-column-chooser
      [height]="500"
      hideOnOutsideClick="true"
      [enabled]="true"
      mode="select"
    >
    </dxo-column-chooser>

    <dxo-toolbar>
      <dxi-item location="before">
        <div
          class="grid-header"
          style="
            font-weight: 600;
            font-size: 20px;
            margin-left: 12px;
            padding: -3px;
            margin-right: 3px;
          "
        >
          Salary Advance
        </div>
      </dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="searchButtonOptions"
      ></dxi-item>
      <!-- Refresh -->
      <dxi-item
        location="after"
        widget="dxButton"
        [options]="refreshButtonOptions"
      ></dxi-item>

      <dxi-item location="after">
        <div class="toolbar-divider"></div>
      </dxi-item>

      <!-- Export (built-in, kept) -->
      <dxi-item
        name="exportButton"
        location="after"
        cssClass="export-btn"
      ></dxi-item>

      <dxi-item
        *ngIf="canAdd"
        location="after"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>
    <dxi-column
      dataField="serialNo"
      caption="Sl.No"
      alignment="left"
      [allowEditing]="true"
      [allowFiltering]="false"
    ></dxi-column>
    <dxi-column
      dataField="ADV_NO"
      caption="Doc.No"
      alignment="left"
      [allowEditing]="true"
      [allowFiltering]="false"
    ></dxi-column>
    <dxi-column dataField="DATE" caption="Date"></dxi-column>
    <dxi-column
      dataField="EMP_NO"
      caption="Employee No"
      alignment="left"
    ></dxi-column>
    <dxi-column dataField="EMP_NAME" caption="Employee Name"></dxi-column>
    <dxi-column dataField="ADV_TYPES" caption="Advance Type"></dxi-column>

    <dxi-column
      dataField="AMOUNT"
      caption="Amount"
      alignment="right"
      [format]="{ type: 'fixedPoint', precision: 2 }"
    ></dxi-column>

    <dxi-column
      caption="Status"
      dataField="STATUS"
      [width]="140"
      cellTemplate="statusCellRender"
      [allowHeaderFiltering]="true"
      [headerFilter]="{
        dataSource: getStatusFilterData,
        encodeHtml: false,
      }"
    >
    </dxi-column>

    <div *dxTemplate="let data of 'statusCellRender'">
      <div style="text-align: center; width: 100%">
        <span
          [ngClass]="{
            'flag-pending': data.data.STATUS === 'Open',
            'flag-verified': data.data.STATUS === 'Verified',
            'flag-approved': data.data.STATUS === 'Approved',
          }"
        >
          {{ data.data.STATUS }}
        </span>
      </div>
    </div>

    <dxi-column
      type="buttons"
      caption="Actions"
      [width]="140"
      cellTemplate="actionTemplate"
    >
    </dxi-column>
    <div *dxTemplate="let cellData of 'actionTemplate'">
      <div class="action-icons">
        <!-- Edit -->
        <i
          *ngIf="canEdit || canView"
          class="dx-icon dx-icon-edit"
          [style.opacity]="isEditDisabled(cellData.data) ? '0.4' : '1'"
          [style.pointer-events]="
            isEditDisabled(cellData.data) ? 'none' : 'auto'
          "
          [title]="getEditActionTitle(cellData.data)"
          (click)="
            !isEditDisabled(cellData.data) &&
              onEditStart({ data: cellData.data, cancel: false })
          "
        ></i>

        <!-- Delete -->
        <i
          *ngIf="canDelete"
          class="dx-icon dx-icon-trash"
          [style.opacity]="isDeleteDisabled(cellData.data) ? '0.4' : '1'"
          [style.pointer-events]="
            isDeleteDisabled(cellData.data) ? 'none' : 'auto'
          "
          title="Delete"
          (click)="
            !isDeleteDisabled(cellData.data) &&
              deleteData({ data: cellData.data, cancel: false })
          "
        ></i>

        <!-- Verify -->
        <span
          *ngIf="showVerifyApproveBadge(cellData.data)"
          class="verify-badge"
          [style.opacity]="isVerifyApproveDisabled(cellData.data) ? '0.4' : '1'"
          [style.pointer-events]="
            isVerifyApproveDisabled(cellData.data) ? 'none' : 'auto'
          "
          [title]="getVerifyApproveTitle(cellData.data)"
          (click)="
            !isVerifyApproveDisabled(cellData.data) &&
              onVerifyAction(cellData.data)
          "
        >
          <!-- Blue badge -->
          <i
            class="fas fa-certificate"
            [style.color]="
              cellData.data.STATUS === 'Approved'
                ? '#10B981'
                : cellData.data.STATUS === 'Verified'
                  ? '#0073D8'
                  : '#FFA500'
            "
            style="font-size: 18px; position: absolute; top: 0; left: 0"
          ></i>

          <!-- White tick -->
          <i
            class="fas fa-check"
            style="
              color: white;
              font-size: 7px;
              position: absolute;
              top: 5px;
              left: 5px;
              pointer-events: none;
            "
          ></i>
        </span>
      </div>
    </div>
  </dx-data-grid>
</div>

<!-- =========== Add Form ============ -->
<form-popup
  (onHiding)="closeButton()"
  [(visible)]="isAddPopUp"
  titleText="Advance "
  [width]="600"
  height="'100vh'"
  [dragEnabled]="true"
  (save)="Add_Advace()"
  (cancel)="close()"
  [showApprove]="false"
>
  <dx-validation-group class="form-grid" #formValidationGroup>
    <dx-form id="form" [formGroup]="formSource">
      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <!-- Date Picker -->
        <dxi-item>
          <dx-date-box
            label="Date"
            placeholder="dd/mm/yyyy"
            [showClearButton]="true"
            [useMaskBehavior]="true"
            [displayFormat]="'dd/MM/yyyy'"
            type="date"
            [inputAttr]="{ 'aria-label': 'Date' }"
            formControlName="Date"
            [labelMode]="'floating'"
          ></dx-date-box>
        </dxi-item>
      </dxi-item>
      <dxi-item class="select-box">
        <dx-select-box
          [(value)]="employee_ID"
          [items]="EMPLOYEE_VALUE"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          label="Employee *"
          [labelMode]="'floating'"
          [searchEnabled]="true"
          placeholder="Select.."
          formControlName="employee_ID"
          (onValueChanged)="onEmployee_Change($event)"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="This field is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>
      </dxi-item>

      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <dxi-item>
          <dx-number-box
            label="Amount *"
            [labelMode]="'floating'"
            formControlName="Amount"
            valueChangeEvent="input"
            format="#,##0.00"
            (onValueChanged)="onAmountInput($event)"
            [inputAttr]="{ style: 'text-align: right;' }"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="This field is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </dxi-item>
        <dxi-item class="select-box">
          <dx-select-box
            [(value)]="Advance_types_ID"
            [items]="ADVANCETYPE_VALUE"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [labelMode]="'floating'"
            label="Advance Type *"
            formControlName="Advance_types_ID"
            [searchEnabled]="true"
            placeholder="Select.."
            (onValueChanged)="onAdvance_type_Change($event)"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="This field is required"
              ></dxi-validation-rule> </dx-validator
          ></dx-select-box>
        </dxi-item>
      </dxi-item>

      <dxi-item style="text-align: center">
        <label
          style="
            display: block;
            text-align: left;
            text-decoration: underline;
            text-underline-offset: 4px;
          "
        >
          Recovery details:
        </label>
      </dxi-item>

      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <dxi-item>
          <dx-number-box
            [inputAttr]="{ style: 'text-align: right;' }"
            label="Net amount to be recovered"
            [labelMode]="'floating'"
            formControlName="Net_Amount_recoverd"
            format="#,##0.00"
            valueChangeEvent="input"
          ></dx-number-box>
        </dxi-item>
        <dxi-item>
          <dx-text-box
            label="Amt. Recovered through Salary"
            [inputAttr]="{
              style: 'text-align: right; color: #0284c7; font-weight: bold;',
            }"
            valueChangeEvent="input"
            [readOnly]="true"
            [labelMode]="'floating'"
          ></dx-text-box>
        </dxi-item>
      </dxi-item>

      <dxi-item itemType="group" [colCount]="3" [colSpan]="3">
        <dxi-item
          ><dx-number-box
            label="No of  installments"
            [inputAttr]="{ style: 'text-align: right;' }"
            valueChangeEvent="input"
            [labelMode]="'floating'"
            formControlName="No_installments"
          ></dx-number-box
        ></dxi-item>

        <dxi-item
          ><dx-number-box
            label="Installment Amount"
            valueChangeEvent="input"
            [labelMode]="'floating'"
            format="#,##0.00"
            formControlName="installmen_amt"
            [inputAttr]="{ style: 'text-align: right;' }"
          ></dx-number-box
        ></dxi-item>
        <dxi-item>
          <dx-date-box
            [labelMode]="'floating'"
            label="Recovery Starts from"
            [showClearButton]="true"
            displayFormat="MMMM/yyyy"
            [min]="minDate"
            pickerType="calendar"
            formControlName="Recovery_Date"
            [inputAttr]="{ 'aria-label': 'Recovery_Date' }"
            [calendarOptions]="{
              maxZoomLevel: 'year',
              minZoomLevel: 'century',
            }"
            (onValueChanged)="onRecoveryDateChanged($event)"
          >
          </dx-date-box>
        </dxi-item>
      </dxi-item>
      <dxi-item
        ><dx-text-box
          label="Remarks"
          valueChangeEvent="input"
          formControlName="Remarks"
        ></dx-text-box
      ></dxi-item>
    </dx-form>
  </dx-validation-group>
</form-popup>

<!-- =========== Edit Advance ================ -->
<form-popup
  (onHiding)="closeButton()"
  [(visible)]="isEditPopUp"
  titleText="Advance "
  [width]="640"
  height="'100vh'"
  [dragEnabled]="true"
  (save)="Update_advance()"
  (cancel)="close()"
  [saveButtonText]="buttonText"
  [showApprove]="false"
  [isSaveDisabled]="isEditReadOnly"
>
  <dx-validation-group #editValidationGroup>
    <dx-form id="form">
      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <!-- Date Picker -->
        <dxi-item>
          <dx-date-box
            label="Date"
            [(value)]="date_value"
            displayFormat="dd/MM/yyyy"
            [pickerType]="'calendar'"
            [readOnly]="isEditReadOnly"
            (onValueChanged)="onDateValueChanged($event)"
            [labelMode]="'floating'"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Date is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-date-box>
        </dxi-item>
      </dxi-item>

      <dxi-item class="select-box">
        <dx-select-box
          [(value)]="emp_id"
          [items]="EMPLOYEE_VALUE"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [searchEnabled]="true"
          [readOnly]="isEditReadOnly"
          placeholder="Select.."
          dataField="employee_name"
          label="Employee *"
          (onValueChanged)="onEmployee_Change($event)"
          [labelMode]="'floating'"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Employee is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>
      </dxi-item>

      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <dxi-item class="select-box">
          <dx-select-box
            [(value)]="adv_type_id_value"
            [items]="ADVANCETYPE_VALUE"
            displayExpr="DESCRIPTION"
            [readOnly]="isEditReadOnly"
            valueExpr="ID"
            [searchEnabled]="true"
            [displayCustomValue]="true"
            placeholder="Select.."
            label="Advance Types *"
            (onValueChanged)="onAdvance_type_Change($event)"
            [labelMode]="'floating'"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Advance Type is required"
              ></dxi-validation-rule>
            </dx-validator>
            <ng-template let-data dxTemplate="value">
              {{ getAdvanceTypeName(data) }}
            </ng-template>
          </dx-select-box>
        </dxi-item>

        <dxi-item>
          <dx-number-box
            label="Amount *"
            format="#,##0.00"
            valueChangeEvent="input"
            [readOnly]="isEditReadOnly"
            [(value)]="Advance_Amount_value"
            (onValueChanged)="onAmountInput($event)"
            [inputAttr]="{ style: 'text-align: right;' }"
            [labelMode]="'floating'"
          >
            <dx-validator>
              <dxi-validation-rule
                type="required"
                message="Amount is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </dxi-item>
      </dxi-item>

      <dxi-item style="text-align: left">
        <label style="text-decoration: underline; text-underline-offset: 4px">
          Recovery details:
        </label>
      </dxi-item>
      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <dxi-item>
          <dx-number-box
            label="Net amount to be recovered"
            format="#,##0.00"
            [readOnly]="isEditReadOnly"
            valueChangeEvent="input"
            [(value)]="reco_Amount_value"
            [inputAttr]="{ style: 'text-align: right;' }"
            (valueChange)="onNetAmountUpdateChange()"
            [labelMode]="'floating'"
          ></dx-number-box>
        </dxi-item>

        <dxi-item>
          <dx-number-box
            label="Amt. Recovered through Salary"
            [inputAttr]="{
              style: 'text-align: right; color: #0284c7; font-weight: bold;',
            }"
            valueChangeEvent="input"
            [(value)]="recoverd_Amt_value"
            [readOnly]="true"
            [labelMode]="'floating'"
            format="#,##0.00"
          ></dx-number-box>
        </dxi-item>
      </dxi-item>

      <dxi-item itemType="group" [colCount]="3" [colSpan]="3">
        <dxi-item>
          <dx-number-box
            label="No of installments"
            valueChangeEvent="input"
            [format]="'#,##0.##'"
            [readOnly]="isEditReadOnly"
            [(value)]="reco_inst_count_value"
            (valueChange)="onInstallmentCountChange()"
            [inputAttr]="{ style: 'text-align: right;' }"
            [labelMode]="'floating'"
          ></dx-number-box>
        </dxi-item>

        <dxi-item>
          <dx-number-box
            label="Installment Amount"
            format="#,##0.00"
            valueChangeEvent="input"
            [readOnly]="isEditReadOnly"
            [(value)]="reco_install_Amount_value"
            [readOnly]="true"
            [labelMode]="'floating'"
          ></dx-number-box>
        </dxi-item>

        <dxi-item>
          <dx-date-box
            label="Recovery Starts from"
            [showClearButton]="true"
            displayFormat="MMMM/yyyy"
            pickerType="calendar"
            [readOnly]="isEditReadOnly"
            [min]="minDateUpdate"
            (onValueChanged)="onRecoveryDateChanged($event)"
            [(value)]="reco_stat_month"
            [inputAttr]="{ 'aria-label': 'Recovery_Date' }"
            [calendarOptions]="{
              maxZoomLevel: 'year',
              minZoomLevel: 'century',
            }"
            labelMode="floating"
            style="border: 1px"
          >
          </dx-date-box>
        </dxi-item>
      </dxi-item>

      <dxi-item>
        <dx-text-box
          label="Remarks"
          [(value)]="remark_value"
          [labelMode]="'floating'"
          [readOnly]="isEditReadOnly"
        ></dx-text-box>
      </dxi-item>
      <dxi-item [colSpan]="2">
        <div *dxTemplate>
          <div
            class="bordered-grid"
            style="
              margin-top: 10px;
              padding: 15px;
              border: 1px solid #ddd;
              border-radius: 5px;
            "
          >
            <!-- Headings -->
            <div
              style="
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 10px;
              "
            >
              <div style="flex: 1">
                <div class="section-label" style="font-weight: bold">
                  Payment Details
                </div>
              </div>
              <div style="flex: 1">
                <div
                  class="section-label"
                  style="font-weight: bold"
                  [ngStyle]="{
                    color: selectedPaymentMode === '14' ? 'inherit' : '#888',
                  }"
                >
                  Bank Remittance Details
                </div>
              </div>
            </div>

            <!-- Radio Group Row -->
            <div
              style="
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 10px;
              "
            >
              <div style="flex: 1">
                <dx-radio-group
                  [items]="paymentModes"
                  [(value)]="selectedPaymentMode"
                  displayExpr="label"
                  valueExpr="value"
                  layout="horizontal"
                  [readOnly]="isEditReadOnly"
                  [width]="'100%'"
                  (onValueChanged)="paymentModesValue($event)"
                ></dx-radio-group>
              </div>
              <div style="flex: 1">
                <!-- Empty spacer to align next rows -->
              </div>
            </div>

            <!-- Row 1: Voucher & Reference No -->
            <div
              style="
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 10px;
              "
            >
              <div style="flex: 1; display: flex; gap: 10px">
                <dx-text-box
                  [readOnly]="isEditReadOnly"
                  label="Voucher No"
                  [labelMode]="'floating'"
                  [(value)]="adv_no_value"
                  [width]="'100%'"
                  style="flex: 1"
                ></dx-text-box>

                <dx-date-box
                  label="Voucher Date"
                  [readOnly]="isEditReadOnly"
                  [(value)]="date_value"
                  labelMode="floating"
                  displayFormat="dd/MM/yyyy"
                  [width]="'100%'"
                  style="flex: 1"
                ></dx-date-box>
              </div>
              <div style="flex: 1">
                <dx-text-box
                  label="Reference No"
                  labelMode="floating"
                  [(value)]="selected_Cheque_No"
                  [width]="'100%'"
                  [disabled]="selectedPaymentMode !== '14'"
                  [readOnly]="isEditReadOnly"
                >
                  <dx-validator>
                    <dxi-validation-rule
                      type="custom"
                      [validationCallback]="validateReferenceNo"
                      message="Reference No is required"
                    ></dxi-validation-rule>
                  </dx-validator>
                </dx-text-box>
              </div>
            </div>

            <!-- Row 2: Payment Ac & Date -->
            <div
              style="display: flex; justify-content: space-between; gap: 20px"
            >
              <div style="flex: 1">
                <dx-select-box
                  label="Payment Ac"
                  [labelMode]="'floating'"
                  [readOnly]="isEditReadOnly"
                  [(value)]="Payment_Head"
                  [searchEnabled]="true"
                  [dataSource]="filteredLedgerList"
                  displayExpr="HEAD_NAME"
                  valueExpr="HEAD_ID"
                  placeholder="Payment Ac"
                  [width]="'100%'"
                >
                  <dx-validator>
                    <dxi-validation-rule
                      type="custom"
                      [validationCallback]="validatePaymentHead"
                      message="Payment Ac is required"
                    ></dxi-validation-rule>
                  </dx-validator>
                </dx-select-box>
              </div>
              <div style="flex: 1">
                <dx-date-box
                  label="Date"
                  labelMode="floating"
                  [(value)]="selected_Cheque_Date"
                  type="date"
                  displayFormat="dd/MM/yyyy"
                  [width]="'100%'"
                  [disabled]="selectedPaymentMode !== '14'"
                  [readOnly]="isEditReadOnly"
                ></dx-date-box>
              </div>
            </div>
          </div>
        </div>
      </dxi-item>
    </dx-form>
  </dx-validation-group>
</form-popup>
