<div class="view-wrapper list-page">
  <div *ngIf="isLoading" class="loading-overlay">
    <div class="spinner"></div><!-- DevExtreme Loading Indicator -->
  </div>


<div class="form-container">
 <dx-form
  class="erp-form"
  [formData]="PaySettings"
  labelLocation="left"
  [colCount]="2">

  <!-- LEFT SIDE -->
  <dxi-item itemType="group" [colCount]="1">

    <dxi-item>
      <dx-text-box
      dataField="DAILY_HOURS"
      label="Daily working Hours"
      labelMode="floating" 
      [(value)]="PaySettings.DAILY_HOURS"
      [width]="200">
      ></dx-text-box>
    </dxi-item>

    <dxi-item>
      <dx-text-box
      dataField="MAX_OT_MTS"
      label="Maximum OT Hours"
      labelMode="floating"
      [(value)]="PaySettings.MAX_OT_MTS" 
      [width]="200"
      ></dx-text-box>
    </dxi-item>

    <dxi-item>
      <dx-text-box
      dataField="NORMAL_OT_RATE"
      label="Normal OT Rate"
      labelMode="floating" 
      [(value)]="PaySettings.NORMAL_OT_RATE" 
      [width]="200"
      ></dx-text-box>
    </dxi-item>

    <dxi-item>
      <dx-text-box dataField="HOLIDAY_OT_RATE"
      label="Holiday OT Rate"
      labelMode="floating" 
      [(value)]="PaySettings.HOLIDAY_OT_RATE" 
      [width]="200"
      ></dx-text-box> 
    </dxi-item>

    <dxi-item>
      <dx-text-box
      dataField="LEAVE_SAL_DAYS"
      label="Leave Salary Days"
      labelMode="floating" 
      [(value)]="PaySettings.LEAVE_SAL_DAYS" 
      [width]="200">
      </dx-text-box>
    </dxi-item>

  </dxi-item>

  <!-- RIGHT SIDE -->
  <dxi-item itemType="group" [colCount]="1">

    <dxi-item>
      <dx-text-box
      dataField="UQ_LABOUR_ID"
      label="Unique Labor ID"
      labelMode="floating" 
      [(value)]="PaySettings.UQ_LABOUR_ID" 
      [width]="200"
      ></dx-text-box>
    </dxi-item>

    <dxi-item>
      <dx-text-box
      dataField="BANK_AC_NO"
      label="Bank Ac. No"
      [(value)]="PaySettings.BANK_AC_NO" 
      labelMode="floating" 
      [width]="200"
      ></dx-text-box>
    </dxi-item>

    <dxi-item>
      <dx-text-box
      dataField="BANK_CODE"
      [width]="200"
      [(value)]="PaySettings.BANK_CODE" 
      labelMode="floating" 
      label="Bank Code"
      ></dx-text-box>
    </dxi-item>

  </dxi-item>

  <!-- SALARY BOX -->
  <dxi-item>
  <div class="section-heading">
    Ac Ledgers linked with Salary
  </div>
</dxi-item>

    <dxi-item>
      <dx-select-box
      dataField="SAL_PAYABLE_HEAD_ID"
      label="Salary Payable"
      valueExpr="ID"
      [items]="Ledger"
      displayExpr="DESCRIPTION"
      [(value)]="PaySettings.SAL_PAYABLE_HEAD_ID" 
      labelMode="floating" 
      [width]="200"
      ></dx-select-box>
    </dxi-item>

  <!-- PROVISION BOX -->


     <dxi-item>
  <div class="section-heading">
   Ac Ledgers linked with Provisions
  </div>
</dxi-item>

    <dxi-item>
    <dx-select-box
    dataField="LS_EXPENSE_HEAD_ID"
      label="Leave Salary"
      labelMode="floating"
      valueExpr="ID"
      displayExpr="DESCRIPTION"
      [items]="Ledger"
      [(value)]="PaySettings.LS_EXPENSE_HEAD_ID" 
      [width]="200"
      ></dx-select-box>
    </dxi-item>

    <dxi-item>
      <dx-select-box
      dataField="LS_PAYABLE_HEAD_ID"
      labelMode="floating" 
      [(value)]="PaySettings.LS_PAYABLE_HEAD_ID" 
      label="Leave Salary Payable"
      valueExpr="ID"
      displayExpr="DESCRIPTION"
      [items]="Ledger"
      [width]="200"
      ></dx-select-box>
    </dxi-item>

    <dxi-item>
      <dx-select-box
      dataField="EOS_EXPENSE_HEAD_ID"
      label="EOS"
      [(value)]="PaySettings.EOS_EXPENSE_HEAD_ID" 
      labelMode="floating" 
      [items]="Ledger"
      valueExpr="ID"
      displayExpr="DESCRIPTION"
      [width]="200"
      ></dx-select-box>
    </dxi-item>

    <dxi-item>
      <dx-select-box
      dataField="EOS_PAYABLE_HEAD_ID"
      label="EOS Payable"
      [items]="Ledger"
      valueExpr="ID"
      displayExpr="DESCRIPTION"
      [width]="200"
      [(value)]="PaySettings.EOS_PAYABLE_HEAD_ID" 
      labelMode="floating" 
      ></dx-select-box>
    </dxi-item>

      <dxi-item class="button-container">
        <dx-button
        text="Edit"
        type="default"
        (onClick)="editData()"
        stylingMode="contained">
        </dx-button>
    </dxi-item>


</dx-form>
</div>
