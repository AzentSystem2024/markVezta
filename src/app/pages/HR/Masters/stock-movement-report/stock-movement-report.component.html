<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      noDataText="No data available"
      [width]="'100%'"
      [height]="'82vh'"
      [loadPanel]="{
        enabled: true,
        text: 'Loading...',
        showIndicator: true,
        showPane: true,
      }"
      class="grid theme-dependent"
      [dataSource]="StockMovementDatasource"
      [showBorders]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [showColumnHeaders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'nextColumn'"
      [filterRow]="{ visible: false }"
      [headerFilter]="{ visible: true }"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [selection]="{ mode: 'single' }"
      focusStateEnabled="false"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: false }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      (onCellClick)="onCellClick($event)"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="standard"></dxo-scrolling>
      <dxo-header-filter
        [visible]="true"
        [allowSearch]="true"
      ></dxo-header-filter>

      <!-- <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row> -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right:  3px;
            "
          >
            Stock Movement
          </div>
        </dxi-item>

        <dxi-item location="after" locateInMenu="auto">
          <dx-select-box
            [width]="200"
            label="Type"
            labelMode="floating"
            [items]="ItemList"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [(value)]="selected_item_Id"
            (onValueChanged)="onItemIdChange($event)"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item>
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="Year"
            [width]="150"
            [(value)]="selectedYear"
            [dataSource]="years"
            (onValueChanged)="onYearChanged($event)"
            placeholder="Year"
          ></dx-select-box>
        </dxi-item>

        <dxi-item>
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="month"
            [dataSource]="monthDataSource"
            displayExpr="name"
            valueExpr="value"
            [(value)]="selectedmonth"
            (onValueChanged)="onMonthValueChanged($event)"
            [dropDownOptions]="{ width: 'auto' }"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item location="after" locateInMenu="auto">
          <dx-date-box
            [width]="150"
            label="Date From"
            labelMode="floating"
            [displayFormat]="'dd-MM-yyyy'"
            [(value)]="selected_from_date"
            (onValueChanged)="onFromDateChange($event)"
          ></dx-date-box>
        </dxi-item>

        <dxi-item location="after" locateInMenu="auto">
          <dx-date-box
            [width]="150"
            label="Date To"
            labelMode="floating"
            [displayFormat]="'dd-MM-yyyy'"
            [(value)]="selected_To_date"
            (onValueChanged)="onToDateChange($event)"
          ></dx-date-box>
        </dxi-item>

        <dxi-item>
          <dx-button
            text="Apply"
            icon="todo"
            stylingMode="contained"
            type="default"
            [width]="100"
            (onClick)="getStockMovement()"
          ></dx-button>
        </dxi-item>
        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
        <!-- <dxi-item location="after" template="dateFilterTemplate"></dxi-item> -->
        <!-- <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <!-- <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
        ></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item> -->
      </dxo-toolbar>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <dxi-column dataField="ITEM_CODE" caption="Code"></dxi-column>
      <dxi-column dataField="ITEM_NAME" caption="Description"></dxi-column>
      <dxi-column dataField="UOM" caption="UOM"></dxi-column>
      <dxi-column
        dataField="OPENING_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Opening Qty"
      ></dxi-column>
      <dxi-column
        dataField="GRN_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="GRN Qty"
      ></dxi-column>
      <dxi-column
        dataField="PURCHASE_RETURN_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Purch.Return"
      ></dxi-column>
      <dxi-column
        dataField="PRODUCTION_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Production"
      ></dxi-column>
      <dxi-column
        dataField="CONSUMPTION_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Consumption"
      ></dxi-column>
      <!-- <dxi-column
        dataField="TRANSFEROUT_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Transf.Out"
      ></dxi-column>
      <dxi-column
        dataField="TRANSFERIN_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Transf.In"
      ></dxi-column> -->
      <dxi-column
        dataField="DELIVERY_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Delivery Out"
      ></dxi-column>
      <dxi-column
        dataField="DELIVERY_RETURN_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Delivery Return"
      ></dxi-column>
      <dxi-column
        dataField="SALE_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Sale Qty"
      ></dxi-column>
      <!-- <dxi-column
        dataField="SALE_RETURN_QTY"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Sales Return"
      ></dxi-column> -->
      <dxi-column
        dataField="ADJUSTED"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Adjusted"
      ></dxi-column>
      <dxi-column
        dataField="BALANCE_STOCK"
        dataType="number"
        format="#,##0.00"
        alignment="right"
        caption="Closing"
      ></dxi-column>
      <!-- <dxi-column dataField="SIZE" caption="Size"></dxi-column>
      <dxi-column dataField="COLOR" caption="Color"></dxi-column>
      <dxi-column dataField="STYLE" caption="Style"></dxi-column> -->
    </dx-data-grid>
  </div>
</div>

<!-- ...................details popup.............. -->
<dx-popup
  [(visible)]="isPopupVisible"
  [width]="'50vw'"
  [height]="'60vh'"
  [showTitle]="true"
  title="Details"
  [closeOnOutsideClick]="true"
>
  <!-- <div class="custom-popup-header">
    {{ popupTitle }}
  </div> -->
  <!-- Production Grid -->
  <dx-data-grid
    *ngIf="popupType === 'production'"
    [dataSource]="productionDetails"
    [showBorders]="true"
    [showColumnLines]="true"
    [columnAutoWidth]="false"
    [wordWrapEnabled]="false"
    [rowAlternationEnabled]="true"
    [headerFilter]="{ visible: true }"
    [allowColumnReordering]="true"
    [showColumnHeaders]="true"
    [allowColumnResizing]="true"
    [height]="'40vh'"
    [columnResizingMode]="'nextColumn'"
    [headerFilter]="{ visible: true }"
    [scrolling]="{ mode: 'virtual' }"
    rowAlternationInterval="2"
    [selection]="{ mode: 'single' }"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="true"
      [showNavigationButtons]="true"
    ></dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row>
    <dxo-header-filter [visible]="isFilterOpened">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
    <dxo-filter-builder [allowHierarchicalFields]="true"> </dxo-filter-builder>
    <dxi-column
      dataField="QUANTITY"
      caption="Quantity"
      dataType="number"
      alignment="right"
    ></dxi-column>

    <dxi-column
      dataField="DATE"
      caption="Date"
      dataType="date"
      format="dd/MM/yyyy"
    ></dxi-column>
  </dx-data-grid>

  <!-- Consumption Grid -->
  <dx-data-grid
    *ngIf="popupType === 'consumption'"
    [dataSource]="consumptionDetails"
    [showBorders]="true"
    [columnAutoWidth]="true"
  >
  </dx-data-grid>

  <dx-data-grid
    *ngIf="popupType === 'deliveryReturn'"
    [dataSource]="deliveryReturnDetails"
    [showBorders]="true"
    [columnAutoWidth]="true"
  >
  </dx-data-grid>
</dx-popup>
