<div class="view-wrapper list-page">
  <div class="grid">
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="eosPaymentList"
      [showBorders]="true"
      [showColumnLines]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [height]="'calc(100vh - 150px)'"
      [scrolling]="{ mode: 'virtual' }"
      [selection]="{ mode: 'single' }"
    >
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">EOS Payments</div>
        </dxi-item>

        <!-- <dxi-item widget="dxSelectBox" [options]="dateRangeOptions"></dxi-item> -->

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-paging [pageSize]="10"></dxo-paging>

      <dxo-pager
        [visible]="true"
        displayMode="full"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-scrolling mode="standard"></dxo-scrolling>

      <dxo-filter-row [visible]="isFilterOpened"></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened"> </dxo-header-filter>

      <dxi-column dataField="DOC_NO" caption="Doc No"></dxi-column>
      <dxi-column
        dataField="DOC_DATE"
        caption="Date"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column dataField="EMP_NAME" caption="Employee"></dxi-column>
      <dxi-column
        dataField="NET_AMOUNT"
        caption="Net Amount"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="STATUS"
        caption="Status"
        alignment="center"
        cellTemplate="statusCellRender"
      ></dxi-column>
      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      ></dxi-column>

      <div
        *dxTemplate="let data of 'statusCellRender'"
        style="text-align: center; width: 100%"
      >
        <i
          class="fas fa-flag"
          [style.color]="
            data.data.STATUS === 'Paid'
              ? '#8B5CF6'
              : data.data.STATUS === 'Approved'
                ? '#10B981'
                : data.data.STATUS === 'Verified'
                  ? '#0073D8'
                  : '#FFA500'
          "
          [attr.title]="data.data.STATUS"
          style="cursor: default"
        ></i>
      </div>

      <div *dxTemplate="let cellData of 'actionTemplate'">
        <!-- Edit -->
        <i
          *ngIf="canEdit"
          class="dx-icon dx-icon-edit"
          [style.opacity]="
            cellData.data.STATUS === 'Verified' ||
            cellData.data.STATUS === 'Approved' ||
            cellData.data.STATUS === 'Paid'
              ? '0.4'
              : '1'
          "
          [style.pointer-events]="
            cellData.data.STATUS === 'Verified' ||
            cellData.data.STATUS === 'Approved' ||
            cellData.data.STATUS === 'Paid'
              ? 'none'
              : 'auto'
          "
          style="cursor: pointer; margin-right: 10px"
          title="Edit"
          (click)="onEditingStart({ data: cellData.data, cancel: false })"
        ></i>

        <!-- Delete -->
        <i
          *ngIf="canDelete"
          class="dx-icon dx-icon-trash"
          [style.opacity]="
            cellData.data.STATUS === 'Verified' ||
            cellData.data.STATUS === 'Approved' ||
            cellData.data.STATUS === 'Paid'
              ? '0.4'
              : '1'
          "
          [style.pointer-events]="
            cellData.data.STATUS === 'Verified' ||
            cellData.data.STATUS === 'Approved' ||
            cellData.data.STATUS === 'Paid'
              ? 'none'
              : 'auto'
          "
          style="cursor: pointer; margin-right: 10px"
          title="Delete"
          (click)="deleteData({ data: cellData.data, cancel: false })"
        ></i>

        <!-- Verify -->
        <span
          *ngIf="
            (cellData.data.STATUS === 'Verified' && canApprove) ||
            (cellData.data.STATUS !== 'Verified' &&
              cellData.data.STATUS !== 'Approved' &&
              cellData.data.STATUS !== 'Paid' &&
              canVerify)
          "
          style="
            position: relative;
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-left: 10px;
            cursor: pointer;
            vertical-align: middle;
          "
          [title]="cellData.data.STATUS === 'Verified' ? 'Approve' : 'Verify'"
          (click)="onVerifyClick({ row: { data: cellData.data } })"
        >
          <!-- Blue badge -->
          <i
            class="fas fa-certificate"
            [style.color]="
              cellData.data.STATUS === 'Verified' ? '#0073D8' : '#FFA500'
            "
            style="font-size: 18px; position: absolute; top: 0; left: 0"
          ></i>

          <!-- White tick -->
          <i
            class="fas fa-check"
            style="
              color: white;
              font-size: 7px;
              position: absolute;
              top: 5px;
              left: 5px;
              pointer-events: none;
            "
          ></i>
        </span>
      </div>
    </dx-data-grid>
  </div>
</div>

<dx-popup
  [(visible)]="popupVisible"
  [width]="'70%'"
  [height]="'100vh'"
  [title]="popupTitle"
  [showCloseButton]="true"
  (onHiding)="handleClose()"
>
  <div
    *dxTemplate="let data of 'content'"
    class="eos-form-container"
    style="padding-bottom: 50px"
  >
    <!-- Row 1: Voucher No & Date -->
    <div class="row">
      <div class="col-md-6 mb-2">
        <dx-text-box
          label="Voucher No"
          labelMode="floating"
          [(value)]="eosFormData.VoucherNo"
          [readOnly]="isReadOnlyMode"
          width="100%"
        ></dx-text-box>
      </div>
      <div class="col-md-6 mb-2">
        <dx-date-box
          label="Date"
          labelMode="floating"
          [(value)]="eosFormData.Date"
          displayFormat="dd-MM-yyyy"
          [readOnly]="isReadOnlyMode"
          width="100%"
        ></dx-date-box>
      </div>
    </div>

    <!-- Row 2: Employee -->
    <div class="row">
      <div class="col-md-12 mb-2">
        <dx-select-box
          label="Employee"
          labelMode="floating"
          [dataSource]="EmployeeDropdown"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="eosFormData.EmployeeId"
          (onValueChanged)="onEmployeeSelectionChanged($event)"
          [readOnly]="isReadOnlyMode"
          [searchEnabled]="true"
          width="100%"
        ></dx-select-box>
      </div>
    </div>

    <!-- Row 3: Reason & Doc No -->
    <div class="row">
      <div class="col-md-8 mb-2">
        <dx-select-box
          label="Reason"
          labelMode="floating"
          [dataSource]="reson_data"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="eosFormData.Reason"
          [readOnly]="isReadOnlyMode"
          [searchEnabled]="true"
          width="100%"
        ></dx-select-box>
      </div>
      <div class="col-md-4 mb-2">
        <dx-text-box
          label="Doc No"
          labelMode="floating"
          [(value)]="eosFormData.DocNo"
          [readOnly]="isReadOnlyMode"
          width="100%"
        ></dx-text-box>
      </div>
    </div>

    <!-- Columns Section -->
    <div class="row">
      <!-- Left Column -->
      <div class="col-md-6">
        <dx-date-box
          class="mb-2"
          label="Join Date"
          labelMode="floating"
          [(value)]="eosFormData.JoinDate"
          displayFormat="dd-MM-yyyy"
          [readOnly]="true"
          width="100%"
        ></dx-date-box>
        <dx-number-box
          class="mb-2"
          label="Days"
          labelMode="floating"
          [(value)]="eosFormData.Days"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0"
        ></dx-number-box>
        <dx-number-box
          class="mb-2"
          label="Total Service (Days)"
          labelMode="floating"
          [(value)]="eosFormData.TotalServiceDays"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0"
        ></dx-number-box>
        <dx-number-box
          class="mb-2"
          label="Unpaid Leave"
          labelMode="floating"
          [(value)]="eosFormData.UnPaidLeave"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0"
        ></dx-number-box>
        <dx-number-box
          class="mb-2"
          label="Additions"
          labelMode="floating"
          [(value)]="eosFormData.Additions"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
        <dx-number-box
          class="mb-2"
          label="Deductions"
          labelMode="floating"
          [(value)]="eosFormData.Deductions"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
        <dx-number-box
          class="mb-2"
          label="Net Amount"
          labelMode="floating"
          [(value)]="eosFormData.NetAmount"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
      </div>

      <!-- Right Column -->
      <div class="col-md-6">
        <dx-date-box
          class="mb-2"
          label="Last working day"
          labelMode="floating"
          [(value)]="eosFormData.LastWorkingDay"
          displayFormat="dd-MM-yyyy"
          [readOnly]="isReadOnlyMode"
          width="100%"
        ></dx-date-box>

        <div class="d-flex mb-2">
          <dx-number-box
            label="Pending Salary"
            labelMode="floating"
            [(value)]="eosFormData.PendingSalary"
            [readOnly]="isReadOnlyMode"
            width="100%"
            format="#,##0.00"
          ></dx-number-box>

        </div>

        <dx-number-box
          class="mb-2"
          label="EOS Amount"
          labelMode="floating"
          [(value)]="eosFormData.EOSAmount"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
        <dx-number-box
          class="mb-2"
          label="Unpaid Leave Salary"
          labelMode="floating"
          [(value)]="eosFormData.UnPaidLeaveSalary"
          [readOnly]="isReadOnlyMode"
          width="100%"
          format="#,##0.00"
        ></dx-number-box>
        <dx-text-box
          class="mb-2"
          label="Remarks"
          labelMode="floating"
          [(value)]="eosFormData.Remarks"
          [readOnly]="isReadOnlyMode"
          width="100%"
        ></dx-text-box>
      </div>
    </div>

    <!-- Payment Details GroupBox -->
    <fieldset class="border p-2 mt-1" style="border-radius: 5px">
      <legend
        class="float-none w-auto text-muted mb-0 px-2"
        style="font-size: 14px"
      >
        Payment Details
      </legend>
      <div class="row align-items-center mb-2">
        <div class="col-md-6 d-flex align-items-center">
          <label class="form-label text-dark me-3 mb-0" style="font-size: 14px"
            >Payment Mode:</label
          >
          <dx-radio-group
            [items]="['Cash', 'Bank']"
            [value]="eosFormData.PaymentMode"
            (onValueChanged)="onReceiptModeChange($event)"
            layout="horizontal"
            [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
          ></dx-radio-group>
        </div>
        <div class="col-md-6">
          <dx-select-box
            label="Ledger"
            labelMode="floating"
            [dataSource]="filteredLedgerList"
            displayExpr="HEAD_NAME"
            valueExpr="HEAD_ID"
            [(value)]="eosFormData.Ledger"
            [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
            [searchEnabled]="true"
            width="100%"
          >
            <dx-validator *ngIf="isApproveMode">
              <dxi-validation-rule
                type="required"
                message="Ledger is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>
      </div>

      <div class="row mt-1" *ngIf="eosFormData.PaymentMode === 'Bank'">
        <div class="col-md-6">
          <dx-text-box
            label="Reference No"
            labelMode="floating"
            [(value)]="eosFormData.ChequeNo"
            [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
            width="100%"
          >
            <dx-validator *ngIf="isApproveMode">
              <dxi-validation-rule
                type="required"
                message="Cheque No is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>
        <div class="col-md-6">
          <dx-date-box
            label="Date"
            labelMode="floating"
            [(value)]="eosFormData.DueDate"
            displayFormat="dd-MM-yyyy"
            [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
            width="100%"
          >
            <dx-validator *ngIf="isApproveMode">
              <dxi-validation-rule
                type="required"
                message="Due Date is required"
              ></dxi-validation-rule>
            </dx-validator>
          </dx-date-box>
        </div>
      </div>
    </fieldset>

    <!-- Narration -->
    <div class="row mt-2 mb-2">
      <div class="col-md-12">
        <dx-text-box
          label="Narration"
          labelMode="floating"
          [(value)]="eosFormData.Narration"
          [readOnly]="isReadOnlyMode && !isVerifyMode && !isApproveMode"
          width="100%"
        ></dx-text-box>
      </div>
    </div>

    <!-- Footer Buttons -->
    <div
      class="d-flex justify-content-end align-items-center p-2 border-top"
      style="position: absolute; bottom: 0; left: 0; right: 0"
    >
      <div class="d-flex me-2">
        <dx-button
          text="Close"
          icon=""
          stylingMode="contained"
          (onClick)="handleClose()"
          class="me-2"
        ></dx-button>
        <dx-button
          text="Save"
          icon="save"
          type="default"
          stylingMode="contained"
          class="me-2"
          (onClick)="onSave()"
          *ngIf="!isReadOnlyMode && !isApproveMode && !isVerifyMode"
        ></dx-button>
        <dx-button
          text="Verify"
          icon="check"
          stylingMode="contained"
          type="default"
          class="me-2"
          (onClick)="onVerify()"
          *ngIf="isVerifyMode"
        ></dx-button>
        <dx-button
          text="Approve"
          icon="check"
          stylingMode="contained"
          type="success"
          class="me-2"
          (onClick)="onApprove()"
          *ngIf="isApproveMode"
        ></dx-button>

      </div>
    </div>
  </div>
</dx-popup>
