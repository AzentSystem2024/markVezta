<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      noDataText=" "
      width="100%"
      height="82vh"
      class="grid theme-dependent"
      [dataSource]="timesheetList"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      columnResizingMode="nextColumn"
      [scrolling]="{ mode: 'virtual' }"
      [rowAlternationInterval]="2"
      keyExpr="ID"
      [focusStateEnabled]="false"
      (onExporting)="onExporting($event)"
      (onRowRemoving)="onDeleteTimesheet($event)"
      [selection]="{ mode: 'multiple', showCheckBoxesMode: 'always' }"
      [selectedRowKeys]="selectedRowKeys"
      (onSelectionChanged)="onSelectionChanged($event)"
      (onCellPrepared)="onCellPrepared($event)"
      (onEditingStart)="onEditingStart($event)"
    >
      <dxo-load-panel
        [enabled]="true"
        text="Loading..."
        [showIndicator]="true"
        [showPane]="true"
      ></dxo-load-panel>

      <dxo-column-chooser
        [height]="500"
        [hideOnOutsideClick]="true"
        [enabled]="true"
        mode="select"
      ></dxo-column-chooser>
      <dxo-export
        [enabled]="true"
        [allowExportSelectedData]="false"
        [formats]="['xlsx']"
      ></dxo-export>
      <dxo-editing
        mode="popup"
        [allowUpdating]="canEdit"
        [allowDeleting]="isDeleteVisible || canDelete"
      ></dxo-editing>

      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-filter-row
        [visible]="isFilterRowVisible"
        applyFilter="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
      <dxo-filter-builder [allowHierarchicalFields]="true"></dxo-filter-builder>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Time Sheet
          </div>
        </dxi-item>

        <!-- Month & Year Selector -->
        <dxi-item location="after">
          <ng-template dxTemplate>
            <div
              class="month-selector"
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                position: relative;
              "
            >
              <!-- Previous Month -->
              <dx-button
                icon="chevronleft"
                [focusStateEnabled]="false"
                [activeStateEnabled]="true"
                [hoverStateEnabled]="true"
                (onClick)="goToPreviousMonth()"
              ></dx-button>

              <!-- Month Label -->
              <span class="month-label" (click)="toggleCalendar()">
                {{ selectedMonth | date: "MMMM yyyy" }}
              </span>

              <!-- Next Month -->
              <dx-button
                icon="chevronright"
                [focusStateEnabled]="false"
                [activeStateEnabled]="true"
                [hoverStateEnabled]="true"
                (onClick)="goToNextMonth()"
              ></dx-button>

              <!-- Calendar Popup -->
              <div *ngIf="calendarVisible" class="calendar-popup">
                <div class="calendar-header">
                  <button class="year-button" (click)="previousYear()">
                    &lt;
                  </button>
                  <span class="year-clickable" (click)="toggleYearSelector()">
                    {{ selectedYear }}
                  </span>
                  <button class="year-button" (click)="nextYear()">&gt;</button>
                </div>

                <!-- Year Selector -->
                <div
                  class="year-selector-popup"
                  *ngIf="yearSelectorVisible"
                  (click)="$event.stopPropagation()"
                >
                  <div class="year-grid">
                    <div
                      class="year-option"
                      *ngFor="let year of years"
                      (click)="selectYear(year, $event)"
                    >
                      {{ year }}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </ng-template>
        </dxi-item>

        <!-- Action Buttons -->

        <dxi-item
          *ngIf="canVerify"
          location="after"
          widget="dxButton"
          [options]="VerifyButtonOptions"
        ></dxi-item>
        <dxi-item
          *ngIf="canApprove"
          location="after"
          widget="dxButton"
          [options]="approveButtonOptions"
        ></dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
        <dxi-item
          *ngIf="canAdd"
          location="after"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxi-column dataField="EMP_NO" caption="Employee No."></dxi-column>
      <dxi-column dataField="EMP_NAME" caption="Employee Name"></dxi-column>
      <dxi-column dataField="WORKED_DAYS" caption="Worked Days"></dxi-column>
      <dxi-column dataField="OT_HOURS" caption="OT Hours"></dxi-column>
      <!-- <dxi-column dataField="LESS_HOURS" caption="Less Hours"></dxi-column> -->

      <!-- Status Column mapped to TS function -->
      <dxi-column
        dataField="STATUS"
        caption="Status"
        [cellTemplate]="statusCellRender"
      ></dxi-column>
      <div *dxTemplate="let data of 'statusCellRender'">
        <div style="text-align: center; width: 100%">
          <span
            [ngClass]="{
              'flag-paid': data.data.STATUS === 'Paid',
              'flag-approved': data.data.STATUS === 'Approved',
              'flag-verified': data.data.STATUS === 'Verified',
              'flag-pending':
                data.data.STATUS !== 'Verified' &&
                data.data.STATUS !== 'Approved' &&
                data.data.STATUS !== 'Paid',
            }"
          >
            {{ data.data.STATUS }}
          </span>
        </div>
      </div>

      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      ></dxi-column>

      <div *dxTemplate="let cellData of 'actionTemplate'">
        <div class="action-icons">
          <!-- Edit -->
          <i
            *ngIf="canEdit || canView"
            class="dx-icon dx-icon-edit action-icon"
            [class.disabled]="isEditDisabled(cellData.data)"
            [title]="cellData.data.STATUS === 'Open' ? 'Edit' : 'Details'"
            (click)="openTimesheet(cellData.data)"
          >
          </i>

          <!-- Delete -->
          <i
            *ngIf="canDelete"
            class="dx-icon dx-icon-trash action-icon"
            [class.disabled]="cellData.data.STATUS !== 'Open'"
            title="Delete"
            (click)="onDeleteTimesheet({ data: cellData.data, cancel: false })"
          >
          </i>
          <!-- Verify / Approve -->
          <span
            *ngIf="showVerifyApproveBadge(cellData.data)"
            class="verify-badge"
            [ngClass]="{
              'status-paid': cellData.data.STATUS === 'Paid',
              'status-approved': cellData.data.STATUS === 'Approved',
              'status-verified': cellData.data.STATUS === 'Verified',
              'status-pending':
                cellData.data.STATUS !== 'Verified' &&
                cellData.data.STATUS !== 'Approved' &&
                cellData.data.STATUS !== 'Paid',
            }"
            [class.disabled]="isVerifyApproveDisabled(cellData.data)"
            [title]="getVerifyApproveTitle(cellData.data)"
            (click)="
              !isVerifyApproveDisabled(cellData.data) &&
                onVerifyAction(cellData.data)
            "
          >
          </span>
        </div>
      </div>
    </dx-data-grid>
  </div>
</div>

<!-- Popups -->
<dx-popup
  [(visible)]="addTimesheetPopupOpened"
  width="95vw"
  height="100vh"
  title="New Timesheet"
  (onHiding)="handleClose()"
>
  <app-timesheet-add
    *ngIf="addTimesheetPopupOpened"
    [selectedMonth]="selectedMonthForAdd"
    [existingTimesheets]="timesheetList"
    (popupClosed)="handleClose()"
  ></app-timesheet-add>
</dx-popup>

<dx-popup
  [(visible)]="editTimesheetPopupOpened"
  title="Edit Timesheet"
  width="95vw"
  height="100vh"
  (onHiding)="handleClose()"
>
  <app-timesheet-edit
    *ngIf="editTimesheetPopupOpened"
    [timesheet]="selectedTimesheet"
    [existingTimesheets]="timesheetList"
    [isReadOnlyMode]="false"
    [isVerifyMode]="false"
    [isApproveMode]="false"
    (popupClosed)="handleClose()"
  ></app-timesheet-edit>
</dx-popup>

<dx-popup
  [(visible)]="verifyTimesheetPopupOpened"
  title="Verify Timesheet"
  width="95vw"
  height="100vh"
  (onHiding)="handleClose()"
>
  <app-timesheet-edit
    *ngIf="verifyTimesheetPopupOpened"
    [timesheet]="selectedTimesheet"
    [existingTimesheets]="timesheetList"
    [isVerifyMode]="true"
    [isApproveMode]="false"
    [isReadOnlyMode]="false"
    (popupClosed)="handleClose()"
  ></app-timesheet-edit>
</dx-popup>

<dx-popup
  [(visible)]="approveTimesheetPopupOpened"
  width="95vw"
  height="100vh"
  title="Approve Timesheet"
  (onHiding)="handleClose()"
>
  <app-timesheet-edit
    *ngIf="approveTimesheetPopupOpened"
    [timesheet]="selectedTimesheet"
    [existingTimesheets]="timesheetList"
    [isVerifyMode]="false"
    [isApproveMode]="true"
    [isReadOnlyMode]="true"
    (popupClosed)="handleClose()"
  ></app-timesheet-edit>
</dx-popup>

<dx-popup
  [(visible)]="viewTimesheetPopupOpened"
  title="View Timesheet"
  width="95vw"
  height="100vh"
  (onHiding)="handleClose()"
>
  <app-timesheet-edit
    *ngIf="viewTimesheetPopupOpened"
    [timesheet]="selectedTimesheet"
    [existingTimesheets]="timesheetList"
    [isReadOnlyMode]="true"
    [isVerifyMode]="false"
    [isApproveMode]="false"
    (popupClosed)="handleClose()"
  ></app-timesheet-edit>
</dx-popup>
