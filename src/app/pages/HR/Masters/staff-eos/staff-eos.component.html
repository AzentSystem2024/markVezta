<div class="view-wrapper list-page">
  <dx-load-panel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ of: '.view-wrapper' }"
    container=".view-wrapper"
    [(visible)]="isLoading"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="false"
    [hideOnOutsideClick]="false"
  ></dx-load-panel>
  <dx-data-grid
    #dataGrid
    class="grid theme-dependent"
    [dataSource]="staffEosSource"
    [remoteOperations]="false"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    [width]="'100%'"
    [height]="'80vh'"
    noDataText=" "
    (onEditingStart)="onEditingStart($event)"
    [scrolling]="{ mode: 'standard' }"
    rowAlternationInterval="2"
    (onRowRemoved)="deleteData($event)"
    [showColumnLines]="true"
    (onExporting)="onExporting($event)"
    [editing]="{ allowUpdating: true, allowDeleting: true }"
  >
    <dxo-editing
      mode="popup"
      [allowUpdating]="canEdit"
      [allowDeleting]="canDelete"
    >
      <dxo-form [colCount]="1"> </dxo-form>
    </dxo-editing>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>

    <dxo-pager
      [visible]="true"
      displayMode="full"
      [showPageSizeSelector]="true"
      [showInfo]="true"
      [showNavigationButtons]="true"
    ></dxo-pager>

    <dxo-scrolling mode="standard"></dxo-scrolling>

    <dxo-filter-row [visible]="isFilterOpened"></dxo-filter-row>
    <dxo-header-filter [visible]="isFilterOpened"> </dxo-header-filter>

    <dxo-toolbar>
      <dxi-item location="before">
        <div
          class="grid-header"
          style="
            font-weight: 600;
            font-size: 20px;
            margin-left: 12px;
            padding: -3px;
            margin-right: 3px;
          "
        >
          Employee End of Service
        </div>
      </dxi-item>

      <dxi-item widget="dxSelectBox" [options]="dateRangeOptions"></dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="searchButtonOptions"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [options]="refreshButtonOptions"
      >
      </dxi-item>

      <dxi-item location="after">
        <div class="toolbar-divider"></div>
      </dxi-item>

      <!-- Export (built-in, kept) -->
      <dxi-item
        name="exportButton"
        location="after"
        cssClass="export-btn"
      ></dxi-item>

      <dxi-item
        *ngIf="canAdd"
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <dxi-column
      dataField="DOC_NO"
      caption="Doc.No"
      alignment="left"
      [allowEditing]="true"
      [allowFiltering]="false"
      width="80"
    ></dxi-column>
    <dxi-column dataField="DATE" caption="Date" width="100"></dxi-column>
    <dxi-column
      dataField="EMP_NO"
      caption="Employee No"
      alignment="left"
      [width]="150"
    ></dxi-column>
    <dxi-column
      dataField="EMP_NAME"
      caption="Employee Name"
      [width]="200"
    ></dxi-column>
    <dxi-column dataField="REASON" caption="Reason " [width]="150"></dxi-column>
    <dxi-column
      dataField="REMARKS"
      caption="Remarks "
      [width]="150"
    ></dxi-column>

    <dxi-column
      caption="Status"
      dataField="STATUS"
      alignment="center"
      [width]="'140'"
      cellTemplate="statusCellRender"
      [allowHeaderFiltering]="true"
      [headerFilter]="{
        dataSource: getStatusFilterData,
        encodeHtml: false,
      }"
    >
    </dxi-column>

    <div *dxTemplate="let data of 'statusCellRender'">
      <span
        [ngClass]="{
          'flag-pending': data.data.STATUS === 'Open',
          'flag-verified': data.data.STATUS === 'Verified',
          'flag-approved':
            data.data.STATUS === 'Left Service' ||
            data.data.STATUS === 'Approved',
        }"
      >
        {{
          data.data.STATUS === "Left Service" ? "Approved" : data.data.STATUS
        }}
      </span>
    </div>

    <dxi-column
      type="buttons"
      caption="Actions"
      [width]="140"
      cellTemplate="actionTemplate"
    >
    </dxi-column>
    <div *dxTemplate="let cellData of 'actionTemplate'">
      <div class="action-icons">
        <!-- Edit -->
        <i
          *ngIf="canEdit"
          class="dx-icon dx-icon-edit"
          style="opacity: 1; pointer-events: auto"
          [title]="getEditActionTitle(cellData.data)"
          (click)="onEditingStart({ data: cellData.data, cancel: false })"
        ></i>

        <!-- Delete -->
        <i
          *ngIf="canDelete"
          class="dx-icon dx-icon-trash"
          [style.opacity]="
            cellData.data.STATUS === 'Verified' ||
            cellData.data.STATUS === 'Left Service'
              ? '0.4'
              : '1'
          "
          [style.pointer-events]="
            cellData.data.STATUS === 'Verified' ||
            cellData.data.STATUS === 'Left Service'
              ? 'none'
              : 'auto'
          "
          title="Delete"
          (click)="deleteData({ data: cellData.data, cancel: false })"
        ></i>

        <!-- Verify -->
        <span
          *ngIf="showVerifyApproveBadge(cellData.data)"
          class="verify-badge"
          [ngClass]="{
            'status-pending':
              cellData.data.STATUS !== 'Verified' &&
              cellData.data.STATUS !== 'Left Service' &&
              cellData.data.STATUS !== 'Approved',
            'status-verified': cellData.data.STATUS === 'Verified',
            'status-approved':
              cellData.data.STATUS === 'Left Service' ||
              cellData.data.STATUS === 'Approved',
          }"
          [class.disabled]="isVerifyApproveDisabled(cellData.data)"
          [title]="getVerifyApproveTitle(cellData.data)"
          (click)="
            !isVerifyApproveDisabled(cellData.data) &&
              onVerifyAction(cellData.data)
          "
        ></span>
      </div>
    </div>
  </dx-data-grid>
</div>

            [showClearButton]="true"
            [useMaskBehavior]="true"
            [displayFormat]="'dd/MM/yyyy'"
            type="date"
            [inputAttr]="{ 'aria-label': 'Date' }"
            [(value)]="selected_data.RELIEVING_DATE"
            labelMode="floating"
            [readOnly]="true"
          ></dx-date-box>
        </dxi-item>
      </dxi-item>
      <dxi-item>
        <dx-number-box
          [inputAttr]="{ style: 'text-align: right;' }"
          label="Days Worked"
          [(value)]="all_workingdays"
          [readOnly]="true"
          labelMode="floating"
        ></dx-number-box>
      </dxi-item>
      <dxi-item class="select-box">
        <dx-select-box
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [items]="reson_data"
          label="Reason *"
          [searchEnabled]="true"
          placeholder="Select.."
          [items]="reson_data"
          [(value)]="selected_data.REASON_ID"
          labelMode="floating"
          [readOnly]="true"
        >
        </dx-select-box>
      </dxi-item>

      <dxi-item>
        <dx-text-area
          label="Remarks"
          [readOnly]="true"
          valueChangeEvent="input"
          [(value)]="selected_data.REMARKS"
          labelMode="floating"
        >
        </dx-text-area>
      </dxi-item>

      <dxi-item style="text-align: center">
        <label
          style="
            display: block;
            text-align: left;
            text-decoration: underline;
            text-underline-offset: 4px;
          "
        >
          Payment Details:</label
        >
      </dxi-item>

      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <dxi-item>
          <dx-text-box
            label="Voucher No"
            [(value)]="payment_Detilas.VOUCHER_NO"
            [readOnly]="true"
            labelMode="floating"
          ></dx-text-box>
        </dxi-item>
        <dxi-item>
          <dx-date-box
            label="Voucher Date"
            [(value)]="payment_Detilas.TRANS_DATE"
            [readOnly]="true"
            labelMode="floating"
            displayFormat="dd/MM/yyyy"
          ></dx-date-box>
        </dxi-item>
      </dxi-item>

      <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
        <dxi-item>
          <dx-text-box
            label="Amount paid"
            [inputAttr]="{ style: 'text-align: right;' }"
            [(value)]="payment_Detilas.AMOUNT_PAID"
            [readOnly]="true"
            placeholder="0"
            labelMode="floating"
          ></dx-text-box>
        </dxi-item>
        <dxi-item>
          <dx-text-box
            label="Payment Reference"
            [(value)]="payment_Detilas.PAYMENT_REFERENCE"
            [readOnly]="true"
            labelMode="floating"
          ></dx-text-box>
        </dxi-item>
      </dxi-item>
    </dx-form>

    <div class="d-flex justify-content-end mt-3">
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        type="normal"
        (onClick)="closeButton()"
      ></dx-button>
    </div>
  </dx-popup>

  <!-- =========== header filter============= -->
  <dx-popup
    [(visible)]="isCustomDatePopupVisible"
    [width]="'400px'"
    title="Select Custom Date Range"
    [showCloseButton]="true"
    [dragEnabled]="false"
    [closeOnOutsideClick]="true"
    [height]="'250px'"
  >
    <div class="p-3">
      <dx-date-box
        [(value)]="fromDate"
        type="date"
        displayFormat="yyyy-MM-dd"
        label="From Date"
      >
      </dx-date-box>

      <dx-date-box
        [(value)]="toDate"
        type="date"
        displayFormat="yyyy-MM-dd"
        label="To Date"
      >
      </dx-date-box>

      <button class="custom-apply-btn" (click)="applyCustomDate()">
        Apply
      </button>
    </div>
  </dx-popup>
</dx-validation-group>
