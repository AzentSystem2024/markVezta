<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="AgedPayableReport"
      width="100%"
      height="83vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [remoteOperations]="false"
      [scrolling]="{ mode: 'virtual' }"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [headerFilter]="{ visible: false }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading...' }"
    >
      <dxo-column-chooser
        [height]="500"
        hideOnOutsideClick="true"
        [enabled]="true"
        mode="select"
      ></dxo-column-chooser>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Aged Payables
          </div>
        </dxi-item>

        <dxi-item location="after" template="supplierFilterTemplate"></dxi-item>

        <dxi-item location="after" template="dateboxTemplate"></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="applyButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <div *dxTemplate="let data of 'supplierFilterTemplate'">
        <dx-select-box
          label="Supplier"
          labelMode="floating"
          stylingMode="outlined"
          [valueExpr]="'ID'"
          [displayExpr]="'DESCRIPTION'"
          [items]="Supplier"
          [searchEnabled]="true"
          [(value)]="selectedSupplierId"
          [width]="200"
          (onValueChanged)="onSupplierChanged($event)"
          [showClearButton]="true"
        ></dx-select-box>
      </div>

      <div *dxTemplate="let data of 'dateboxTemplate'">
        <dx-date-box
          [width]="150"
          label="As on Date"
          labelMode="floating"
          [value]="formatted_To_date"
          [displayFormat]="'dd-MM-yyyy'"
          (onValueChanged)="onToDateChange($event)"
        >
        </dx-date-box>
      </div>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <dxi-column
        dataField="SUPP_NAME"
        caption="Supplier Name"
        dataType="string"
      ></dxi-column>

      <dxi-column
        dataField="DOC_NO"
        caption="Invoice No"
        dataType="number"
        alignment="left"
      ></dxi-column>

      <dxi-column
        dataField="PURCH_DATE"
        caption="Invoice Date"
        dataType="date"
        format="dd/MM/yyyy"
      ></dxi-column>

      <dxi-column
        dataField="AGE_0_30"
        caption="Age 0-30"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="AGE_31_60"
        caption="Age 31-60"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="AGE_61_90"
        caption="Age 61-90"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="AGE_91_120"
        caption="Age 91-120"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="AGE_121_150"
        caption="Age 121-150"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="AGE_151_180"
        caption="Age 151-180"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="AGE_ABOVE_180"
        caption="Age above 180"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <dxi-column
        dataField="BALANCE"
        caption="Balance"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        dataType="number"
      ></dxi-column>

      <!-- Group summary for MAIN_GROUP_NAME -->
      <dxo-summary *ngIf="isSummaryVisible">
        <dxi-total-item
          column="AGE_0_30"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="AGE_31_60"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="AGE_61_90"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="AGE_91_120"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="AGE_121_150"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="AGE_151_180"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="AGE_ABOVE_180"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
        <dxi-total-item
          column="BALANCE"
          summaryType="sum"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        ></dxi-total-item>
      </dxo-summary>

      <dxi-column
        *ngIf="AgedPayableReport.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
<!-- drill down   -->

<dx-popup
  [(visible)]="isEditInvoice"
  [width]="'90vw'"
  [height]="'85vh'"
  title="Purchase Invoice"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isEditInvoice">
    <app-edit-purchase-invoice
      [invoiceFormData]="selectedInvoice"
      [readOnly]="isEditInvoiceReadOnly"
      (popupClosed)="handleClose()"
    ></app-edit-purchase-invoice>
  </ng-container>
</dx-popup>
