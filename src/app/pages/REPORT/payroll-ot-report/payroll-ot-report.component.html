<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="PayrollReport"
      width="100%"
      noDataText=""
      height="78vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [filterRow]="{ visible: false }"
      [rowAlternationEnabled]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [scrolling]="{ mode: 'virtual' }"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading...' }"
    >
      <!-- (onEditingStart)="onEditLedger($event)" -->
      <!-- <dxo-editing
        mode="popup"s
        [allowUpdating]="true"
      ></dxo-editing> -->
      <dxo-paging [pageSize]="10"></dxo-paging>
     
      
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right:  3px;
            "
          >
            Payroll OT Report
          </div>
        </dxi-item>

        <dxi-item style="margin-bottom: 6px">
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="Year"
            [width]="90"
            [(value)]="selectedYear"
            [dataSource]="years"
            (onValueChanged)="onYearChanged($event)"
            placeholder="Year"
          ></dx-select-box>
        </dxi-item>

        <dxi-item style="margin-bottom: 6px">
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="month"
            [dataSource]="monthDataSource"
            displayExpr="name"
            valueExpr="value"
            [(value)]="selectedmonth"
            (onValueChanged)="onMonthValueChanged($event)"
            [dropDownOptions]="{ width: 'auto' }"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item style="margin-bottom: 6px">
          <dx-date-box
            [width]="120"
            label="From Date"
            labelMode="floating"
            [(value)]="selected_from_date"
            [displayFormat]="'dd-MM-yyyy'"
            (onValueChanged)="onFromDateChange($event)"
          >
          </dx-date-box>
        </dxi-item>
        <dxi-item style="margin-bottom: 6px">
          <dx-date-box
            [width]="120"
            label="To Date"
            labelMode="floating"
            [(value)]="selected_To_date"
            displayFormat="dd-MM-yyyy"
            (onValueChanged)="onToDateChange($event)"
          >
          </dx-date-box>
        </dxi-item>

         <dxi-item>
          <dx-select-box
            [width]="200"
            label="Department"
            labelMode="floating"
            [items]="Department"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [(value)]="select_department_id"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item>
             <dx-select-box
                [items]="paymentType"
                valueExpr="ID"
                displayExpr="DESCRIPTION"
                [searchEnabled]="true"
                [placeholder]="'PaymentMode'"
                label="PaymentMode"
                [(value)]="selected_payment_mode"
                [labelMode]="'floating'"
              >
              </dx-select-box>
        </dxi-item>

        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>
        <dxi-item>
          <dx-button
            text="Apply"
            stylingMode="contained"
            type="default"
            (onClick)="Payroll_Report()"
          >
          </dx-button>
        </dxi-item>
        <dxi-item name="exportButton" class="export-btn"></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="none"></dxo-sorting>
      <dxo-filter-row visible="true"></dxo-filter-row>
      <dxo-header-filter visible="true"></dxo-header-filter>
      <dxo-paging page-size="10"></dxo-paging>
      <dxo-pager
        show-page-size-selector="true"
        show-info="true"
        show-navigator="true"
      ></dxo-pager>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <!-- <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row> -->
      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxi-column
        dataField="SalaryMonth"
        caption="Salary Month"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="TRANS_TYPE_NAME"
        caption="Emp No"
         width="120"
      ></dxi-column>
      <dxi-column dataField="Name" caption="Name"  width="190"></dxi-column>
      <dxi-column dataField="Designation" caption="Designation"  width="150"></dxi-column>
      <dxi-column dataField="BasicPay" caption="BasicPay"  [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"  width="150"></dxi-column>
      <dxi-column dataField="Allowance" caption="Allowance" [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"  width="150"></dxi-column>
      <dxi-column
        dataField="Salary"
        caption="Salary"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
         width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="NormalOT"
        caption="Normal OT"
         width="150"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="HolidayOT"
        caption="Holiday OT"
        alignment="right"
         width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="NormalOTAmount"
        caption="Normal OT Amount"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
         width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="HolidayOTAmount"
        caption="Holiday OT Amount"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
         width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="TotalOT"
        caption="Total OT"
        alignment="right"
         width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="TotalOTAmount"
        caption="Total OT Amount"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
         width="150"
      >
      </dxi-column>

      <!-- <dxi-column type="buttons" [width]="100">
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
          [visible]="isViewVisible"
        ></dxi-button>
      </dxi-column> -->
    </dx-data-grid>
  </div>
</div>
