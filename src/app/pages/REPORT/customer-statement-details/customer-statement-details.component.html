<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- Collapsible Filter Panel -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <!-- Customer -->
        <dx-select-box
          [width]="250"
          label="Customer"
          labelMode="floating"
          [items]="customer_list"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="select_customer_id"
          [searchEnabled]="true"
          (onValueChanged)="onCompanyChange($event)"
        ></dx-select-box>

        <!-- Year -->
        <dx-select-box
          labelMode="floating"
          label="Year"
          [width]="150"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <!-- Month -->
        <dx-select-box
          labelMode="floating"
          label="Month"
          [width]="150"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
        ></dx-select-box>

        <!-- From Date -->
        <dx-date-box
          [width]="150"
          label="From Date"
          labelMode="floating"
          [(value)]="formatted_from_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <!-- To Date -->
        <dx-date-box
          [width]="150"
          label="To Date"
          labelMode="floating"
          [(value)]="formatted_To_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>
      </div>
    </div>

    <!-- Horizontal Toggle Bar -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      [title]="showParameters ? 'Hide Filters' : 'Show Filters'"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="CustomerListDataSource"
      width="100%"
      noDataText=""
      height="75vh"
      width="100%"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [filterRow]="{ visible: false }"
      [rowAlternationEnabled]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [loadPanel]="{ enabled: true, text: 'Loading...' }"
      [summary]="summaryColumnsData"
      [summary.calculateCustomSummary]="
        summaryColumnsData.calculateCustomSummary
      "
      (onExporting)="onExporting($event)"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="font-weight: 600; font-size: 20px; margin-left: 12px"
          >
            Customer statement Details
          </div>
        </dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>
      <dxo-pager
        show-page-size-selector="true"
        show-info="true"
        show-navigator="true"
      ></dxo-pager>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-search [enabled]="true"></dxo-search>
      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <!-- <dxi-column dataField="TRANS_ID" caption="Transaction ID" [width]="120"></dxi-column> -->
      <dxi-column
        dataField="TRANS_DATE"
        caption="Date"
        dataType="date"
        format="dd-MM-yyyy"
        [width]="130"
      ></dxi-column>
      <!-- <dxi-column dataField="TRANS_TYPE" caption="Transaction Type" [width]="150"></dxi-column> -->
      <dxi-column
        dataField="DOC_NO"
        caption="Doc No"
        [width]="100"
      ></dxi-column>
      <dxi-column
        dataField="DOC_NAME"
        caption="Document Name"
        [width]="250"
      ></dxi-column>
      <dxi-column
        dataField="NARRATION"
        caption="Narration"
        [width]="300"
      ></dxi-column>
      <dxi-column
        dataField="DR_AMOUNT"
        caption="Debit Amount"
        [width]="150"
        dataType="number"
        format="#,##0.00"
        alignment="right"
      ></dxi-column>
      <dxi-column
        dataField="CR_AMOUNT"
        caption="Credit Amount"
        [width]="150"
        dataType="number"
        format="#,##0.00"
        alignment="right"
      ></dxi-column>
      <dxi-column
        *ngIf="CustomerListDataSource.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>

<!-- =========================view of credit note============================== -->

<dx-popup
  [(visible)]="isViewCreditNote"
  [width]="'90vw'"
  [height]="'100vh'"
  title="Credit Note"
  (onHiding)="handleClose()"
>
  <app-view-credit-note
    [creditFormData]="selectedCreditNote"
    (popupClosed)="handleClose()"
  ></app-view-credit-note>
</dx-popup>

<dx-popup
  *ngIf="isViewInvoice"
  [(visible)]="isViewInvoice"
  [width]="'95vw'"
  [height]="'100vh'"
  title="View Invoice"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isViewInvoice">
    <app-view-invoice
      [isEditing]="true"
      [isReadOnlyMode]="isReadOnlyInvoice"
      [invoiceFormData]="selectedInvoice"
      (popupClosed)="handleClose()"
    ></app-view-invoice>
  </ng-container>
</dx-popup>

<dx-popup
  *ngIf="isRetailInvoice"
  [(visible)]="isRetailInvoice"
  [width]="'95vw'"
  [height]="'100vh'"
  title="Invoice"
  (onHiding)="handleClose()"
>
  <app-add-invoice-retail
    [isEditing]="true"
    [isReadOnlyMode]="isReadOnlyInvoice"
    [EditingResponseData]="selectedInvoice"
    (popupClosed)="handleClose()"
  >
  </app-add-invoice-retail>
</dx-popup>

<dx-popup
  [(visible)]="isViewInvoice"
  [width]="'90vw'"
  [height]="'100vh'"
  [deferRendering]="false"
  title="View Invoice"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isViewInvoice">
    <app-view-invoice
      [invoiceFormData]="selectedInvoice"
      (popupClosed)="handleClose()"
    ></app-view-invoice>
  </ng-container>
</dx-popup>

<!-- //======================= coustom receipt=================== -->

<dx-popup
  [(visible)]="isViewReceipt"
  [width]="'75vw'"
  [height]="'100vh'"
  [deferRendering]="false"
  title="View Receipt"
  (onHiding)="handleClose()"
>
  <app-view-customer-receipt
    [receiprtFormData]="selectedReceipt"
    (popupClosed)="handleClose()"
  ></app-view-customer-receipt>
</dx-popup>
