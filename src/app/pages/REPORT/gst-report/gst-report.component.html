<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="GST_datasource"
      noDataText=""
      width="100%"
      height="82vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [filterRow]="{ visible: false }"
      [rowAlternationEnabled]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [scrolling]="{ mode: 'virtual' }"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>

      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      ```html
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header gst-report-title">GST Report (B2B)</div>
        </dxi-item>

        <dxi-item location="after" locateInMenu="never">
          <div class="gst-filter-toolbar">
            <dx-select-box
              label="Year"
              labelMode="floating"
              [width]="100"
              [(value)]="selectedYear"
              [dataSource]="years"
              (onValueChanged)="onYearChanged($event)"
              placeholder="Year"
            ></dx-select-box>

            <dx-select-box
              label="Month"
              labelMode="floating"
              [width]="120"
              [dataSource]="monthDataSource"
              displayExpr="name"
              valueExpr="value"
              [(value)]="selectedmonth"
              (onValueChanged)="onMonthValueChanged($event)"
              [dropDownOptions]="{ width: 'auto' }"
            ></dx-select-box>

            <dx-date-box
              label="From Date"
              labelMode="floating"
              [width]="135"
              [(value)]="selected_from_date"
              displayFormat="dd-MM-yyyy"
              (onValueChanged)="onFromDateChange($event)"
            ></dx-date-box>

            <dx-date-box
              label="To Date"
              labelMode="floating"
              [width]="135"
              [(value)]="selected_To_date"
              displayFormat="dd-MM-yyyy"
              (onValueChanged)="onToDateChange($event)"
            ></dx-date-box>

            <dx-button
              text="Apply"
              stylingMode="contained"
              type="default"
              (onClick)="load_GST_data()"
            ></dx-button>
          </div>
        </dxi-item>

        <dxi-item name="exportButton" location="after"></dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="none"></dxo-sorting>
      <dxo-filter-row visible="true"></dxo-filter-row>
      <dxo-header-filter visible="true"></dxo-header-filter>
      <dxo-paging page-size="10"></dxo-paging>
      <dxo-pager
        show-page-size-selector="true"
        show-info="true"
        show-navigator="true"
      ></dxo-pager>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <!-- <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row> -->
      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <!-- <dxi-column dataField="TransID" caption="Trans Type Id" dataType="date"></dxi-column> -->
      <dxi-column dataField="DOC_NO" caption="Doc No."></dxi-column>
      <dxi-column
        dataField="DOC_DATE"
        caption="Doc Date."
        dataType="date"
        [format]="{ type: 'custom', formatter: formatDates }"
      ></dxi-column>
      <dxi-column dataField="DOC_NAME" caption="Document Name"></dxi-column>
      <dxi-column
        dataField="RECEIVER_NAME"
        caption="Receiver Name"
      ></dxi-column>
      <dxi-column
        dataField="INVOICE_AMOUNT"
        caption="Invoice Amount"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
        width="150px"
      ></dxi-column>
      <dxi-column dataField="GSTIN" caption="GSTIN"></dxi-column>

      <dxi-column dataField="CGST" caption="CGST %"></dxi-column>
      <dxi-column dataField="SGST" caption="SGST %"></dxi-column>
      <dxi-column dataField="IGST" caption="IGST %"></dxi-column>
      <dxi-column dataField="HSN_CODE" caption="HSN CODE"></dxi-column>

      <dxi-column
        dataField="TAXABLE_AMOUNT"
        caption="Taxable Amount"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
      ></dxi-column>
      <dxi-column
        dataField="INVOICE_AMOUNT"
        caption="Total GST"
        width="130px"
      ></dxi-column>

      <dxi-column
        *ngIf="GST_datasource.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>
  </div>
</div>
