<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="LeavelistReport"
      width="100%"
      noDataText=""
      height="78vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [filterRow]="{ visible: false }"
      [rowAlternationEnabled]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [scrolling]="{ mode: 'virtual' }"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
    >
      <!-- (onEditingStart)="onEditLedger($event)" -->
      <!-- <dxo-editing
        mode="popup"s
        [allowUpdating]="true"
      ></dxo-editing> -->
      <dxo-paging [pageSize]="10"></dxo-paging>

      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right:  3px;
            "
          >
            Leave list Report
          </div>
        </dxi-item>

        <dxi-item style="margin-bottom: 6px">
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="Year"
            [width]="90"
            [(value)]="selectedYear"
            [dataSource]="years"
            (onValueChanged)="onYearChanged($event)"
            placeholder="Year"
          ></dx-select-box>
        </dxi-item>

        <dxi-item style="margin-bottom: 6px">
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="month"
            [dataSource]="monthDataSource"
            displayExpr="name"
            valueExpr="value"
            [(value)]="selectedmonth"
            (onValueChanged)="onMonthValueChanged($event)"
            [dropDownOptions]="{ width: 'auto' }"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item style="margin-bottom: 6px">
          <dx-date-box
            [width]="120"
            label="From Date"
            labelMode="floating"
            [(value)]="selected_from_date"
            [displayFormat]="'dd-MM-yyyy'"
            (onValueChanged)="onFromDateChange($event)"
          >
          </dx-date-box>
        </dxi-item>
        <dxi-item style="margin-bottom: 6px">
          <dx-date-box
            [width]="120"
            label="To Date"
            labelMode="floating"
            [(value)]="selected_To_date"
            displayFormat="dd-MM-yyyy"
            (onValueChanged)="onToDateChange($event)"
          >
          </dx-date-box>
        </dxi-item>

        <dxi-item>
          <dx-select-box
            [width]="200"
            label="Department"
            labelMode="floating"
            [items]="Department"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [(value)]="select_department_id"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item>
          <dx-select-box
            [placeholder]="'Employee Code'"
            label="Employee"
            [items]="EmployeeDropdown"
            valueExpr="ID"
            displayExpr="DESCRIPTION"
            [(value)]="selectedEmployeeId"
            [searchEnabled]="true"
            [showClearButton]="true"
            [labelMode]="'floating'"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="toolbar-icon-btn export-btn"
        ></dxi-item>

        <dxi-item>
          <dx-button
            text="Apply"
            stylingMode="contained"
            type="default"
            (onClick)="Leavelist_Report()"
          >
          </dx-button>
        </dxi-item>
      </dxo-toolbar>

      <dxo-sorting mode="none"></dxo-sorting>
      <dxo-filter-row visible="true"></dxo-filter-row>
      <dxo-header-filter visible="true"></dxo-header-filter>
      <dxo-paging page-size="10"></dxo-paging>
      <dxo-pager
        show-page-size-selector="true"
        show-info="true"
        show-navigator="true"
      ></dxo-pager>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <!-- <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row> -->
      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxi-column
        dataField="LeaveCode"
        caption="Leave Code"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="ApplicationNo"
        caption="Application No"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="EmployeeCode"
        caption="Emp Code"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="EmployeeName"
        caption="Emp Name"
        width="200"
      ></dxi-column>
      <dxi-column
        dataField="DepartmentCode"
        caption="Dept Code"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="LeaveBalance"
        caption="Leave Balance"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="LeaveStartDate"
        caption="Leave Start Date"
        dataType="date"
        format="dd-MM-yyyy"
        width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="LeaveEndDate"
        dataType="date"
        caption="Leave End Date"
        format="dd-MM-yyyy"
        width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="ApprovedDays"
        caption="Approved Days"
        alignment="right"
        width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="Approved"
        caption="Approved Status"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        alignment="right"
        width="150"
      >
      </dxi-column>

      <dxi-column
        dataField="ResumedDate"
        caption="Resumed Date"
        dataType="date"
        format="dd-MM-yyyy"
        width="150"
      >
      </dxi-column>

      <!-- <dxi-column type="buttons" [width]="100">
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
          [visible]="isViewVisible"
        ></dxi-button>
      </dxi-column> -->
    </dx-data-grid>
  </div>
</div>
