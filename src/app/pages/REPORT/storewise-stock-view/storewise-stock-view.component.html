<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="StockViewReport"
      width="100%"
      height="82vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: true }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [remoteOperations]="false"
      [scrolling]="{ mode: 'virtual' }"
      (onCellPrepared)="onCellPrepared($event)"
      (onRowPrepared)="onRowPrepared($event)"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [headerFilter]="{ visible: false }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: false, text: 'Loading...' }"
    >
      <dxo-column-chooser
        [height]="500"
        hideOnOutsideClick="true"
        [enabled]="true"
        mode="select"
      >
      </dxo-column-chooser>
      <dxo-group-panel [visible]="true"></dxo-group-panel>
      <dxo-grouping [contextMenuEnabled]="true" [autoExpandAll]="false">
      </dxo-grouping>
      <dxo-export
        [enabled]="true"
        [allowExportSelectedData]="false"
        [formats]="['xlsx']"
      >
      </dxo-export>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-filter-row
        [visible]="isFilterOpened"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
      <dxo-filter-builder [allowHierarchicalFields]="true">
      </dxo-filter-builder>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Store wise Stock View
          </div>
        </dxi-item>

        <dxi-item location="after" template="storeFilterTemplate"></dxi-item>

        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <!-- Divider -->
        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <!-- Export (built-in, kept) -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <!-- <dxi-item
          location="after"
          widget="dxButton"
          [options]="applyButtonOptions"
        ></dxi-item> -->
      </dxo-toolbar>

      <div *dxTemplate="let data of 'storeFilterTemplate'">
        <dx-tag-box
          label="Store"
          labelMode="floating"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [items]="Store"
          [(value)]="selectedStoreid"
          [searchEnabled]="true"
          [maxDisplayedTags]="100"
          [showMultiTagOnly]="true"
          [multiline]="false"
          [width]="200"
          [showSelectionControls]="true"
          (onValueChanged)="updateStoreHint()"
        >
        </dx-tag-box>
      </div>

      <dxi-column
        dataField="CODE"
        caption="Item Code"
        dataType="string"
        sortOrder="asc"
        [sortingMethod]="typeSorting"
      ></dxi-column>

      <dxi-column
        dataField="DESCRIPTION"
        caption="Description"
        dataType="string"
        sortOrder="asc"
        [sortingMethod]="typeSorting"
      ></dxi-column>

      <!-- <dxi-column
        dataField="StoreAmounts.CENTRAL STORE"
        caption="Central Store"
        alignment="left"
        dataType="number"
      ></dxi-column> -->
      <dxi-column
        *ngFor="let col of dynamicColumns"
        [dataField]="col.dataField"
        [caption]="col.caption"
        alignment="right"
        dataType="number"
        [width]="100"
      >
      </dxi-column>
      <dxi-column
        dataField="StoreStock.TOTAL"
        caption="Total"
        dataType="number"
      ></dxi-column>

      <!-- Group summary for MAIN_GROUP_NAME -->
      <!-- Group and Total Summary -->
      <dxo-summary>
        <!-- Group summary -->
        <dxi-group-item
          *ngIf="isSummaryVisible"
          column="StoreStock.TOTAL"
          summaryType="count"
          [alignByColumn]="true"
          displayFormat="Total: {0}"
        ></dxi-group-item>

        <!-- Required to create the total footer row -->
        <dxi-total-item
          *ngIf="isSummaryVisible"
          column="StoreStock.TOTAL"
          summaryType="count"
          displayFormat=""
        ></dxi-total-item>
      </dxo-summary>

      <!-- <dxi-column
        *ngIf="StockViewReport.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column> -->
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
