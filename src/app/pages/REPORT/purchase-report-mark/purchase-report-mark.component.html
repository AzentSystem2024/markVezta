<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- Collapsible Filter Panel -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          labelMode="floating"
          label="Year"
          [width]="150"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <dx-select-box
          labelMode="floating"
          label="Month"
          [width]="150"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
        ></dx-select-box>

        <dx-date-box
          [width]="150"
          label="Date From"
          labelMode="floating"
          [displayFormat]="'dd-MM-yyyy'"
          [value]="formatted_from_date"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <dx-date-box
          [width]="150"
          label="Date To"
          labelMode="floating"
          [displayFormat]="'dd-MM-yyyy'"
          [value]="formatted_To_date"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <dx-select-box
          [dataSource]="distributorList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [width]="250"
          label="Supplier"
          [(value)]="selectedSupplier"
          [searchEnabled]="true"
          labelMode="floating"
          [showClearButton]="true"
          (onValueChanged)="onSupplierChanged($event)"
        ></dx-select-box>

        <dx-button
          text="Apply"
          type="default"
          stylingMode="contained"
          (onClick)="get_Purchase_list()"
        ></dx-button>

        <!-- <dx-button
          text="Cancel"
          stylingMode="outlined"
          (onClick)="cancelReport()"
        ></dx-button> -->
      </div>
    </div>

    <!-- Horizontal Toggle Bar -->
    <div class="toggle-bar" (click)="toggleParameters()">
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- Data Grid -->
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="PurchaseReport"
      width="100%"
      noDataText=""
      height="75vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      id="dataGrid"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading...' }"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>

      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>

      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="font-weight: 600; font-size: 20px; margin-left: 12px"
          >
            Purchase Report
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <!-- Invoice Date -->
      <dxi-column
        dataField="PURCH_DATE"
        caption="Date"
        dataType="date"
        format="dd/MM/yyyy"
      ></dxi-column>

      <!-- Particulars -->
      <dxi-column
        dataField="SUPP_NAME"
        caption="Particulars"
        dataType="string"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="HSN_CODE"
        caption="HSN CODE"
        dataType="string"
      ></dxi-column>

      <!-- Voucher Type -->
      <dxi-column
        dataField="VoucherType"
        caption="Voucher Type"
        dataType="string"
      ></dxi-column>

      <!-- Voucher No -->
      <dxi-column
        dataField="DOC_NO"
        caption="Invoice No"
        dataType="string"
        [groupIndex]="0"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="REF_NO"
        caption="Voucher reference No"
        dataType="string"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="Quantity"
        caption="Quantity"
        dataType="string"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="GrossTotal"
        caption="Gross Amount"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="Disc"
        caption="Discount Amount"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="GSTPurchase"
        caption="GST"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="CGSTPurchaseInput9"
        caption="CGST"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="SGSTPurchaseInput9"
        caption="SGST"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>

      <!-- HSN CODE -->
      <dxi-column
        dataField="RoundOff"
        caption="Round Off Amount"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
      ></dxi-column>
      <!-- Group summary for MAIN_GROUP_NAME -->

      <!-- <dxi-column
        *ngIf="PurchaseReport.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column> -->
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
