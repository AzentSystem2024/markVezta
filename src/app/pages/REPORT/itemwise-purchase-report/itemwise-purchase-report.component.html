<div class="view-wrapper list-page">
  <!-- ================= FILTER PANEL ================= -->
  <div
    class="paramsDiv SearchParams-container"
    [ngClass]="{ 'hide-content': !isFilterVisible }"
  >
    <dx-form>
      <dxi-item itemType="group" [colCount]="6">
        <!-- Year -->
        <dxi-item>
          <dx-select-box
            label="Year"
            labelMode="floating"
            [(value)]="selectedYear"
            [dataSource]="years"
            (onValueChanged)="onYearChanged($event)"
          >
          </dx-select-box>
        </dxi-item>

        <!-- Month -->
        <dxi-item>
          <dx-select-box
            label="Month"
            labelMode="floating"
            [dataSource]="monthDataSource"
            displayExpr="name"
            valueExpr="value"
            [(value)]="selectedmonth"
            (onValueChanged)="onMonthValueChanged($event)"
          >
          </dx-select-box>
        </dxi-item>

        <!-- From Date -->
        <dxi-item>
          <dx-date-box
            label="From Date"
            labelMode="floating"
            [(value)]="selected_from_date"
            displayFormat="dd-MM-yyyy"
            [max]="today"
            (onValueChanged)="onFromDateChange($event)"
          >
          </dx-date-box>
        </dxi-item>

        <!-- To Date -->
        <dxi-item>
          <dx-date-box
            label="To Date"
            labelMode="floating"
            [(value)]="selected_To_date"
            displayFormat="dd-MM-yyyy"
            (onValueChanged)="onToDateChange($event)"
          >
          </dx-date-box>
        </dxi-item>

        <!-- Store -->
        <dxi-item>
          <dx-tag-box
            label="Store"
            labelMode="floating"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [items]="Store"
            [(value)]="selectedStoreid"
            [searchEnabled]="true"
            [maxDisplayedTags]="100"
            [showMultiTagOnly]="true"
            [multiline]="false"
            [showSelectionControls]="true"
            (onValueChanged)="updateStoreHint()"
          >
          </dx-tag-box>
        </dxi-item>

        <!-- Customer (smaller width) -->
        <dxi-item [colSpan]="1">
          <dx-select-box
            label="Supplier"
            labelMode="floating"
            [(value)]="selectedCustomer"
            [dataSource]="distributorList"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <!-- Empty space -->
        <dxi-item [colSpan]="1">
          <dx-select-box
            label="Department"
            labelMode="floating"
            [(value)]="selectedDepartment"
            [dataSource]="Department"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="1">
          <dx-select-box
            label="Catgeory"
            labelMode="floating"
            [(value)]="selectedCategory"
            [dataSource]="Category"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="1">
          <dx-select-box
            label="SubCategory"
            labelMode="floating"
            [(value)]="selectedSubcategory"
            [dataSource]="Subcategory"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <!-- Empty space -->
        <dxi-item [colSpan]="1">
          <dx-select-box
            label="Brand"
            labelMode="floating"
            [(value)]="selectedBrand"
            [dataSource]="Brand"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="1">
          <dx-select-box
            label="ItemProperty1"
            labelMode="floating"
            [(value)]="selectedItemProperty1"
            [dataSource]="itemProperty1"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="1">
          <dx-select-box
            label="ItemProperty2"
            labelMode="floating"
            [(value)]="selectedItemProperty2"
            [dataSource]="itemProperty2"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="1">
          <dx-select-box
            label="Salesman"
            labelMode="floating"
            [(value)]="selectedSalesman"
            [dataSource]="Salesman"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [searchEnabled]="true"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="3"></dxi-item>

        <!-- Apply button -->
        <dxi-item [colSpan]="1" cssClass="apply-btn-right">
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="Itemwise_Purchase_data()"
          >
          </dx-button>
        </dxi-item>
      </dxi-item>
    </dx-form>
  </div>

  <!-- ================= TOGGLE BUTTON ================= -->
  <div class="button-container mt-1 mb-2">
    <dx-button
      class="toggleButton"
      [width]="200"
      [height]="13"
      stylingMode="outlined"
      type="normal"
      [icon]="isFilterVisible ? 'chevronup' : 'chevrondown'"
      (onClick)="toggleFiltersPanel()"
      [hint]="isFilterVisible ? 'Hide Filters' : 'Show Filters'"
    >
    </dx-button>
  </div>

  <!-- ================= GRID ================= -->
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="JournalBookDataSource"
      height="79vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: true }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [remoteOperations]="false"
      [scrolling]="{ mode: 'virtual' }"
      [summary]="summaryColumnsData"
      [showColumnLines]="true"
      [showRowLines]="true"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      [headerFilter]="{ visible: true }"
      (onExporting)="onExporting($event)"
    >

     <dxo-group-panel [visible]="true"></dxo-group-panel>
     <dxo-grouping
      [contextMenuEnabled]="true"
    [autoExpandAll]="false">
  </dxo-grouping>

  <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx', 'pdf']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <!-- ================= TOOLBAR ================= -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">Itemwise Purchase</div>
        </dxi-item>

        <dxi-item widget="dxButton" [options]="searchButtonOptions"> </dxi-item>

        <dxi-item widget="dxButton" [options]="refreshButtonOptions">
        </dxi-item>

        <dxi-item name="exportButton"></dxi-item>
      </dxo-toolbar>

      <!-- ================= COLUMNS ================= -->
       <dxi-column dataField="ITEM_CODE" caption="Item" [groupIndex]="0" width="150"></dxi-column>
       <dxi-column dataField="DESCRIPTION" caption="Description" width="250"></dxi-column>
      <dxi-column
        dataField="PURCH_DATE"
        caption="Date"
        dataType="date"
        [format]="{ type: 'custom', formatter: formatDates }"
        width="120"
      >
      </dxi-column>
      <dxi-column dataField="PURCH_NO" caption="Purch No" width="100"></dxi-column>
      <dxi-column dataField="STORE_NAME" caption="Store"  width="150"></dxi-column>
      <dxi-column dataField="SUPP_NAME" caption="Supplier"  width="150"></dxi-column>
       <dxi-column dataField="QUANTITY" caption="Quantity"  width="100"></dxi-column>
      <dxi-column dataField="DEPT_NAME" caption="Department"  width="120"></dxi-column>
      <dxi-column dataField="CAT_NAME" caption="Category"  width="120"></dxi-column>
      <dxi-column dataField="SUBCAT_NAME" caption="Subcategory"  width="120"></dxi-column>
      <dxi-column dataField="BRAND_NAME" caption="Brand"  width="120"></dxi-column>
      <dxi-column dataField="CUSTOM1_NAME" caption="ItemProperty1"  width="120"></dxi-column>
      <dxi-column dataField="CUSTOM2_NAME" caption="ItemProperty2"  width="120"></dxi-column>

      <dxi-column
        dataField="RATE"
        caption="Price(AED)"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
         width="100"
      >
      </dxi-column>
      <dxi-column
        dataField="DISCOUNT"
        caption="Discount"
        alignment="right"
         width="100"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      >
      </dxi-column>
      <dxi-column
        dataField="GROSS_AMOUNT"
        caption="Excl.VAT Amount(AED)"
        alignment="right"
         width="100"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      >
      </dxi-column>
      <dxi-column dataField="VAT_PERCENT" caption="VAT %"  width="80"></dxi-column>
      <dxi-column
        dataField="VAT_AMOUNT"
        caption="VAT Amount(AED)"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
         width="100"
      >
      </dxi-column>
      <dxi-column
        dataField="NET_AMOUNT"
        caption="Net Amount(AED)"
        alignment="right"
         width="100"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      >
      </dxi-column>

      <dxi-column *ngIf="journalBookCount > 0" type="buttons" [width]="100">
        <dxi-button
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        >
        </dxi-button>
      </dxi-column>
    </dx-data-grid>
  </div>
</div>

<!-- ================= POPUP ================= -->
<dx-popup
  [(visible)]="isVerifyInvoice"
  [width]="'100vw'"
  [height]="'100vh'"
  [title]="buttonText"
  (onHiding)="handleClose()"
  titleTemplate="popupTitle"
>
  <div *dxTemplate="let data of 'popupTitle'">
    <div class="popup-title-text">
      {{ buttonText }}
    </div>
  </div>
  <ng-container *ngIf="isVerifyInvoice">
    <app-edit-purchase-invoice
      [isVerifyInvoice]="true"
      [isVerifyMode]="selectedInvoice?.STATUS !== 'Verified'"
      [isApproveMode]="selectedInvoice?.STATUS == 'Verified'"
      [status]="statusFinder"
      [invoiceFormData]="selectedInvoice"
      [readOnly]="isEditInvoiceReadOnly"
      (popupClosed)="handleClose()"
      [canApprove]="canApprove"
    ></app-edit-purchase-invoice>
  </ng-container>
</dx-popup>
