<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="TrialBalanceReport"
      width="100%"
      height="82vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [summary]="summaryConfig"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [scrolling]="{ mode: 'virtual' }"
      [headerFilter]="{ visible: false }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading...' }"
    >
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Trial Balance
          </div>
        </dxi-item>

        <dxi-item location="after" template="yearboxTemplate"></dxi-item>
        <dxi-item location="after" template="monthboxTemplate"></dxi-item>
        <dxi-item location="after" template="fromdateboxTemplate"></dxi-item>
        <dxi-item location="after" template="todateboxTemplate"></dxi-item>

      <dx-tag-box
  label="Store"
  labelMode="floating"
  displayExpr="DESCRIPTION" 
  valueExpr="ID"
  [items]="Store"
  [searchEnabled]="true"
  [(value)]="selectedStoreid"
  [showSelectionControls]="true"
  [maxDisplayedTags]="100"

  [multiline]="false"
  [hint]="storeHint"
  [width]="150"
  (onValueChanged)="updateStoreHint()"
></dx-tag-box>
    </dxi-item> -->
        <!-- <dxi-item name="exportButton" [disabled]="isEmptyDatagrid"></dxi-item> -->

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="applyButtonOptions"
        ></dxi-item>

        <dxi-item location="after">
          <div class="toolbar-divider"></div>

        <dxi-item>
          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            class="mt-2"

          </dx-button>

        location="after"

          onClick: toggleFilterRow,

          elementAttr: { class: 'commonButtons' }
        }"
      ></dxi-item> -->
      </dxo-toolbar>

      <div *dxTemplate="let data of 'yearboxTemplate'">
        <dx-select-box
          labelMode="floating"
          labelLocation="left"
          label="Year"
          [width]="150"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>
      </div>

      <div *dxTemplate="let data of 'monthboxTemplate'">
        <dx-select-box
          labelMode="floating"
          labelLocation="left"
          label="month"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
        >
        </dx-select-box>
      </div>

      <div *dxTemplate="let data of 'fromdateboxTemplate'">
        <dx-date-box
          [width]="150"
          label="Date From"
          labelMode="floating"
          [displayFormat]="'dd-MM-yyyy'"
          [value]="formatted_from_date"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>
      </div>
      <div *dxTemplate="let data of 'todateboxTemplate'">
        <dx-date-box
          [width]="150"
          label="As on Date"
          labelMode="floating"
          [value]="formatted_To_date"
          [displayFormat]="'dd-MM-yyyy'"
          (onValueChanged)="onToDateChange($event)"
        >
        </dx-date-box>
      </div>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <!-- <dxi-column dataField="DEPARTMENT_NAME" caption="Department Name" dataType="string"></dxi-column> -->
      <dxi-column
        dataField="MainGroup"
        caption="Main Group"
        dataType="string"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="SubGroup"
        caption="Sub Group"
        alignment="left"
        width="150"
        dataType="number"
      ></dxi-column>
      <dxi-column
        dataField="Category"
        caption="Category"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="LedgerCode"
        caption="Ledger Code"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="LedgerName"
        caption="Ledger Name"
        width="250"
      ></dxi-column>
      <dxi-column
        dataField="STORE_NAME"
        [caption]="appType === 'VEZTA' ? 'Facility' : 'Store/Branch'"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="DEPT_NAME"
        caption="Department"
        width="120"
      ></dxi-column>
      <dxi-column
        caption="Opening Balance"
        cssClass="opening-header"
        width="130"
      >
        <dxi-column
          dataField="OpeningBalanceDebit"
          caption="Debit"
          cssClass="opening-sub-header"
          width="130"
          [allowEditing]="false"
          alignment="right"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        ></dxi-column>
        <dxi-column
          dataField="OpeningBalanceCredit"
          caption="Credit"
          width="130"
          cssClass="opening-sub-header"
          alignment="center"
          alignment="right"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        >
        </dxi-column>
      </dxi-column>

      <dxi-column
        caption="During the Period"
        cssClass="DuringPeriod-header"
        width="130"
      >
        <dxi-column
          dataField="DuringThePeriodDebit"
          caption="Debit"
          alignment="right"
          cssClass="DuringPeriod-sub-header"
          width="130"
          [allowEditing]="false"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        ></dxi-column>
        <dxi-column
          dataField="DuringThePeriodCredit"
          caption="Credit"
          alignment="center"
          cssClass="DuringPeriod-sub-header"
          alignment="right"
          width="130"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        >
        </dxi-column>
      </dxi-column>

      <dxi-column
        caption="Closing Balance"
        cssClass="closing-header"
        width="130"
      >
        <dxi-column
          dataField="ClosingBalanceDebit"
          caption="Debit"
          alignment="right"
          [width]="130"
          cssClass="closing-sub-header"
          [allowEditing]="false"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        ></dxi-column>
        <dxi-column
          dataField="ClosingBalanceCredit"
          caption="Credit"
          cssClass="closing-sub-header"
          alignment="right"
          width="130"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        >
        </dxi-column>
      </dxi-column>

      <dxi-column
        *ngIf="TrialBalanceReport.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
