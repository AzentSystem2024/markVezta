<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- ================= FILTER PANEL ================= -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          label="Year"
          labelMode="floating"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
        >
        </dx-select-box>

        <dx-select-box
          label="Month"
          labelMode="floating"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
        >
        </dx-select-box>

        <dx-date-box
          label="From Date"
          labelMode="floating"
          [(value)]="selected_from_date"
          displayFormat="dd-MM-yyyy"
          [max]="today"
          (onValueChanged)="onFromDateChange($event)"
        >
        </dx-date-box>

        <dx-date-box
          label="To Date"
          labelMode="floating"
          [(value)]="selected_To_date"
          displayFormat="dd-MM-yyyy"
          (onValueChanged)="onToDateChange($event)"
        >
        </dx-date-box>

        <dx-tag-box
          label="Store"
          labelMode="floating"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [items]="Store"
          [searchEnabled]="true"
          [(value)]="selectedStoreid"
          [showSelectionControls]="true"
          [maxDisplayedTags]="100"
          [showMultiTagOnly]="true"
          [multiline]="false"
          [hint]="storeHint"
          (onValueChanged)="updateStoreHint()"
        ></dx-tag-box>

        <dx-select-box
          label="Supplier"
          labelMode="floating"
          [(value)]="selectedCustomer"
          [dataSource]="distributorList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [searchEnabled]="true"
        >
        </dx-select-box>

        <dx-button
          text="Apply"
          type="default"
          stylingMode="contained"
          (onClick)="load_JournalBook_data()"
        >
        </dx-button>
      </div>
    </div>

    <!-- ================= TOGGLE BUTTON ================= -->
    <div class="toggle-bar" (click)="toggleParameters()">
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <!-- ================= GRID ================= -->

    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="SaleSummaryDataSource"
      height="79vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: true }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [remoteOperations]="false"
      [scrolling]="{ mode: 'virtual' }"
      [summary]="summaryColumnsData"
      [showColumnLines]="true"
      [showRowLines]="true"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      [headerFilter]="{ visible: true }"
      (onExporting)="onExporting($event)"
    >
      <dxo-group-panel [visible]="true"></dxo-group-panel>
      <dxo-grouping [contextMenuEnabled]="true" [autoExpandAll]="false">
      </dxo-grouping>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <!-- ================= TOOLBAR ================= -->
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">Purchase Summary</div>
        </dxi-item>

        <dxi-item widget="dxButton" [options]="searchButtonOptions"> </dxi-item>

        <dxi-item widget="dxButton" [options]="refreshButtonOptions">
        </dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <!-- ================= COLUMNS ================= -->
      <dxi-column
        dataField="STORE"
        caption="Store"
        [groupIndex]="0"
      ></dxi-column>
      <dxi-column
        dataField="DATE"
        caption="Date"
        dataType="date"
        [format]="{ type: 'custom', formatter: formatDates }"
        width="120"
      >
      </dxi-column>

      <dxi-column
        dataField="INVOICE_NO"
        caption="Invoice No"
        width="190"
      ></dxi-column>
      <dxi-column
        dataField="SUPPLIER"
        caption="Supplier"
        width="300"
      ></dxi-column>
      <dxi-column
        dataField="PURCHASE_NO"
        caption="Purchase No"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="DISCOUNT"
        caption="Discount"
        width="100"
      ></dxi-column>
      <dxi-column
        caption="Excl.VAT Total(AED)"
        name="ExVATtotal"
        [calculateCellValue]="getExVATtotal"
        alignment="right"
        [allowHeaderFiltering]="true"
        width="120"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      >
      </dxi-column>
      <dxi-column
        caption="VAT Amount(AED)"
        alignment="right"
        width="120"
        dataField="VAT_AMOUNT"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      >
      </dxi-column>
      <dxi-column
        name="netAmount"
        [calculateCellValue]="getNetAmount"
        caption="Inc.VAT Total(AED)"
        alignment="right"
        width="100"
        [allowHeaderFiltering]="true"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      >
      </dxi-column>

      <dxi-column *ngIf="journalBookCount > 0" type="buttons" [width]="100">
        <dxi-button
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        >
        </dxi-button>
      </dxi-column>
    </dx-data-grid>

    <!-- Custom Column Chooser Popup -->
    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>

<!-- ================= POPUP ================= -->
<dx-popup
  [(visible)]="isVerifyInvoice"
  [width]="'100vw'"
  [height]="'100vh'"
  [title]="buttonText"
  (onHiding)="handleClose()"
  titleTemplate="popupTitle"
>
  <div *dxTemplate="let data of 'popupTitle'">
    <div class="popup-title-text">
      {{ buttonText }}
    </div>
  </div>
  <ng-container *ngIf="isVerifyInvoice">
    <app-edit-purchase-invoice
      [isVerifyInvoice]="true"
      [isVerifyMode]="selectedInvoice?.STATUS !== 'Verified'"
      [isApproveMode]="selectedInvoice?.STATUS == 'Verified'"
      [status]="statusFinder"
      [invoiceFormData]="selectedInvoice"
      [readOnly]="isEditInvoiceReadOnly"
      (popupClosed)="handleClose()"
      [canApprove]="canApprove"
    ></app-edit-purchase-invoice>
  </ng-container>
</dx-popup>
