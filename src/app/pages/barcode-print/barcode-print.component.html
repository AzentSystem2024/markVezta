<div
  class="invoice-wrapper"
  style="
    height: 85vh;
    display: flex;
    flex-direction: column;

    box-sizing: border-box;
  "
>
  <div class="salary-grid-wrapper" style="padding: 0 20px">
    <div class="grid-container">
      <dx-data-grid
        #dataGrid
        noDataText="No data available"
        [width]="'100%'"
        [height]="'75vh'"
        [loadPanel]="{
          enabled: true,
          text: 'Loading...',
          showIndicator: true,
          showPane: true,
        }"
        class="grid theme-dependent"
        [dataSource]="itemsList"
        [showBorders]="true"
        [showRowLines]="true"
        [showColumnLines]="true"
        [columnAutoWidth]="false"
        [wordWrapEnabled]="false"
        [rowAlternationEnabled]="true"
        [allowColumnReordering]="true"
        [showColumnHeaders]="true"
        [columnAutoWidth]="true"
        [allowColumnResizing]="true"
        [columnResizingMode]="'nextColumn'"
        [filterRow]="{ visible: false }"
        [headerFilter]="{ visible: false }"
        [scrolling]="{ mode: 'virtual' }"
        rowAlternationInterval="2"
        [selection]="{
          mode: 'multiple',
          showCheckBoxesMode: 'always',
        }"
        focusStateEnabled="false"
        [scrolling]="{ mode: 'virtual' }"
        (onSelectionChanged)="onSelectionChanged($event)"
        (onEditorPreparing)="onEditorPreparing($event)"
        (onEditingStart)="onEditingStart($event)"
      >
        <dxo-editing
          mode="cell"
          [allowUpdating]="canEdit"
          [allowDeleting]="false"
        ></dxo-editing>
        <!-- <dxo-export
          [enabled]="true"
          [allowExportSelectedData]="false"
          [formats]="['xlsx']"
        >
        </dxo-export> -->
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [visible]="true"
          [allowedPageSizes]="allowedPageSizes"
          [displayMode]="displayMode"
          [showPageSizeSelector]="showPageSizeSelector"
          [showInfo]="true"
          [showNavigationButtons]="true"
        ></dxo-pager>
        <dxo-load-panel [showPane]="false"></dxo-load-panel>
        <!-- <dxo-scrolling mode="standard"></dxo-scrolling> -->
        <dxo-filter-row
          [visible]="isFilterRowVisible"
          [applyFilter]="auto"
        ></dxo-filter-row>
        <dxo-header-filter [visible]="isFilterOpened">
          <dxo-search [enabled]="true"></dxo-search>
        </dxo-header-filter>
        <dxo-header-filter [visible]="isFilterOpened">
          <dxo-search [enabled]="true"></dxo-search>
        </dxo-header-filter>
        <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
        <dxo-filter-builder [allowHierarchicalFields]="true">
        </dxo-filter-builder>
        <dxo-toolbar>
          <!-- Heading -->
          <dxi-item location="before">
            <div style="font-size: 18px; font-weight: 600; margin-right: 20px">
              Barcode Printer
            </div>
          </dxi-item>

          <!-- Radio -->
          <dxi-item location="before">
            <dx-radio-group
              [items]="radioOptions"
              [(value)]="selectedType"
              layout="horizontal"
            >
            </dx-radio-group>
          </dxi-item>

          <!-- GRN Dropdown -->
          <dxi-item location="after">
            <dx-select-box
              [visible]="selectedType === 'GRN'"
              [dataSource]="grnList"
              displayExpr="GRN_NO"
              valueExpr="GRN_ID"
              [(value)]="selectedGRN"
              placeholder="Select GRN"
              [width]="220"
              [searchEnabled]="true"
            >
            </dx-select-box>
          </dxi-item>
          <dxi-item location="after">
            <dx-select-box
              [dataSource]="barcodeFormats"
              [(value)]="selectedBarcodeFormat"
              placeholder="Barcode Format"
              [width]="180"
            >
            </dx-select-box>
          </dxi-item>
          <!-- Print -->
          <dxi-item location="after">
            <dx-button
              text="Print"
              icon="print"
              type="default"
              stylingMode="contained"
              (onClick)="onPrint()"
            >
            </dx-button>
          </dxi-item>
        </dxo-toolbar>
        <dxi-column
          dataField="ITEM_ID"
          caption="Item ID"
          [allowEditing]="false"
          [visible]="false"
        ></dxi-column>
        <dxi-column
          dataField="ITEM_CODE"
          caption="Item Code"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="BARCODE"
          caption="Barcode"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="DESCRIPTION"
          caption="Descriptiom"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="DEPARTMENT"
          caption="Department"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="CATEGORY"
          caption="Category"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="PRICE"
          caption="Price"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="QTY"
          caption="Quantity"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="BARCODE_QTY"
          caption="Barcode Qty"
          [allowEditing]="true"
        ></dxi-column>
      </dx-data-grid>
    </div>
  </div>
</div>
