<div class="view-wrapper list-page">
  <div class="grid-container">
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <!-- Financial Dimension -->
        <dx-tag-box
          label="Financial Dimension"
          labelMode="floating"
          [width]="170"
          [dataSource]="Diamensions"
          placeholder="Select Dimension"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [searchEnabled]="true"
          [showSelectionControls]="true"
          [showMultiTagOnly]="true"
          [multiline]="false"
          [(value)]="selectedDiamensions"
          (onValueChanged)="onDimensionChange($event)"
          [hint]="getSelectedDimensionHint()"
        ></dx-tag-box>

        <!-- Year -->
        <dx-select-box
          label="Year"
          labelMode="floating"
          [width]="100"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <!-- Month -->
        <dx-select-box
          label="Month"
          labelMode="floating"
          [width]="120"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
        ></dx-select-box>

        <!-- Date From -->
        <dx-date-box
          label="Date From"
          labelMode="floating"
          [width]="140"
          displayFormat="dd-MM-yyyy"
          [value]="formatted_from_date"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <!-- Date To -->
        <dx-date-box
          label="Date To"
          labelMode="floating"
          [width]="140"
          displayFormat="dd-MM-yyyy"
          [value]="formatted_To_date"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <!-- Apply -->
        <dx-button
          text="Apply"
          type="default"
          stylingMode="contained"
          (onClick)="get_DataSource()"
        ></dx-button>
      </div>
    </div>

    <!-- Horizontal Toggle Bar -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      [title]="showParameters ? 'Hide Filters' : 'Show Filters'"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="ProfitLossReport"
      width="100%"
      height="82vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [grouping]="{ autoExpandAll: true }"
      [remoteOperations]="false"
      [scrolling]="{ mode: 'virtual' }"
      (onCellPrepared)="onCellPrepared($event)"
      (onRowPrepared)="onRowPrepared($event)"
      [allowColumnReordering]="true"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: false, text: 'Loading...' }"
      (onCellClick)="onCellClick($event)"
    >
      <dxo-column-chooser
        [height]="500"
        hideOnOutsideClick="true"
        [enabled]="true"
        mode="select"
      ></dxo-column-chooser>
      <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Profit & Loss
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>

      <dxo-grouping
        *ngIf="ProfitLossReport.length > 0"
        [autoExpandAll]="true"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>

      <dxi-column
        dataField="TYPE_NAME"
        caption="Category"
        dataType="string"
        sortOrder="asc"
        [groupIndex]="0"
        [sortingMethod]="typeSorting"
        width="180"
      ></dxi-column>

      <dxi-column
        dataField="MAIN_GROUP_NAME"
        caption="Group"
        alignment="left"
        dataType="number"
        [groupIndex]="1"
        width="180"
      ></dxi-column>

      <dxi-column
        dataField="HEAD_NAME"
        caption="Particulars"
        width="180"
      ></dxi-column>
      <dxi-column dataField="CODE" caption="Code" width="200"></dxi-column>

      <dxi-column
        dataField="DESCRIPTION"
        caption="Description"
        width="200"
      ></dxi-column>

      <dxi-column
        dataField="AMOUNT"
        caption="Amount"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>

      <!-- Group summary for MAIN_GROUP_NAME -->
      <dxo-summary *ngIf="isSummaryVisible">
        <dxi-group-item
          column="AMOUNT"
          summaryType="sum"
          [alignByColumn]="true"
          displayFormat="Total: {0}"
          valueFormat="#,##0.00"
        >
        </dxi-group-item>

        <dxi-total-item column="AMOUNT" summaryType="sum" displayFormat="">
        </dxi-total-item>
      </dxo-summary>

      <dxi-column
        *ngIf="ProfitLossReport.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>

  <dx-popup
    [(visible)]="dimensionPopupVisible"
    [width]="700"
    [height]="500"
    title="Financial Dimension Details"
    [showCloseButton]="true"
    [dragEnabled]="true"
    [hideOnOutsideClick]="true"
  >
    <dx-data-grid
      [dataSource]="dimensionPopupData"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [rowAlternationEnabled]="true"
    >
      <dxi-column dataField="Dimension" caption="Dimension"></dxi-column>
      <dxi-column dataField="Code" caption="Code"></dxi-column>
      <dxi-column dataField="Description" caption="Description"></dxi-column>
    </dx-data-grid>
  </dx-popup>
</div>
