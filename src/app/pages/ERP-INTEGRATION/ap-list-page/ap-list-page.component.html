<div class="view-wrapper list-page">
  <dx-data-grid
    #detailGrid
    class="grid theme-dependent"
    [class.grid-no-data]="!importDataList?.length"
    [dataSource]="importDataList"
    [showBorders]="true"
    [rowAlternationEnabled]="true"
    rowAlternationInterval="2"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    [columnResizingMode]="'widget'"
    [columnAutoWidth]="false"
    [wordWrapEnabled]="false"
    [height]="'84vh'"
    noDataText="No records found."
    keyExpr="_rowKey"
    [export]="{ enabled: true, formats: ['xlsx'] }"
    (onRowExpanding)="onRowExpanding($event)"
    (onRowCollapsing)="onRowCollapsing($event)"
    (onCellPrepared)="onCellPrepared($event)"
    (onEditorPreparing)="onEditorPreparing($event)"
    (onCellClick)="onCellClick($event)"
    (onExporting)="onExporting($event)"
  >
    <dxo-selection
      [mode]="importDataList?.length ? 'multiple' : 'none'"
      [showCheckBoxesMode]="importDataList?.length ? 'always' : 'none'"
    >
    </dxo-selection>
    <dxi-column
      type="selection"
      [allowSelectAll]="true"
      [visible]="(importDataList?.length || 0) > 0"
      [allowHeaderFiltering]="false"
      [allowFiltering]="false"
    >
    </dxi-column>

    <!-- Master Grid Explicit Columns via dxi-column (No ID fields) -->
    <dxi-column
      dataField="DocumentType"
      caption="Document Type"
      alignment="left"
      [width]="150"
    ></dxi-column>

    <dxi-column
      dataField="SupplierCode"
      caption="Supplier Code"
      alignment="left"
      [width]="130"
    ></dxi-column>

    <dxi-column
      dataField="SupplierName"
      caption="Supplier Name"
      alignment="left"
      [minWidth]="200"
    ></dxi-column>

    <dxi-column
      dataField="InvoiceNo"
      caption="Invoice No"
      alignment="left"
      [width]="160"
    ></dxi-column>

    <dxi-column
      dataField="InvoiceDate"
      caption="Invoice Date"
      alignment="center"
      [width]="130"
    ></dxi-column>

    <dxi-column
      dataField="SupplierInvoiceNo"
      caption="Supplier Invoice No"
      alignment="left"
      [width]="160"
    ></dxi-column>

    <dxi-column
      dataField="SupplierInvoiceDate"
      caption="Supplier Invoice Date"
      alignment="center"
      [width]="150"
    ></dxi-column>

    <dxi-column
      dataField="OriginBranch"
      caption="Origin Branch"
      alignment="center"
      [width]="120"
    ></dxi-column>

    <dxi-column
      dataField="Narration"
      caption="Narration"
      alignment="left"
      [minWidth]="150"
    ></dxi-column>

    <dxi-column
      dataField="Status"
      caption="Status"
      alignment="center"
      [width]="100"
      [fixed]="true"
      fixedPosition="right"
    ></dxi-column>

    <dxi-column
      dataField="FailureReason"
      caption="Failure Reason"
      alignment="left"
      [width]="180"
      [fixed]="true"
      fixedPosition="right"
    ></dxi-column>

    <!-- Master Detail Configuration -->
    <dxo-master-detail [enabled]="true" template="detailTemplate">
    </dxo-master-detail>

    <!-- =========== master details main div ========= -->
    <div
      class="master-detail-flow-container"
      *dxTemplate="let masterData of 'detailTemplate'"
    >
      <div class="flow-arrow"></div>
      <div
        class="detail-grid-container"
        style="position: relative; min-height: 60px"
      >
        <!-- Ensure loader and details are triggered -->
        <ng-container *ngIf="ensureDetailsLoaded(masterData)"></ng-container>

        <!-- Loader displayed while expanding / loading details -->
        <div
          *ngIf="detailLoadingMap[masterData.key]"
          style="text-align: center; padding: 25px 0"
        >
          <dx-load-indicator [visible]="true"></dx-load-indicator>
          <div style="margin-top: 10px; color: #666; font-size: 13px">
            Loading details...
          </div>
        </div>

        <dx-data-grid
          *ngIf="!detailLoadingMap[masterData.key]"
          [dataSource]="detailDataMap[masterData.key] || []"
          noDataText="No details available"
          [showBorders]="true"
          [showColumnLines]="true"
          [showRowLines]="true"
          [columnAutoWidth]="false"
          [wordWrapEnabled]="false"
          [rowAlternationEnabled]="true"
          width="100%"
          [height]="'30vh'"
          (onCellPrepared)="onCellPrepared($event)"
        >
          <dxo-scrolling mode="standard" showScrollbar="always"></dxo-scrolling>
          <dxo-paging [pageSize]="10"></dxo-paging>
          <dxo-pager
            [visible]="false"
            [allowedPageSizes]="[10, 20, 50, 'all']"
            [showPageSizeSelector]="true"
            [showInfo]="true"
          ></dxo-pager>

          <!-- Detail Grid Explicit Columns via dxi-column (No ID fields) -->
          <dxi-column
            dataField="MatlCode"
            caption="Material Code"
            alignment="left"
            [width]="140"
          ></dxi-column>

          <dxi-column
            dataField="MatlName"
            caption="Material Name"
            alignment="left"
            [minWidth]="220"
          ></dxi-column>

          <dxi-column
            dataField="GrossAmt"
            caption="Gross Amount"
            alignment="right"
            dataType="number"
            format="#,##0.00"
            [width]="130"
          ></dxi-column>

          <dxi-column
            dataField="Discount"
            caption="Discount"
            alignment="right"
            dataType="number"
            format="#,##0.00"
            [width]="110"
          ></dxi-column>

          <dxi-column
            dataField="AdditionalDiscount"
            caption="Addl Discount"
            alignment="right"
            dataType="number"
            format="#,##0.00"
            [width]="120"
          ></dxi-column>

          <dxi-column
            dataField="NetAmt"
            caption="Net Amount"
            alignment="right"
            dataType="number"
            format="#,##0.00"
            [width]="130"
          ></dxi-column>

          <dxi-column
            dataField="VATAmt"
            caption="VAT Amount"
            alignment="right"
            dataType="number"
            format="#,##0.00"
            [width]="120"
          ></dxi-column>

          <dxi-column
            dataField="VATType"
            caption="VAT Type"
            alignment="center"
            [width]="100"
          ></dxi-column>

          <dxi-column
            dataField="VATLink"
            caption="VAT Link"
            alignment="left"
            [width]="120"
          ></dxi-column>

          <dxi-column
            dataField="VATPercent"
            caption="VAT %"
            alignment="right"
            dataType="number"
            [width]="90"
          ></dxi-column>

          <dxi-column
            dataField="PurchaseVariance"
            caption="Purchase Variance"
            alignment="right"
            dataType="number"
            format="#,##0.00"
            [width]="140"
          ></dxi-column>

          <dxi-column
            dataField="OrgnBranchCode"
            caption="Branch"
            alignment="center"
            [width]="90"
          ></dxi-column>

          <dxi-column
            dataField="ApexTransferDate"
            caption="Transfer Date"
            alignment="center"
            [width]="130"
          ></dxi-column>

          <dxi-column
            dataField="Status"
            caption="Status"
            alignment="center"
            [width]="100"
            [fixed]="true"
            fixedPosition="right"
          ></dxi-column>

          <dxi-column
            dataField="FailureReason"
            caption="Failure Reason"
            alignment="left"
            [width]="160"
            [fixed]="true"
            fixedPosition="right"
          ></dxi-column>

          <!-- <dxo-summary>
            <dxi-total-item
              column="GrossAmt"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="Total Gross: {0}"
            ></dxi-total-item>
            <dxi-total-item
              column="NetAmt"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="Total Net: {0}"
            ></dxi-total-item>
          </dxo-summary> -->
        </dx-data-grid>
      </div>
    </div>

    <!-- ================= Filter ================= -->
    <dxo-filter-row
      [visible]="false"
      [applyFilter]="currentFilter"
    ></dxo-filter-row>

    <dxo-header-filter [visible]="false">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>

    <!-- ================= Paging ================= -->
    <dxo-paging [pageSize]="10"></dxo-paging>

    <dxo-pager
      [visible]="true"
      [showInfo]="true"
      [showNavigationButtons]="true"
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[10, 20, 30, 40]"
    >
    </dxo-pager>
    <dxo-scrolling
      mode="virtual"
      rowRenderingMode="virtual"
      columnRenderingMode="virtual"
      showScrollbar="always"
      preloadEnabled="true"
      useNative="false"
    >
    </dxo-scrolling>

    <dxo-load-panel [enabled]="false" [showPane]="true" [showIndicator]="true">
    </dxo-load-panel>

    <!-- ================= Toolbar ================= -->
    <dxo-toolbar>
      <dxi-item location="before" locateInMenu="never">
        <div class="grid-header">AP List</div>
      </dxi-item>

      <dxi-item location="after" template="dateFilterTemplate"></dxi-item>

      <!-- Divider -->
      <dxi-item location="after">
        <div class="toolbar-divider"></div>
      </dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="searchButtonOptions"
      >
      </dxi-item>

      <!-- Refresh -->
      <dxi-item
        location="after"
        widget="dxButton"
        [options]="refreshButtonOptions"
      >
      </dxi-item>

      <!-- Divider -->
      <dxi-item location="after">
        <div class="toolbar-divider"></div>
      </dxi-item>

      <dxi-item name="exportButton" location="after" cssClass="export-btn">
      </dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="ValidateButtonOptions"
      >
      </dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="ReProcessButtonOptions"
      >
      </dxi-item>
    </dxo-toolbar>

    <!-- ---- custom daterange select box template ---- -->
    <div *dxTemplate="let data of 'dateFilterTemplate'">
      <dx-select-box
        [dataSource]="dateRanges"
        [displayExpr]="displayExpr"
        valueExpr="value"
        [(value)]="selectedDateRange"
        (onValueChanged)="onDateRangeChanged($event)"
        (onOpened)="attachItemClickHandler($event)"
        width="220"
      >
        <div *dxTemplate="let item of 'item'">
          {{ item.value === "custom" ? "Custom" : item.label }}
        </div>
      </dx-select-box>
    </div>
  </dx-data-grid>

  <!-- Journal Voucher Popup -->
  <dx-popup
    [(visible)]="isViewJournalVoucher"
    [width]="'90vw'"
    [height]="'100vh'"
    title="Journal View"
    (onHiding)="handleClose()"
  >
    <app-erp-jv
      [journalVoucherFormData]="selectedJournalVoucher"
      (popupClosed)="handleClose()"
      [JVid]="selectedTransID"
    ></app-erp-jv>
  </dx-popup>

  <!-- Custom Date Popup -->
  <app-custom-date-popup
    [(visible)]="showCustomDatePopup"
    [startDate]="customStartDate"
    [endDate]="customEndDate"
    (applyDates)="onCustomDateApplied($event)"
  >
  </app-custom-date-popup>

  <!-- Loading Panel -->
  <dx-load-panel
    [visible]="isLoading"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
    [hideOnOutsideClick]="false"
    shadingColor="rgba(0,0,0,0.4)"
    [message]="loadingMessage"
  >
  </dx-load-panel>

  <!-- Progress Section for Processing Rows -->
  <dx-load-panel
    [visible]="isProcessingRows"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
    [hideOnOutsideClick]="false"
    shadingColor="rgba(0,0,0,0.4)"
    [message]="progressMessage"
  >
    <div *dxTemplate="let data of 'content'">
      <div class="text-center">
        <div class="mb-2">
          Total :
          <b>{{ totalRequestCount }}</b>
        </div>

        <div class="mb-2">
          Completed :
          <b class="text-success">
            {{ completedRequestCount }}
          </b>
        </div>

        <div class="mb-2">
          Failed :
          <b class="text-danger">
            {{ failedRequestCount }}
          </b>
        </div>

        <div class="mb-2">
          Pending :
          <b class="text-warning">
            {{ pendingRequestCount }}
          </b>
        </div>
      </div>
    </div>
  </dx-load-panel>

  <!-- Validation Summary Popup -->
  <dx-popup
    [(visible)]="isValidationPopupVisible"
    [width]="'70vw'"
    [height]="'auto'"
    title="Validation Summary"
    [showCloseButton]="true"
    [dragEnabled]="true"
    [closeOnOutsideClick]="false"
  >
    <div *dxTemplate="let data of 'content'">
      <dx-data-grid
        [dataSource]="filteredValidationGridData"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
        [columnAutoWidth]="true"
        [height]="'65vh'"
        (onRowDblClick)="viewErrorDetails($event.data)"
      >
        <dxo-header-filter [visible]="true">
          <dxo-search [enabled]="true"></dxo-search>
        </dxo-header-filter>
        <dxo-scrolling
          mode="virtual"
          rowRenderingMode="virtual"
        ></dxo-scrolling>
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [visible]="true"
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[10, 20, 50, 100]"
          [showInfo]="true"
        ></dxo-pager>
        <dxi-column
          dataField="TransactionType"
          caption="Transaction Type"
          width="auto"
        ></dxi-column>
        <dxi-column
          dataField="ErrorMessage"
          caption="Particulars"
          width="350"
          [wordWrapEnabled]="true"
        ></dxi-column>
        <dxi-column
          dataField="MissingCount"
          caption="Missing Count"
          alignment="center"
          width="auto"
        ></dxi-column>
        <dxi-column
          dataField="AffectedRowsCount"
          caption="Rows Count"
          alignment="center"
          width="auto"
        ></dxi-column>
        <dxi-column
          caption="Download"
          cellTemplate="downloadTemplate"
          alignment="center"
          [width]="100"
        ></dxi-column>

        <div *dxTemplate="let cell of 'downloadTemplate'">
          <dx-button
            *ngIf="
              hasMissingData(cell.data.Particular, cell.data.TransactionType) &&
              !cell.data.ErrorMessage?.toLowerCase().includes('mandatory') &&
              !cell.data.ErrorMessage?.toLowerCase().includes(
                'referencedocnumber'
              )
            "
            icon="export"
            type="normal"
            hint="Download Missing Data"
            (onClick)="
              downloadMissingParticulars(
                cell.data.Particular,
                cell.data.TransactionType
              )
            "
          ></dx-button>
        </div>
      </dx-data-grid>
    </div>
  </dx-popup>

  <!-- Error Details Popup -->
  <dx-popup
    [(visible)]="isErrorDetailsPopupVisible"
    [width]="'90vw'"
    [height]="'90vh'"
    title="Error Details"
    [showCloseButton]="true"
  >
    <div *dxTemplate="let data of 'content'" class="p-1">
      <dx-data-grid
        [dataSource]="errorDetailsGridData"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
        [columnAutoWidth]="false"
        [columnWidth]="150"
        [allowColumnResizing]="true"
        [height]="'80vh'"
      >
        <dxo-scrolling
          mode="virtual"
          rowRenderingMode="virtual"
        ></dxo-scrolling>
        <dxo-paging [pageSize]="20"></dxo-paging>
        <dxo-pager
          [visible]="true"
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[10, 20, 50, 100]"
          [showInfo]="true"
        ></dxo-pager>
      </dx-data-grid>
    </div>
  </dx-popup>
</div>
