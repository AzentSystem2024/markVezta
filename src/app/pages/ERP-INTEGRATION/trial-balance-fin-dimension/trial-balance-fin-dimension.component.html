<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- Filter Panel -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <!-- Financial Dimension -->
        <dx-tag-box
          label="Financial Dimension"
          labelMode="floating"
          [width]="200"
          [dataSource]="Diamensions"
          placeholder="Select Dimension"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [searchEnabled]="true"
          [showSelectionControls]="true"
          [showMultiTagOnly]="true"
          [multiline]="false"
          [(value)]="selectedDiamensions"
          (onValueChanged)="onDimensionChange($event)"
          [hint]="getSelectedDimensionHint()"
          tagTemplate="customTag"
        >
          <div *dxTemplate="let item of 'customTag'" class="custom-tag">
            {{ item.DESCRIPTION }}{{ item.SHORT_NAME }}
            <span *ngIf="!isLastTag(item)"> - </span>
          </div>
        </dx-tag-box>

        <!-- Year -->
        <dx-select-box
          label="Year"
          labelMode="floating"
          [width]="100"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        ></dx-select-box>

        <!-- Month -->
        <dx-select-box
          label="Month"
          labelMode="floating"
          [width]="120"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
        ></dx-select-box>

        <!-- Date From -->
        <dx-date-box
          label="Date From"
          labelMode="floating"
          [width]="140"
          displayFormat="dd-MM-yyyy"
          [value]="formatted_from_date"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <!-- Date To -->
        <dx-date-box
          label="Date To"
          labelMode="floating"
          [width]="140"
          displayFormat="dd-MM-yyyy"
          [value]="formatted_To_date"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <!-- Apply -->
        <dx-button
          text="Apply"
          type="default"
          stylingMode="contained"
          (onClick)="get_DataSource()"
        ></dx-button>
      </div>
    </div>

    <!-- Horizontal Toggle Bar -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      [title]="showParameters ? 'Hide Filters' : 'Show Filters'"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <dx-data-grid
      #dataGrid
      id="dataGrid"
      class="grid theme-dependent"
      [dataSource]="TrialBalanceReport"
      width="100%"
      height="82vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [summary]="summaryConfig"
      [allowColumnReordering]="true"
      id="dataGrid"
      [scrolling]="{ mode: 'virtual' }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      (onExporting)="onExporting($event)"
      [loadPanel]="{ enabled: true, text: 'Loading...' }"
      (onCellClick)="onCellClick($event)"
    >
      <dxo-column-chooser
        [height]="500"
        hideOnOutsideClick="true"
        [enabled]="true"
        mode="select"
      ></dxo-column-chooser>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Trial Balance
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
      <dxo-header-filter
        [visible]="true"
        [allowSearch]="true"
        [allowSelectAll]="true"
        [search]="{ enabled: true, mode: 'contains' }"
      >
      </dxo-header-filter>

      <dxi-column
        dataField="MainGroup"
        caption="Main Group"
        dataType="string"
        width="180"
      ></dxi-column>
      <dxi-column
        dataField="SubGroup"
        caption="Sub Group"
        alignment="left"
        dataType="number"
        width="180"
      ></dxi-column>
      <dxi-column
        dataField="Category"
        caption="Category"
        width="180"
      ></dxi-column>
      <dxi-column dataField="Code" caption="Code" width="150"></dxi-column>
      <dxi-column
        dataField="Description"
        caption="Description"
        width="200"
      ></dxi-column>
      <dxi-column caption="Opening Balance" cssClass="opening-header">
        <dxi-column
          dataField="OpeningBalanceDebit"
          caption="Debit"
          cssClass="opening-sub-header"
          [allowEditing]="false"
          alignment="right"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        ></dxi-column>
        <dxi-column
          dataField="OpeningBalanceCredit"
          caption="Credit"
          cssClass="opening-sub-header"
          alignment="center"
          alignment="right"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        >
        </dxi-column>
      </dxi-column>

      <dxi-column caption="During the Period" cssClass="DuringPeriod-header">
        <dxi-column
          dataField="DuringThePeriodDebit"
          caption="Debit"
          alignment="right"
          cssClass="DuringPeriod-sub-header"
          [allowEditing]="false"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        ></dxi-column>
        <dxi-column
          dataField="DuringThePeriodCredit"
          caption="Credit"
          alignment="center"
          cssClass="DuringPeriod-sub-header"
          alignment="right"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        >
        </dxi-column>
      </dxi-column>

      <dxi-column caption="Closing Balance" cssClass="closing-header">
        <dxi-column
          dataField="ClosingBalanceDebit"
          caption="Debit"
          alignment="right"
          [width]="130"
          cssClass="closing-sub-header"
          [allowEditing]="false"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        ></dxi-column>
        <dxi-column
          dataField="ClosingBalanceCredit"
          caption="Credit"
          cssClass="closing-sub-header"
          alignment="right"
          [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
          dataType="number"
        >
        </dxi-column>
      </dxi-column>

      <dxi-column
        *ngIf="TrialBalanceReport.length > 0"
        type="buttons"
        [width]="100"
      >
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>

  <dx-popup
    [(visible)]="dimensionPopupVisible"
    [width]="700"
    [height]="500"
    title="Financial Dimension Details"
    [showCloseButton]="true"
    [dragEnabled]="true"
    [hideOnOutsideClick]="true"
  >
    <dx-data-grid
      [dataSource]="dimensionPopupData"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [rowAlternationEnabled]="true"
    >
      <dxi-column dataField="Dimension" caption="Dimension"></dxi-column>
      <dxi-column dataField="Code" caption="Code"></dxi-column>
      <dxi-column dataField="Description" caption="Description"></dxi-column>
    </dx-data-grid>
  </dx-popup>
</div>
