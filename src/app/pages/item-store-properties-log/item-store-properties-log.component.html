<div class="view-wrapper list-page">
  <div>
    <dx-data-grid
      [width]="'100%'"
      [height]="'530px'"
      class="grid theme-dependent"
      [dataSource]="logList"
      [showBorders]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      (onSelectionChanged)="onSelectionChanged($event)"
      (onEditingStart)="openEditingStart($event)"
      (onRowRemoving)="onRowRemoving($event)"
      (onCellPrepared)="onCellPrepared($event)"
      [keyExpr]="'ID'"
      [selection]="{ mode: 'single' }"
      (onExporting)="onExporting($event)"
    >
      <dxo-scrolling
        mode="standard"
        columnRenderingMode="virtual"
      ></dxo-scrolling>
      <dxo-editing
        mode="popup"
        [allowUpdating]="true"
        [allowDeleting]="true"
      ></dxo-editing>
      <dxo-search-panel
        [visible]="true"
        [highlightCaseSensitive]="false"
      ></dxo-search-panel>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Store Properties Log
          </div>
        </dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>

        <!-- Divider -->
        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>

        <!-- Export (built-in, kept) -->
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          widget="dxButton"
          [options]="addButtonOptions"
        >
        </dxi-item>
      </dxo-toolbar>

      <dxi-column
        dataField="ID"
        caption="ID"
        [width]="'auto'"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="WS_NO"
        caption="Work Sheet No."
        [width]="'auto'"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="WS_DATE"
        caption="Date"
        [width]="'auto'"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="Narration"
        caption="Remarks"
        [width]="'300'"
        [allowEditing]="false"
      ></dxi-column>
      <!-- <dxi-column
        dataField="Status"
        caption="Status"
        [width]="150"
        [allowEditing]="false"
        cellTemplate="statusCellTemplate"
        alignment="center"
      ></dxi-column>

      <div *dxTemplate="let cellData of 'statusCellTemplate'">
        <i
          class="fas fa-flag"
          [ngClass]="getStatusFlagClass(cellData.value)"
          [attr.title]="cellData.value"
        ></i>
      </div>
      <dxi-column
        type="buttons"
        [width]="200"
        [buttons]="allButtons"
      ></dxi-column> -->

      <dxi-column
        caption="Status"
        dataField="Status"
        [width]="80"
        cellTemplate="statusCellRender"
        [allowHeaderFiltering]="true"
      >
      </dxi-column>
      <div *dxTemplate="let data of 'statusCellRender'">
        <div style="text-align: center; width: 100%">
          <span
            [ngClass]="{
              'flag-approved': data.data.Status === 'Approved',
              'flag-verified': data.data.Status === 'Verified',
              'flag-pending':
                data.data.Status !== 'Verified' &&
                data.data.Status !== 'Approved',
            }"
          >
            {{
              data.data.Status === "Open"
                ? "Open"
                : data.data.Status === "Verified"
                  ? "Verified"
                  : data.data.Status === "Approved"
                    ? "Approved"
                    : "Unknown"
            }}
          </span>
        </div>
      </div>
      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      >
      </dxi-column>
      <div *dxTemplate="let cellData of 'actionTemplate'">
        <div class="action-icons">
          <!-- Edit -->
          <i
            *ngIf="canEdit"
            class="dx-icon dx-icon-edit"
            [title]="cellData.data.Status === 'Open' ? 'Edit' : 'Details'"
            (click)="openEditingStart({ data: cellData.data, cancel: false })"
          ></i>

          <!-- Delete -->
          <i
            *ngIf="canDelete"
            class="dx-icon dx-icon-trash"
            [style.opacity]="
              cellData.data.Status === 'Verified' ||
              cellData.data.Status === 'Approved'
                ? '0.4'
                : '1'
            "
            [style.pointer-events]="
              cellData.data.Status === 'Verified' ||
              cellData.data.Status === 'Approved'
                ? 'none'
                : 'auto'
            "
            title="Delete"
            (click)="onRowRemoving({ data: cellData.data, cancel: false })"
          ></i>

          <!-- Verify -->
          <span
            *ngIf="
              !(canEdit && !canVerify && !canApprove) &&
              (canVerify || canApprove || cellData.data.Status === 'Approved')
            "
            class="verify-badge"
            [ngClass]="{
              'status-pending': cellData.data.Status === 'Open',
              'status-verified': cellData.data.Status === 'Verified',
              'status-approved': cellData.data.Status === 'Approved',

              disabled:
                (cellData.data.Status === 'Open' && !canVerify) ||
                (cellData.data.Status === 'Verified' && !canApprove) ||
                (cellData.data.Status === 'Approved' && canEdit),
            }"
            (click)="
              cellData.data.Status === 'Open'
                ? onVerifyClick({ row: { data: cellData.data } })
                : cellData.data.Status === 'Verified'
                  ? onApproveClick({ row: { data: cellData.data } })
                  : null
            "
          >
          </span>
        </div>
      </div>
    </dx-data-grid>
  </div>
  <!-- <div class="selected-rows-container">
    Total records: {{ totalRecords }}
  </div> -->
</div>

<dx-popup
  [(visible)]="editPackPopupOpened"
  [width]="'90vw'"
  [height]="'100vh'"
  title="Update Store Items Properties"
  (onHiding)="handleClose()"
>
  <div *dxTemplate="let data of 'content'">
    <app-edit-item-store-property
      (popupClosed)="handleClose()"
      [selectedData]="selectedData"
      [status]="StatusType"
    ></app-edit-item-store-property>
  </div>
</dx-popup>
