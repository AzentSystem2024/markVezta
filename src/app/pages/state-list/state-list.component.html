<div class="view-wrapper list-page">
  <dx-data-grid
    class="grid theme-dependent"
    [dataSource]="state"
    (onRowRemoving)="onRowRemoving($event)"
    (onRowUpdating)="onRowUpdating($event)"
    [width]="'100%'"
    [height]="'85vh'"
    [showBorders]="true"
    [allowColumnReordering]="true"
    [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
    [rowAlternationEnabled]="true"
    [showColumnLines]="true"
    (onExporting)="onExporting($event)"
    (onToolbarPreparing)="onToolbarPreparing($event)"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="true"
      [showNavigationButtons]="true"
    ></dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row>
    <dxo-header-filter [visible]="isFilterOpened">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <!-- <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel> -->
    <dxo-filter-builder [allowHierarchicalFields]="true"> </dxo-filter-builder>

    <dxo-filter-row
      [visible]="isFilterRowVisible"
      [applyFilter]="auto"
    ></dxo-filter-row>

    <dxo-export [enabled]="true" [formats]="['xlsx', 'pdf']"> </dxo-export>

    <dxo-editing mode="popup" [allowUpdating]="true" [allowDeleting]="true">
      <dxo-popup
        title="Edit State"
        [showTitle]="true"
        [width]="450"
        [height]="300"
      >
      </dxo-popup>
      <dxo-form [colCount]="1"> </dxo-form>
    </dxo-editing>
    <!-- <dxo-search-panel
      [visible]="true"
      placeholder="Data Search"
    ></dxo-search-panel> -->
    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header">State</div>
      </dxi-item>
      <dxi-item name="searchPanel" locateInMenu="auto"></dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          stylingMode: 'text'
        }"
      ></dxi-item>
      
      <!-- <dxi-item location="after" locateInMenu="auto"> -->
      <dxi-item
        location="after"
        locateInMenu="auto"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
      <!-- <dx-button
          text="Add"
          icon="plus"
          type="default"
          stylingMode="contained"
          (onClick)="addState()"
        ></dx-button> -->
      <!-- </dxi-item> -->

      <!-- <dxi-item location="after" locateInMenu="auto">
        <div class="separator"></div>
      </dxi-item> -->
      <dxi-item name="exportButton"></dxi-item>
      <dxi-item location="after" locateInMenu="auto">
        <div class="separator"></div>
      </dxi-item>
    </dxo-toolbar>
    <dxi-column dataField="STATE_CODE" caption="State Codes"></dxi-column>
    <dxi-column dataField="STATE_NAME" caption="State Name">
      <dxi-validation-rule type="required" message="State is required">
        <dxi-validation-rule type="required" message="State is required">
        </dxi-validation-rule>
      </dxi-validation-rule>
    </dxi-column>
    <dxi-column dataField="COUNTRY_ID" caption="Country Name">
      <dxo-lookup
        [dataSource]="CountryDropdownData"
        displayExpr="COUNTRY_NAME"
        valueExpr="ID"
      >
        <dxi-validation-rule type="required" message="Country is required">
          <dxi-validation-rule type="required" message="Country is required">
          </dxi-validation-rule>
        </dxi-validation-rule>
      </dxo-lookup>
    </dxi-column>
  </dx-data-grid>
  <form-popup
    [(visible)]="isAddStatePopupOpened"
    (save)="onClickSaveState()"
    titleText="New State"
  >
    <app-state-form></app-state-form>
  </form-popup>
</div>
