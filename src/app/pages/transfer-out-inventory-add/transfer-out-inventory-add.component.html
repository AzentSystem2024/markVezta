<dx-validation-group #creditNoteGroup>
  <div class="transfer-inventory-wrapper">
    <!-- Modern Retail Form Header Card -->
    <div class="transfer-header-card">
      <div class="header-grid">
        <!-- Field 1: Date -->
        <div class="field-item">
          <dx-date-box [(value)]="transferOutFormData.TRANSFER_DATE" label="Date" labelMode="floating"
            displayFormat="dd-MM-yyyy" [readOnly]="true" width="100%"></dx-date-box>
        </div>

        <!-- Field 2: Transfer No -->
        <div class="field-item">
          <dx-text-box [(value)]="transferOutFormData.DOC_NO" label="Transfer No" labelMode="floating" [readOnly]="true"
            width="100%"></dx-text-box>
        </div>

        <!-- Field 3: Store -->
        <div class="field-item">
          <dx-select-box [(value)]="StoreIDData" [dataSource]="stores" displayExpr="DESCRIPTION" valueExpr="ID"
            [searchEnabled]="true" label="Store" labelMode="floating" (onValueChanged)="onStoreValueChanged($event)"
            [readOnly]="isReadOnlyMode || isEditing" width="100%">
            <dx-validator>
              <dxi-validation-rule type="required" message="Store is required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>

        <!-- Field 4: Department -->
        <div class="field-item">
          <dx-select-box [(value)]="transferOutFormData.DEPT_ID" [dataSource]="departments" displayExpr="DESCRIPTION"
            valueExpr="ID" [searchEnabled]="true" label="Department" labelMode="floating" [readOnly]="isReadOnlyMode"
            width="100%">
            <dx-validator>
              <dxi-validation-rule type="required" message="Department is required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>

        <!-- Field 5: Reasons -->
        <div class="field-item">
          <dx-select-box [(value)]="transferOutFormData.REASON_ID" [dataSource]="reasons" displayExpr="DESCRIPTION"
            valueExpr="ID" [searchEnabled]="true" label="Reasons" labelMode="floating" [readOnly]="isReadOnlyMode"
            width="100%">
            <dx-validator>
              <dxi-validation-rule type="required" message="Reason is required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>

        <!-- Field 6: Transfer To -->
        <div class="field-item">
          <dx-select-box [(value)]="transferOutFormData.DEST_STORE_ID" [dataSource]="transferstores"
            displayExpr="DESCRIPTION" valueExpr="ID" [searchEnabled]="true" label="Transfer To" labelMode="floating"
            (onValueChanged)="onStoreChange($event)" [readOnly]="isReadOnlyMode" width="100%">
            <dx-validator>
              <dxi-validation-rule type="required" message="Transfer To store is required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </div>

        <!-- Field 7: Add Items Action Button -->
        <div class="field-item action-field" *ngIf="!isReadOnlyMode">
          <dx-button stylingMode="contained" class="add-items-btn" (onClick)="onAddItems()"
            [disabled]="!transferOutFormData.DEST_STORE_ID || isReadOnlyMode" width="100%">
            <div *dxTemplate="let data of 'content'" class="btn-content">
              <span class="iconify me-2" data-icon="formkit:add" data-width="18" data-height="18"></span>
              <span class="add-text">Add Items</span>
            </div>
          </dx-button>
        </div>
      </div>
    </div>

    <!-- Data Grid Container -->
    <div class="grid-container">
      <dx-data-grid #itemsGridRef [dataSource]="transferOutFormData.DETAILS" [showBorders]="true"
        [showColumnLines]="true" [columnAutoWidth]="true" [rowAlternationEnabled]="true" [allowColumnReordering]="true"
        [allowColumnResizing]="true" [height]="'54vh'" [columnResizingMode]="'nextColumn'"
        [scrolling]="{ mode: 'virtual' }" rowAlternationInterval="2" [selection]="{ mode: 'single' }" [editing]="{
          mode: 'cell',
          allowAdding: false,
          allowUpdating: true,
          allowDeleting: !isReadOnlyMode,
        }" (onEditorPreparing)="onEditorPreparing($event)" (onRowInserted)="onRowInserted($event)"
        (onEditorPrepared)="onEditorPrepared($event)" (onCellPrepared)="onCellPrepared($event)"
        (onRowValidating)="onRowValidating($event)" class="custom-retail-grid">
        <dxo-load-panel [showPane]="false"></dxo-load-panel>

        <dxi-column dataField="SL_NO" caption="Sl No" alignment="center" [width]="70"></dxi-column>
        <dxi-column dataField="ITEM_ID" [visible]="false"></dxi-column>

        <dxi-column dataField="BARCODE" caption="Barcode" alignment="center" [width]="130"></dxi-column>

        <dxi-column dataField="DESCRIPTION" caption="Description" [allowEditing]="false"></dxi-column>

        <dxi-column dataField="UOM" caption="UOM" alignment="center" [width]="90" [allowEditing]="false"></dxi-column>

        <dxi-column dataField="COST" caption="Unit Cost" alignment="right" [allowEditing]="false" dataType="number"
          [format]="{ type: 'fixedPoint', precision: 2 }" [visible]="!hideCost" [width]="120"></dxi-column>

        <dxi-column dataField="QUANTITY_AVAILABLE" caption="Qty Available" alignment="center" [allowEditing]="false"
          [width]="120"></dxi-column>

        <dxi-column dataField="QUANTITY" caption="Qty Issued" alignment="center" [allowEditing]="!isReadOnlyMode"
          [width]="130" [validationRules]="[
            { type: 'required', message: 'Quantity is required' },
          ]"></dxi-column>

        <dxi-column dataField="netAmount" caption="Total Cost" alignment="right" dataType="number"
          [format]="{ type: 'fixedPoint', precision: 2 }" [allowEditing]="false" [visible]="!hideCost"
          [calculateCellValue]="calculateNetAmount" [width]="130"></dxi-column>

        <!-- Action Column (Delete Icon) -->
        <dxi-column type="buttons" [width]="60" alignment="center" *ngIf="!isReadOnlyMode">
          <dxi-button icon="trash" hint="Delete" [onClick]="deleteRow"></dxi-button>
        </dxi-column>

        <dxo-summary>
          <dxi-total-item column="QUANTITY" summaryType="sum" valueFormat="#,##0.00" displayFormat="NetQty: {0}"
            alignment="right"></dxi-total-item>
          <dxi-total-item column="netAmount" summaryType="sum" valueFormat="#,##0.00" displayFormat="NetAmt: {0}"
            alignment="right"></dxi-total-item>
        </dxo-summary>
      </dx-data-grid>

      <!-- Narration Row -->
      <div class="narration-container">
        <dx-text-box [(value)]="transferOutFormData.NARRATION" label="Remarks" labelMode="floating"
          [readOnly]="isReadOnlyMode" width="100%"></dx-text-box>
      </div>

      <!-- Footer Area -->
      <div class="form-footer">
        <div class="footer-actions-right">
          <dx-check-box *ngIf="shouldShowApproveCheckbox"
            [value]="isReadOnlyMode ? true : transferOutFormData.IS_APPROVED" (valueChange)="
              !isReadOnlyMode
                ? (transferOutFormData.IS_APPROVED = $event)
                : null
            " [text]="isReadOnlyMode ? 'Approved' : 'Approve'" [readOnly]="isReadOnlyMode" stylingMode="outlined"
            class="approve-checkbox">
          </dx-check-box>

          <dx-button text="Cancel" (onClick)="cancel()" stylingMode="outlined" type="normal"></dx-button>

          <dx-button #saveButtonRef [text]="getSaveButtonText()" [disabled]="isSaving"
            (onClick)="isReadOnlyMode ? openPDF() : saveTransferOut()" stylingMode="contained" type="default"
            [width]="165"></dx-button>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>

<!-- Select Items Popup -->
<dx-popup [(visible)]="isPopupVisible" [width]="850" [height]="550" [showTitle]="true" title="Select Transfer Out Items"
  [dragEnabled]="true" [closeOnOutsideClick]="true" (onHiding)="onPopupHiding()">
  <div *dxTemplate="let data of 'content'">
    <dx-data-grid #popupGridRef [dataSource]="items" [showBorders]="true" [showRowLines]="true" [showColumnLines]="true"
      [columnAutoWidth]="true" [rowAlternationEnabled]="true" [headerFilter]="{ visible: true, allowSearch: true }"
      [allowColumnReordering]="true" [showColumnHeaders]="true" [allowColumnResizing]="true" [height]="'60vh'"
      [columnResizingMode]="'nextColumn'" [scrolling]="{ mode: 'virtual' }" rowAlternationInterval="2"
      [selection]="{ mode: 'multiple', showCheckBoxesMode: 'always' }">
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [visible]="true" [allowedPageSizes]="allowedPageSizes" [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector" [showInfo]="true" [showNavigationButtons]="true"></dxo-pager>
      <dxo-load-panel [showPane]="true" [visible]="isPopupGridLoading" text="Loading items..."></dxo-load-panel>

      <dxo-filter-row [visible]="isFilterRowVisible" [applyFilter]="auto"></dxo-filter-row>

      <dxo-toolbar>
        <dxi-item location="after">
          <div class="toolbar-button-wrapper">
            <dx-button text="Select Items" icon="check" (onClick)="onSelectItems()" class="select-item-btn"></dx-button>
          </div>
        </dxi-item>
      </dxo-toolbar>

      <dxi-column dataField="BARCODE" caption="Barcode" [width]="140" alignment="center"></dxi-column>
      <dxi-column dataField="DESCRIPTION" caption="Description"></dxi-column>
      <dxi-column dataField="UOM" caption="UOM" [width]="90" alignment="center"></dxi-column>
      <dxi-column dataField="COST" caption="Unit Cost" dataType="number" alignment="right" [visible]="!hideCost"
        [width]="120" [format]="{ type: 'fixedPoint', precision: 2 }"></dxi-column>
      <dxi-column dataField="QUANTITY_AVAILABLE" caption="Qty Available" alignment="center" [width]="130"></dxi-column>
    </dx-data-grid>
  </div>
</dx-popup>
