<div class="view-wrapper list-page">
  <div class="grid-container">
    <!-- Filter Panel -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          [width]="200"
          label="Customer"
          labelMode="floating"
          [items]="customer_list"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [(value)]="select_customer_id"
          [searchEnabled]="true"
          (onValueChanged)="onCompanyChange($event)"
        >
        </dx-select-box>

        <dx-select-box
          label="Year"
          labelMode="floating"
          [width]="150"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
          placeholder="Year"
        >
        </dx-select-box>

        <dx-select-box
          label="Month"
          labelMode="floating"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
          [dropDownOptions]="{ width: 'auto' }"
          [width]="150"
        >
        </dx-select-box>

        <dx-date-box
          [width]="150"
          label="Date From"
          labelMode="floating"
          displayFormat="dd-MM-yyyy"
          [value]="formatted_from_date"
          (onValueChanged)="onFromDateChange($event)"
        >
        </dx-date-box>

        <dx-date-box
          [width]="150"
          label="Date To"
          labelMode="floating"
          displayFormat="dd-MM-yyyy"
          [value]="formatted_To_date"
          (onValueChanged)="onToDateChange($event)"
        >
        </dx-date-box>

        <dx-button
          text="Apply"
          icon="check"
          type="default"
          stylingMode="contained"
          (onClick)="GET_CUSTOMER_LIST()"
        >
        </dx-button>
      </div>
    </div>

    <!-- Horizontal Toggle Bar -->
    <div
      class="toggle-bar"
      (click)="toggleParameters()"
      [title]="showParameters ? 'Hide Filters' : 'Show Filters'"
    >
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <dx-data-grid
      class="grid theme-dependent"
      [dataSource]="CustomerListDataSource"
      width="100%"
      noDataText=""
      height="82vh"
      [showBorders]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [grouping]="{ autoExpandAll: false }"
      [filterRow]="{ visible: false }"
      [rowAlternationEnabled]="true"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
      id="dataGrid"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' },
      }"
      [export]="{ enabled: true, formats: ['xlsx'] }"
      [summary]="summaryColumnsData"
      (onExporting)="onExporting($event)"
      [loadPanel]="{
        enabled: true,
        text: 'Loading...',
      }"
    >
      <dxo-column-chooser
        [height]="500"
        hideOnOutsideClick="true"
        [enabled]="true"
        mode="select"
      ></dxo-column-chooser>
      <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>

      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-export [enabled]="true" [formats]="['xlsx']"> </dxo-export>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="
              font-weight: 600;
              font-size: 20px;
              margin-left: 12px;
              padding: -3px;
              margin-right: 3px;
            "
          >
            Customer Statement
          </div>
        </dxi-item>
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          location="after"
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <!-- Show / Hide Summary -->
        <dxi-item
          location="after"
          widget="dxButton"
          [options]="summaryButtonOptions"
        ></dxi-item>
      </dxo-toolbar>

      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-header-filter [visible]="true">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <!-- Customer Name -->
      <dxi-column
        dataField="CUSTOMER_NAME"
        caption="Customer Name"
        dataType="string"
      ></dxi-column>

      <!-- Invoice Date -->
      <dxi-column
        dataField="INVOICE_DATE"
        caption="Invoice Date"
        dataType="date"
        format="dd/MM/yyyy"
      ></dxi-column>

      <!-- Invoice No -->
      <dxi-column
        dataField="INVOICE_NO"
        caption="Invoice No"
        dataType="string"
      ></dxi-column>

      <!-- Reference No -->
      <dxi-column
        dataField="REFERENCE_NO"
        caption="Reference No"
        dataType="string"
      ></dxi-column>

      <!-- Narration -->
      <dxi-column
        dataField="NARRATION"
        caption="Narration"
        dataType="string"
      ></dxi-column>

      <!-- Net Amount -->
      <dxi-column
        dataField="NET_AMOUNT"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Net Amount"
        dataType="number"
        format="currency"
      ></dxi-column>

      <!-- Received Amount -->
      <dxi-column
        dataField="RECEIVED_AMOUNT"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Received Amount"
        dataType="number"
        format="currency"
      ></dxi-column>

      <!-- Return Amount -->
      <dxi-column
        dataField="RETURN_AMOUNT"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Return Amount"
        dataType="number"
        format="currency"
      ></dxi-column>

      <!-- Adjusted Amount -->
      <dxi-column
        dataField="ADJUSTED_AMOUNT"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Adjusted Amount"
        dataType="number"
        format="currency"
      ></dxi-column>

      <!-- Balance -->
      <dxi-column
        dataField="BALANCE"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        caption="Balance"
        dataType="number"
        format="currency"
      ></dxi-column>

      <dxi-column *ngIf="hasData" type="buttons" [width]="100">
        <dxi-button
          hint="View"
          icon="eyeopen"
          text="View"
          [onClick]="onViewClick.bind(this)"
        ></dxi-button>
      </dxi-column>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>

<!-- =============================drildown========================= -->

<dx-popup
  [(visible)]="isViewInvoice"
  [width]="'90vw'"
  [height]="'85vh'"
  title="View Invoice"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isViewInvoice">
    <app-view-invoice
      [invoiceFormData]="selectedInvoice"
      (popupClosed)="handleClose()"
    ></app-view-invoice>
  </ng-container>
</dx-popup>
