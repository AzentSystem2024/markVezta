<dx-validation-group #journalVoucherGroup>
  <div
    class="invoice-wrapper"
    style="
      height: 100%;
      display: flex;
      flex-direction: column;

      box-sizing: border-box;
    "
  >
    <div
      class="salary-grid-wrapper"
      style="
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          padding-top: 6px;
          margin-bottom: 8px;
          gap: 10px;
        "
      >
        <!-- Left -->
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; gap: 10px">
            <dx-text-box
              [(value)]="receiprtFormData.DOC_NO"
              label="Receipt No"
              labelMode="floating"
              [width]="200"
              [readOnly]="true"
            >
            </dx-text-box>

            <dx-text-box
              [(value)]="receiprtFormData.REF_NO"
              label="Reference No"
              labelMode="floating"
              [width]="150"
            >
            </dx-text-box>
          </div>
          <dx-select-box
            [(value)]="selectedDistributorId"
            [dataSource]="distributorList"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [width]="320"
            [searchEnabled]="true"
            [showClearButton]="true"
            label="Customer"
            labelMode="floating"
            (onValueChanged)="onCustomerChanged($event)"
          >
          </dx-select-box>
        </div>

        <!-- Right -->
        <div style="display: flex; flex-direction: column; gap: 10px">
          <dx-date-box
            [(value)]="receiprtFormData.REC_DATE"
            label="Date"
            labelMode="floating"
            displayFormat="dd-MM-yyyy"
            type="date"
            [width]="180"
            [readOnly]="true"
          >
          </dx-date-box>

          <div style="display: flex; align-items: center; gap: 10px">
            <dx-radio-group
              [items]="transactionTypes"
              [(value)]="receiprtFormData.TRANS_TYPE"
              displayExpr="text"
              valueExpr="value"
              layout="horizontal"
            >
            </dx-radio-group>

            <dx-text-box
              [(value)]="receiprtFormData.NET_AMOUNT"
              label="Amount"
              labelMode="floating"
              [width]="180"
              alignment="right"
            ></dx-text-box>
          </div>
        </div>
      </div>
      <div
        class="grid-container"
        style="display: flex; flex-direction: column; flex: 1; min-height: 0"
      >
        <!-- Two-column box: Bank Details (left) and Receipt Details (right) -->
        <div
          class="bordered-grid"
          style="
            margin-top: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
          "
        >
          <!-- Row: Two columns side by side -->
          <div style="display: flex; justify-content: space-between; gap: 5px">
            <!-- Left: Receipt Details -->
            <div style="flex: 1">
              <div class="section-label">Payment Details</div>

              <dx-radio-group
                [items]="['Cash', 'Bank', 'PDC']"
                [(value)]="receiptMode"
                layout="horizontal"
                label="Mode"
                labelMode="floating"
                [width]="'100%'"
                (onValueChanged)="onReceiptModeChange($event)"
                [readOnly]="isReadOnlyMode"
              ></dx-radio-group>

              <div class="dropdown-row">
                <dx-select-box
                  [dataSource]="filteredLedgerList"
                  [(value)]="receiprtFormData.PAY_HEAD_ID"
                  displayExpr="HEAD_NAME"
                  valueExpr="HEAD_ID"
                  label="Ledger"
                  labelMode="floating"
                  [searchEnabled]="true"
                  [width]="'100%'"
                  style="margin-top: 2px"
                  (onValueChanged)="onLedgerChanged($event)"
                  [readOnly]="isReadOnlyMode"
                ></dx-select-box>
              </div>
            </div>

            <!-- Right: Bank Remittance Details -->
            <div style="flex: 1">
              <!-- Dimmed or highlighted section label -->
              <div
                class="section-label"
                [ngStyle]="{
                  color: receiptMode === 'Bank' ? 'inherit' : '#888',
                }"
              >
                Bank Remittance Details
              </div>

              <!-- Cheque No & Due Date -->
              <div style="display: flex; gap: 10px">
                <!-- Search Icon Button -->
                <dx-button
                  *ngIf="receiptMode === 'PDC'"
                  icon="search"
                  class="toolbar-icon-btn mt-2"
                  (onClick)="onSearchCheque()"
                  [disabled]="
                    !(receiptMode === 'PDC' && receiprtFormData.PAY_HEAD_ID)
                  "
                ></dx-button>

                <!-- Cheque No -->
                <dx-text-box
                  [(value)]="receiprtFormData.CHEQUE_NO"
                  label="Reference No"
                  labelMode="floating"
                  [width]="'60%'"
                  [disabled]="
                    !(
                      receiptMode === 'Bank' ||
                      (receiptMode === 'PDC' && receiprtFormData.PAY_HEAD_ID)
                    )
                  "
                ></dx-text-box>

                <!-- Due Date -->
                <dx-date-box
                  [(value)]="receiprtFormData.CHEQUE_DATE"
                  label="Due Date"
                  labelMode="floating"
                  type="date"
                  displayFormat="dd-MM-yyyy"
                  [width]="'40%'"
                  [readOnly]="
                    !(
                      receiptMode === 'Bank' ||
                      (receiptMode === 'PDC' && receiprtFormData.PAY_HEAD_ID)
                    )
                  "
                ></dx-date-box>
              </div>

              <!-- Bank Name -->
              <!-- Bank Name -->
              <div style="margin-top: 12px">
                <dx-text-box
                  [(value)]="receiprtFormData.BANK_NAME"
                  label="Bank Name"
                  labelMode="floating"
                  [width]="'100%'"
                  [disabled]="
                    !(
                      receiptMode === 'Bank' ||
                      (receiptMode === 'PDC' && receiprtFormData.PAY_HEAD_ID)
                    )
                  "
                ></dx-text-box>
              </div>
            </div>
          </div>

          <!-- Narration (non-PDC modes: full width) -->
          <div *ngIf="receiptMode !== 'PDC'">
            <dx-text-box
              [(value)]="receiprtFormData.NARRATION"
              label="Narration"
              labelMode="floating"
              [width]="'100%'"
              style="margin-top: 2px"
              [readOnly]="isReadOnlyMode"
            ></dx-text-box>
          </div>
          <div
            [hidden]="receiptMode !== 'PDC'"
            style="display: flex; gap: 5px; margin-top: 2px"
          >
            <!-- Left column (Narration same width as Ledger) -->
            <div style="flex: 1">
              <dx-text-box
                [(value)]="receiprtFormData.NARRATION"
                label="Narration"
                labelMode="floating"
                [width]="'100%'"
                [readOnly]="isReadOnlyMode"
              ></dx-text-box>
            </div>

            <!-- Right column (Amount same width as Bank Remittance side) -->
            <div style="flex: 1">
              <dx-text-box
                [(value)]="receiprtFormData.NET_AMOUNT"
                label="Amount"
                labelMode="floating"
                [format]="{ type: 'fixedPoint', precision: 2 }"
                [width]="'100%'"
                [readOnly]="isReadOnlyMode"
              ></dx-text-box>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>
<div
  style="
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    margin-top: 20px;
    padding-right: 10px;
  "
>
  <!-- Checkbox right above buttons -->

  <!-- Buttons row -->
  <div style="display: flex; gap: 4px; align-items: flex-end">
    <div style="display: flex; flex-direction: column; align-items: center">
      <div class="approve-container" *ngIf="canApprove">
        <dx-check-box
          *ngIf="!isReadOnlyMode"
          [(value)]="receiprtFormData.IS_APPROVED"
          text="Approve"
          [width]="120"
          style="margin-bottom: 5px; margin-left: 20px"
        ></dx-check-box>
      </div>
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        type="normal"
        (onClick)="cancel()"
        class="no-gap-btn"
      ></dx-button>
    </div>
    <dx-button
      *ngIf="!isReadOnlyMode"
      #saveButtonRef
      [text]="
        isSaving
          ? receiprtFormData.IS_APPROVED
            ? 'Saving...'
            : 'Updating...'
          : receiprtFormData.IS_APPROVED
            ? 'Save'
            : 'Save'
      "
      stylingMode="contained"
      type="default"
      [disabled]="isSaving"
      (onClick)="onSaveClick()"
      class="no-gap-btn"
    ></dx-button>
  </div>
</div>

<dx-popup
  [(visible)]="showFillAmountPopup"
  [width]="400"
  [height]="300"
  title="Fill Amount"
  [showTitle]="true"
  [dragEnabled]="true"
  [closeOnOutsideClick]="true"
>
  <div
    style="
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      overflow: auto;
    "
  >
    <!-- Display Total Pending Amount (read-only) -->
    <dx-text-box
      [value]="totalPending | number: '1.2-2'"
      label="Total Pending Amount"
      labelMode="floating"
      [readOnly]="true"
    ></dx-text-box>

    <!-- Editable Amount Field -->
    <dx-number-box
      [(value)]="fillAmountData.field1"
      label="Amount Field 1"
      labelMode="floating"
      [showClearButton]="true"
      [format]="'#,##0.00'"
      [min]="0"
      (onValueChanged)="validateAmount($event)"
    ></dx-number-box>

    <div style="min-height: 16px; font-size: 12px; color: red">
      {{ amountError }}
    </div>
    <!-- Action Buttons -->
    <div
      style="
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      "
    >
      <dx-button
        text="Cancel"
        stylingMode="outlined"
        type="normal"
        (onClick)="handleCancel()"
      ></dx-button>
      <dx-button
        text="Submit"
        stylingMode="contained"
        type="default"
        (onClick)="submitAmountPopup()"
      ></dx-button>
    </div>
  </div>
</dx-popup>

<dx-popup
  [(visible)]="pdcPopupVisible"
  [width]="700"
  [height]="400"
  [showTitle]="true"
  title="Select PDC"
  [dragEnabled]="true"
  [closeOnOutsideClick]="true"
>
  <div *dxTemplate="let data of 'content'">
    <dx-data-grid
      [dataSource]="pdcList"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [headerFilter]="{ visible: true, allowSearch: true }"
      [allowColumnReordering]="true"
      [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [height]="'45vh'"
      [columnResizingMode]="'nextColumn'"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [repaintChangesOnly]="true"
      [selection]="{
        mode: 'single',
        showCheckBoxesMode: 'always',
      }"
      (onRowDblClick)="onPdcSelected($event)"
    >
      <dxi-column dataField="CHEQUE_NO" caption="Cheque No"></dxi-column>
      <dxi-column
        dataField="DUE_DATE"
        caption="Cheque Date"
        dataType="date"
      ></dxi-column>
      <dxi-column dataField="BANK_NAME" caption="Bank Name"></dxi-column>
      <dxi-column
        dataField="AMOUNT"
        caption="Amount"
        dataType="number"
      ></dxi-column>
    </dx-data-grid>
  </div>
</dx-popup>
