<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      noDataText="No data available"
      [width]="'100%'"
      [height]="'82vh'"
      [loadPanel]="{
        enabled: true,
        text: 'Loading...',
        showIndicator: true,
        showPane: true,
      }"
      class="grid theme-dependent"
      [dataSource]="saleReturnDataSource"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'nextColumn'"
      [filterRow]="{ visible: false }"
      [headerFilter]="{ visible: false }"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [selection]="{ mode: 'single' }"
      focusStateEnabled="false"
      (onEditingStart)="onEditSaleReturn($event)"
      (onRowRemoving)="onDeleteSaleReturn($event)"
      (onCellPrepared)="onCellPrepared($event)"
    >
      <!-- <dxo-editing
        mode="popup"
        [allowUpdating]="canEdit"
        [allowDeleting]="canDelete"
      ></dxo-editing> -->
      <dxo-export
        [enabled]="true"
        [allowExportSelectedData]="false"
        [formats]="['xlsx']"
      >
      </dxo-export>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
      <dxo-filter-builder [allowHierarchicalFields]="true">
      </dxo-filter-builder>

      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">Sale Return</div>
        </dxi-item>
        <dxi-item location="after" template="dateFilterTemplate"></dxi-item>
        <!-- <dxi-item widget="dxButton" [options]="filterButtonOptions"></dxi-item> -->
        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
        <!-- Divider -->

        <dxi-item
          *ngIf="canAdd"
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
      </dxo-toolbar>
      <div *dxTemplate="let data of 'dateFilterTemplate'">
        <dx-select-box
          [dataSource]="dateRanges"
          [displayExpr]="displayExpr"
          valueExpr="value"
          [(value)]="selectedDateRange"
          (onValueChanged)="onDateRangeChanged($event)"
          (onOpened)="attachItemClickHandler($event)"
          width="220"
        >
          <!-- This controls the dropdown list rendering -->
          <div *dxTemplate="let item of 'item'">
            {{ item.value === "custom" ? "Custom" : item.label }}
          </div>
        </dx-select-box>
      </div>
      <dxi-column dataField="RET_NO" caption="Return No"></dxi-column>
      <dxi-column
        dataField="RET_DATE"
        caption="Return Date"
        dataType="date"
        [allowEditing]="false"
        format="dd-MM-yyyy"
      ></dxi-column>
      <dxi-column dataField="CUST_NAME" caption="Customer"></dxi-column>
      <dxi-column
        dataField="GROSS_AMOUNT"
        caption="Gross Amount"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>
      <dxi-column
        dataField="VAT_AMOUNT"
        [caption]="vatTitle + ' Amount'"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>
      <dxi-column
        dataField="NET_AMOUNT"
        caption="NET Amount"
        dataType="number"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>
      <!-- <dxi-column dataField="NARRATION" caption="Narration"></dxi-column> -->

      <dxi-column
        caption="Status"
        dataField="TRANS_STATUS"
        [width]="140"
        cellTemplate="statusCellRender"
        [allowHeaderFiltering]="true"
        [headerFilter]="{
          dataSource: getStatusFilterData,
          encodeHtml: false,
        }"
      >
      </dxi-column>
      <div *dxTemplate="let data of 'statusCellRender'">
        <div style="text-align: center; width: 100%">
          <span
            [ngClass]="{
              'flag-approved': data.data.TRANS_STATUS === 5,
              'flag-verified': data.data.TRANS_STATUS === 2,
              'flag-pending':
                data.data.TRANS_STATUS !== 2 && data.data.TRANS_STATUS !== 5,
            }"
          >
            {{
              data.data.TRANS_STATUS === 1
                ? "Open"
                : data.data.TRANS_STATUS === 2
                  ? "Verified"
                  : data.data.TRANS_STATUS === 5
                    ? "Approved"
                    : "Unknown"
            }}
          </span>
        </div>
      </div>

      <dxi-column
        type="buttons"
        caption="Actions"
        [width]="140"
        cellTemplate="actionTemplate"
      >
      </dxi-column>
      <div *dxTemplate="let cellData of 'actionTemplate'">
        <div class="action-icons">
          <!-- Edit -->
          <i
            *ngIf="canEdit"
            class="dx-icon dx-icon-edit"
            [title]="cellData.data.TRANS_STATUS === 1 ? 'Edit' : 'Details'"
            (click)="onEditSaleReturn({ data: cellData.data, cancel: false })"
          ></i>

          <!-- Delete -->
          <i
            *ngIf="canDelete"
            class="dx-icon dx-icon-trash"
            [style.opacity]="
              cellData.data.TRANS_STATUS === 2 ||
              cellData.data.TRANS_STATUS === 5
                ? '0.4'
                : '1'
            "
            [style.pointer-events]="
              cellData.data.TRANS_STATUS === 2 ||
              cellData.data.TRANS_STATUS === 5
                ? 'none'
                : 'auto'
            "
            title="Delete"
            (click)="onDeleteSaleReturn({ data: cellData.data, cancel: false })"
          ></i>

          <!-- Verify -->
          <span
            *ngIf="
              !(canEdit && !canVerify && !canApprove) &&
              (canVerify || canApprove || cellData.data.TRANS_STATUS === 5)
            "
            class="verify-badge"
            [ngClass]="{
              'status-pending': cellData.data.TRANS_STATUS === 1,
              'status-verified': cellData.data.TRANS_STATUS === 2,
              'status-approved': cellData.data.TRANS_STATUS === 5,

              disabled:
                (cellData.data.TRANS_STATUS === 1 && !canVerify) ||
                (cellData.data.TRANS_STATUS === 2 && !canApprove) ||
                (cellData.data.TRANS_STATUS === 5 && canEdit),
            }"
            (click)="onVerifySalesReturn({ row: { data: cellData.data } })"
          >
          </span>
        </div>
      </div>
    </dx-data-grid>
  </div>
</div>

<dx-popup
  [(visible)]="isAddSaleReturn"
  [width]="'90vw'"
  [height]="'100vh'"
  title="Sale Return"
  (onHiding)="handleClose()"
>
  <app-sale-return-form
    (popupClosed)="handleClose()"
    [canApprove]="canApprove"
  ></app-sale-return-form>
</dx-popup>

<dx-popup
  [(visible)]="isEditSaleReturn"
  [width]="'90vw'"
  [height]="'100vh'"
  title="Sale Return"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isEditSaleReturn">
    <app-sale-return-form
      [isEditing]="true"
      [EditingResponseData]="selectedSaleReturn"
      [isReadOnlyMode]="isReadOnlySaleReturn"
      (popupClosed)="handleClose()"
      [canApprove]="canApprove"
    ></app-sale-return-form>
  </ng-container>
</dx-popup>

<dx-popup
  *ngIf="isVerifySalesReturn"
  [(visible)]="isVerifySalesReturn"
  [width]="'95vw'"
  [height]="'100vh'"
  title="Verify Sales Return"
  (popupClosed)="handleClose()"
>
  <app-sale-return-form
    [isEditing]="true"
    [EditingResponseData]="selectedSaleReturn"
    [isVerifyMode]="selectedSaleReturn?.TRANS_STATUS !== 2"
    [isApproveMode]="selectedSaleReturn?.TRANS_STATUS === 2"
    (popupClosed)="handleClose()"
    [canApprove]="canApprove"
  >
  </app-sale-return-form>
</dx-popup>

<dx-popup
  *ngIf="isApproveSalesReturn"
  [(visible)]="isApproveSalesReturn"
  [width]="'95vw'"
  [height]="'100vh'"
  title="Approve Sales Return"
  (popupClosed)="handleClose()"
>
  <app-sale-return-form
    [isEditing]="true"
    [EditingResponseData]="selectedSaleReturn"
    [isVerifyMode]="selectedSaleReturn?.Header?.TRANS_STATUS !== 2"
    [isApproveMode]="selectedSaleReturn?.Header?.TRANS_STATUS === 2"
    (popupClosed)="handleClose()"
    [canApprove]="canApprove"
  >
  </app-sale-return-form>
</dx-popup>

<dx-popup
  *ngIf="isViewSalesReturn"
  [(visible)]="isViewSalesReturn"
  [width]="'95vw'"
  [height]="'100vh'"
  title="Sales Return"
  (onHiding)="handleClose()"
>
  <!-- <ng-container *ngIf="isAddInvoice"> -->
  <app-sale-return-form
    [isEditing]="true"
    [isReadOnlyMode]="isReadOnlySaleReturn"
    [EditingResponseData]="selectedSaleReturn"
    (popupClosed)="handleClose()"
  ></app-sale-return-form>
  <!-- </ng-container> -->
</dx-popup>
