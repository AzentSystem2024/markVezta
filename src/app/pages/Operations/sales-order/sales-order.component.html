<div class="view-wrapper list-page">
  <div class="grid-container">
    <dx-data-grid
      #dataGrid
      noDataText="No data available"
      [width]="'100%'"
      [height]="'82vh'"
      [loadPanel]="{
        enabled: true,
        text: 'Loading...',
        showIndicator: true,
        showPane: true,
      }"
      class="grid theme-dependent"
      [dataSource]="filteredSalesOrderList"
      [showBorders]="true"
      [showColumnLines]="true"
      [showBorders]="true"
      [columnAutoWidth]="false"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [showColumnHeaders]="true"
      [columnAutoWidth]="true"
      [allowColumnResizing]="true"
      [columnResizingMode]="'nextColumn'"
      [filterRow]="{ visible: false }"
      [headerFilter]="{ visible: false }"
      [scrolling]="{ mode: 'virtual' }"
      rowAlternationInterval="2"
      [selection]="{ mode: 'single' }"
      focusStateEnabled="false"
      (onEditingStart)="onEditSalesOrder($event)"
      (onCellPrepared)="onCellPrepared($event)"
      (onRowRemoving)="onDeleteSalesOrder($event)"
    >
      <dxo-editing
        mode="popup"
        [allowUpdating]="canEdit"
        [allowDeleting]="canDelete"
      ></dxo-editing>
      <dxo-export
        [enabled]="true"
        [allowExportSelectedData]="false"
        [formats]="['xlsx']"
      >
      </dxo-export>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="showPageSizeSelector"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-load-panel [showPane]="false"></dxo-load-panel>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>
      <dxo-header-filter [visible]="isFilterOpened">
        <dxo-search [enabled]="true"></dxo-search>
      </dxo-header-filter>
      <dxo-filter-panel [visible]="isFilterOpened"></dxo-filter-panel>
      <dxo-filter-builder [allowHierarchicalFields]="true">
      </dxo-filter-builder>
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header">Sales Order</div>
        </dxi-item>
        <dxi-item location="after" template="dateFilterTemplate"></dxi-item>
        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="searchButtonOptions"
        ></dxi-item>

        <dxi-item
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="refreshButtonOptions"
        ></dxi-item>
        <!-- Divider -->
        <dxi-item location="after">
          <div class="toolbar-divider"></div>
        </dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>

        <dxi-item
          *ngIf="canAdd"
          location="after"
          locateInMenu="auto"
          widget="dxButton"
          [options]="addButtonOptions"
        ></dxi-item>
      </dxo-toolbar>
      <div *dxTemplate="let data of 'dateFilterTemplate'">
        <dx-select-box
          [dataSource]="dateRanges"
          [displayExpr]="displayExpr"
          valueExpr="value"
          [(value)]="selectedDateRange"
          (onValueChanged)="onDateRangeChanged($event)"
          (onOpened)="attachItemClickHandler($event)"
          width="220"
        >
          <div *dxTemplate="let item of 'item'">
            {{ item.value === "custom" ? "Custom" : item.label }}
          </div>
        </dx-select-box>
      </div>
      <dxi-column
        dataField="SO_NO"
        caption="Sales Order No."
        [allowEditing]="false"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="SO_DATE"
        caption="Date"
        [allowEditing]="false"
        dataType="date"
        width="120"
        [format]="{ type: 'custom', formatter: formatDate }"
      >
      </dxi-column>

      <dxi-column
        dataField="CUSTOMER_NAME"
        caption="Customer"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="DELIVERY_ADDRESS"
        caption="Delivery Address"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        dataField="TOTAL_QTY"
        caption="Quantity"
        [allowEditing]="false"
      ></dxi-column>

      <dxi-column
        dataField="REMARKS"
        caption="Narration"
        [allowEditing]="false"
      ></dxi-column>
      <dxi-column
        caption="Status"
        dataField="TRANS_STATUS"
        [width]="80"
        [cellTemplate]="statusCellRender"
        [allowHeaderFiltering]="true"
        [headerFilter]="{
          dataSource: getStatusFilterData,
          encodeHtml: false,
        }"
        [fixed]="true"
        fixedPosition="right"
      >
      </dxi-column>

      <dxi-column type="buttons" [width]="120" [fixed]="true" fixedPosition="right">
        <dxi-button name="edit"></dxi-button>
        <dxi-button name="delete"></dxi-button>
        <dxi-button hint="Print/Preview" icon="print" [onClick]="onPrintClick"></dxi-button>
      </dxi-column>
    </dx-data-grid>
  </div>
</div>

<dx-popup
  [(visible)]="isAddSalesOrder"
  [width]="'85vw'"
  [height]="'auto'"
  title="Sales Order"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isAddSalesOrder">
    <app-sales-order-form (popupClosed)="handleClose()"></app-sales-order-form>
  </ng-container>
</dx-popup>
<dx-popup
  [(visible)]="isEditSalesOrder"
  [width]="'85vw'"
  [height]="'auto '"
  title="Sales Order"
  (onHiding)="handleClose()"
>
  <ng-container *ngIf="isEditSalesOrder">
    <app-sales-order-form
      [isEditing]="true"
      [EditingResponseData]="selectedSalesOrder"
      [isReadOnlyMode]="isReadOnlySalesOrder"
      (popupClosed)="handleClose()"
    ></app-sales-order-form>
  </ng-container>
</dx-popup>

<app-custom-date-popup
  [(visible)]="showCustomDatePopup"
  [startDate]="customStartDate"
  [endDate]="customEndDate"
  (applyDates)="onCustomDateApplied($event)"
>
</app-custom-date-popup>

<dx-popup
  [(visible)]="showTemplatePopup"
  title="Choose Template"
  [height]="'30vh'"
  [width]="'30vw'"
  [showCloseButton]="true"
>
  <div class="popup-content">
    <dx-select-box
      [(value)]="selectedTemplate"
      [dataSource]="templateList"
      displayExpr="name"
      valueExpr="name"
      placeholder="Select a template"
      [searchEnabled]="true"
    ></dx-select-box>
    <dxi-toolbar-item toolbar="bottom" location="after">
      <div class="form-popup-buttons-container">
        <dx-button
          style="margin-top: 30px"
          text="Preview"
          type="default"
          stylingMode="contained"
          [width]="'100px'"
          (onClick)="previewSelectedTemplate()"
        ></dx-button>
      </div>
    </dxi-toolbar-item>
  </div>
</dx-popup>

<dx-popup
  [(visible)]="isPreviewPopupVisible"
  title="Preview Sales Order"
  [height]="'80vh'"
  [width]="'80vw'"
  [showCloseButton]="true"
  (onHiding)="closePdfPreview()"
>
  <div class="popup-content" style="height: 100%; display: flex; flex-direction: column;">
    <div *ngIf="isLoadingPdf" style="text-align: center; padding: 20px; flex: 1;">
      <i class="dx-icon-refresh dx-icon-spin" style="font-size: 24px;"></i> Loading preview...
    </div>
    <div *ngIf="pdfPreviewUrl && !isLoadingPdf" style="flex: 1; min-height: 0;">
      <iframe [src]="pdfPreviewUrl" style="width: 100%; height: 100%; border: 1px solid #ddd;"></iframe>
    </div>
    <div *ngIf="pdfPreviewUrl && !isLoadingPdf" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
      <dx-button text="Print" icon="print" type="default" stylingMode="contained" (onClick)="printPdf()"></dx-button>
      <dx-button text="Download" icon="download" type="default" stylingMode="outlined" (onClick)="downloadPdf()"></dx-button>
      <dx-button text="Send" icon="email" type="success" stylingMode="contained" (onClick)="sendPdf()"></dx-button>
      <dx-button text="Close" type="danger" stylingMode="text" (onClick)="closePdfPreview()"></dx-button>
    </div>
  </div>
</dx-popup>

<!-- Send Email Popup -->
<dx-popup
  [(visible)]="isEmailPopupVisible"
  title="Send Email"
  [width]="'50vw'"
  [height]="'auto'"
  [showCloseButton]="true"
>
  <div class="popup-content" style="padding: 10px;">
    <div style="margin-bottom: 15px;">
      <label>Receivers (Select Multiple):</label>
      <dx-tag-box
        [items]="emailReceivers"
        [(value)]="selectedEmails"
        placeholder="Select Receivers..."
        [searchEnabled]="true"
        [showSelectionControls]="true"
        [multiline]="false">
      </dx-tag-box>
    </div>
    <div style="margin-bottom: 15px;">
      <label>Subject:</label>
      <dx-text-box [(value)]="emailSubject" [readOnly]="true"></dx-text-box>
    </div>
    <div style="margin-bottom: 15px;">
      <label>Body:</label>
      <dx-text-area [(value)]="emailBody" [height]="120" [readOnly]="true"></dx-text-area>
    </div>
    <div style="margin-bottom: 15px;">
      <label>Attachment:</label>
      <div>
        <i class="dx-icon-doc" style="font-size: 18px; margin-right: 5px;"></i>
        <span>{{ selectedTemplate || 'SalesOrder' }}.pdf</span>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
      <dx-button text="Send" icon="email" type="success" stylingMode="contained" [disabled]="isSendingEmail" (onClick)="sendEmailConfirm()">
        <div *dxTemplate="let data of 'content'">
          <i *ngIf="isSendingEmail" class="dx-icon-refresh dx-icon-spin" style="margin-right: 5px;"></i>
          <i *ngIf="!isSendingEmail" class="dx-icon-email" style="margin-right: 5px;"></i>
          <span *ngIf="isSendingEmail">Sending...</span>
          <span *ngIf="!isSendingEmail">Send</span>
        </div>
      </dx-button>
      <dx-button text="Cancel" type="danger" stylingMode="outlined" (onClick)="isEmailPopupVisible = false"></dx-button>
    </div>
  </div>
</dx-popup>
