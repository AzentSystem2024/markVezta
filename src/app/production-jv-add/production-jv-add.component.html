<dx-validation-group #journalVoucherGroup>
  <div
    class="invoice-wrapper"
    style="
      height: 86vh;
      display: flex;
      flex-direction: column;

      box-sizing: border-box;
    "
  >
    <div class="salary-grid-wrapper" style="padding: 0 10px">
      <div class="grid-container">
        <dx-data-grid
          #itemsGridRef
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [columnAutoWidth]="false"
          [wordWrapEnabled]="false"
          [rowAlternationEnabled]="true"
          [headerFilter]="{ visible: true, allowSearch: true }"
          [allowColumnReordering]="true"
          [showColumnHeaders]="true"
          [columnAutoWidth]="true"
          [allowColumnResizing]="true"
          [height]="'52vh'"
          [columnResizingMode]="'nextColumn'"
          [scrolling]="{ mode: 'virtual' }"
          rowAlternationInterval="2"
          [selection]="{ mode: 'single' }"
          [keyboardNavigation]="{ editOnKeyPress: true }"
          [editing]="{
            mode: 'cell',
            allowUpdating: true,
            allowDeleting: true,
            allowAdding: true,
            useIcons: true
          }"
          (onEditorPreparing)="onEditorPreparing($event)"
          (onRowRemoved)="onRowRemoved($event)"
        >
          <dxo-load-panel [showPane]="false"></dxo-load-panel>
          <dxo-filter-builder [allowHierarchicalFields]="true">
          </dxo-filter-builder>
          <dxo-toolbar>
            <div
              class="stacked-toolbar-group"
              style="display: flex; flex-direction: column; gap: 2px"
            ></div>
            <dxi-item location="before" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 0px"
              >
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    margin-top: 6px;
                    width: 100%;
                  "
                >
                  <dx-text-box
                    label="Doc No"
                    labelMode="floating"
                    [width]="200"
                    [readOnly]="true"
                  ></dx-text-box>

                  <dx-text-box
                    label="Reference No"
                    labelMode="floating"
                    [width]="200"
                    [readOnly]="true"
                  ></dx-text-box>

                  <!-- Date box pushed to right end -->
                  <dx-date-box
                    label="Date"
                    labelMode="floating"
                    [width]="200"
                    displayFormat="dd-MM-yyyy"
                    [readOnly]="true"
                    style="margin-left: auto"
                  ></dx-date-box>
                </div>

                <div style="display: flex; align-items: baseline; gap: 2px">
                  <dx-select-box
                    label="Product"
                    labelMode="floating"
                    [width]="335"
                  ></dx-select-box>
                </div>
              </div>
            </dxi-item>

            <dxi-item location="after" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 0px"
              >
                <div
                  style="
                    display: flex;
                    align-items: flex-end;
                    gap: 8px;
                    margin-top: 35px;
                  "
                >
                  <!-- Production / Pending Qty -->
                  <dx-number-box
                    label="Production Qty"
                    labelMode="floating"
                    [width]="150"
                    [readOnly]="false"
                  ></dx-number-box>

                  <!-- Fill Component Button -->
                  <dx-button
                    text="Fill Component"
                    stylingMode="contained"
                    type="default"
                    style="height: 32px"
                  ></dx-button>
                </div>

                <!--  -->
              </div>
            </dxi-item>
          </dxo-toolbar>
          <dxi-column
            dataField="ledgerCode"
            caption="Item Code"
            [width]="130"
            [editorType]="'dxSelectBox'"
            [lookup]="{
              valueExpr: 'HEAD_CODE',
              displayExpr: 'HEAD_CODE',
              searchEnabled: true
            }"
          ></dxi-column>

          <dxi-column
            dataField="ledgerName"
            caption="Item Description"
            [width]="200"
            [editorType]="'dxSelectBox'"
            [lookup]="{
              valueExpr: 'HEAD_NAME',
              displayExpr: 'HEAD_NAME',
              searchEnabled: true
            }"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="UOM"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="BoM Qty"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="Qty Required"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="Qty Available"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="Qty used"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="Cost"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="AMOUNT"
            caption="Amount"
            [allowEditing]="true"
            dataType="number"
            [format]="{ type: 'fixedPoint', precision: 2 }"
          ></dxi-column>

          <dxo-summary>
            <dxi-total-item
              column="AMOUNT"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="Total: {0}"
              alignment="right"
            >
            </dxi-total-item>
          </dxo-summary>
        </dx-data-grid>

        <!-- Fill Amount Button below grid -->
        <div
          style="display: flex; justify-content: flex-end; margin-top: 5px"
        ></div>
        <div
          class="bordered-grid"
          style="
            margin-top: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
          "
        >
          <div style="display: flex; gap: 10px; align-items: center">
            <!-- Remark -->
            <dx-text-box
              label="Additional Cos"
              labelMode="floating"
              style="flex: 2"
              [readOnly]="false"
            ></dx-text-box>

            <!-- Unit Product Cost -->
            <dx-number-box
              label="Cost of production"
              labelMode="floating"
              style="flex: 1"
              [format]="{ type: 'fixedPoint', precision: 2 }"
              [readOnly]="true"
            ></dx-number-box>
          </div>

          <div style="display: flex; gap: 10px; align-items: center">
            <!-- Remark -->
            <dx-text-box
              label="Remark"
              labelMode="floating"
              style="flex: 2"
              [readOnly]="false"
            ></dx-text-box>

            <!-- Unit Product Cost -->
            <dx-number-box
              label="Unit Product Cost"
              labelMode="floating"
              style="flex: 1"
              [format]="{ type: 'fixedPoint', precision: 2 }"
              [readOnly]="true"
            ></dx-number-box>
          </div>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>

<div class="form-popup-buttons-container">
  <div class="popup-footer">
    <dx-button
      text="Cancel"
      stylingMode="outlined"
      (onClick)="Cancel()"
      type="normal"
    ></dx-button>
    <dx-button
      text="Save"
      stylingMode="contained"
      type="default"
      (onClick)="onSave()"
    >
    </dx-button>
  </div>
</div>
