<dx-validation-group #journalVoucherGroup>
  <div
    class="invoice-wrapper"
    style="
      height: 86vh;
      display: flex;
      flex-direction: column;

      box-sizing: border-box;
    "
  >
    <div class="salary-grid-wrapper" style="padding: 0 10px">
      <div class="grid-container">
        <dx-data-grid
          #itemsGridRef
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [columnAutoWidth]="false"
          [wordWrapEnabled]="false"
          [rowAlternationEnabled]="true"
          [headerFilter]="{ visible: true, allowSearch: true }"
          [allowColumnReordering]="true"
          [showColumnHeaders]="true"
          [columnAutoWidth]="true"
          [allowColumnResizing]="true"
          [height]="'52vh'"
          [columnResizingMode]="'nextColumn'"
          [scrolling]="{ mode: 'virtual' }"
          rowAlternationInterval="2"
          [selection]="{ mode: 'single' }"
          [keyboardNavigation]="{ editOnKeyPress: true }"
          [editing]="{
            mode: 'cell',
            allowUpdating: true,
            allowDeleting: true,
            allowAdding: true,
            useIcons: true
          }"
          (onEditorPreparing)="onEditorPreparing($event)"
          (onRowRemoved)="onRowRemoved($event)"
        >
          <dxo-load-panel [showPane]="false"></dxo-load-panel>
          <dxo-filter-builder [allowHierarchicalFields]="true">
          </dxo-filter-builder>
          <dxo-toolbar>
            <div
              class="stacked-toolbar-group"
              style="display: flex; flex-direction: column; gap: 2px"
            ></div>
            <dxi-item location="before" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 0px"
              >
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    margin-top: 6px;
                  "
                >
                  <dx-text-box
                    label="Doc No"
                    labelMode="floating"
                    [width]="200"
                    [readOnly]="true"
                  ></dx-text-box>
                  <dx-text-box
                    label="Reference No"
                    labelMode="floating"
                    [width]="200"
                    [readOnly]="true"
                  ></dx-text-box>
                  <dx-date-box
                    label="Date"
                    labelMode="floating"
                    [width]="200"
                    displayFormat="dd-MM-yyyy"
                    [readOnly]="true"
                  ></dx-date-box>
                </div>
                <div style="display: flex; align-items: baseline; gap: 2px">
                  <dx-select-box
                    #beneficiaryNameRef
                    label="Product"
                    labelMode="floating"
                    [width]="335"
                  ></dx-select-box>
                </div>
              </div>
            </dxi-item>

            <dxi-item location="after" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 0px"
              >
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    margin-top: 6px;
                  "
                >
                  <div style="margin-top: 35px">
                    <dx-number-box
                      label="Pending Qty"
                      labelMode="floating"
                      [width]="150"
                      [readOnly]="true"
                    ></dx-number-box>
                    <!-- <dx-button
                      text="Fill Component"
                      stylingMode="contained"
                      type="default"
                    ></dx-button> -->
                  </div>

                  <!-- <dx-button
                    icon="plus"
                    stylingMode="outlined"
                    type="default"
                    (onClick)="onAddNewRow()"
                    style="height: 32px; width: 32px; padding: 0"
                  ></dx-button> -->
                </div>

                <!--  -->
              </div>
            </dxi-item>
          </dxo-toolbar>
          <dxi-column
            dataField="ledgerCode"
            caption="Ledger Code"
            [width]="130"
            [editorType]="'dxSelectBox'"
            [lookup]="{
              valueExpr: 'HEAD_CODE',
              displayExpr: 'HEAD_CODE',
              searchEnabled: true
            }"
          ></dxi-column>

          <dxi-column
            dataField="ledgerName"
            caption="Ledger Name"
            [width]="200"
            [editorType]="'dxSelectBox'"
            [lookup]="{
              valueExpr: 'HEAD_NAME',
              displayExpr: 'HEAD_NAME',
              searchEnabled: true
            }"
          ></dxi-column>

          <dxi-column
            dataField="REMARKS"
            caption="Description"
            [allowEditing]="true"
          ></dxi-column>

          <dxi-column
            dataField="AMOUNT"
            caption="Amount"
            [allowEditing]="true"
            dataType="number"
            [format]="{ type: 'fixedPoint', precision: 2 }"
          ></dxi-column>

          <!-- <dxi-column type="buttons">
            <dxi-button name="edit"></dxi-button>
            <dxi-button name="delete"></dxi-button>
          </dxi-column> -->

          <dxo-summary>
            <dxi-total-item
              column="AMOUNT"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="Total: {0}"
              alignment="right"
            >
            </dxi-total-item>
          </dxo-summary>
        </dx-data-grid>

        <!-- Fill Amount Button below grid -->
        <div
          style="display: flex; justify-content: flex-end; margin-top: 5px"
        ></div>
        <!-- Two-column box: Bank Details (left) and Receipt Details (right) -->
        <div
          class="bordered-grid"
          style="
            margin-top: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
          "
        >
          <!-- Row: Two columns side by side -->
          <div style="display: flex; justify-content: space-between; gap: 5px">
            <!-- Left: Receipt Details -->
            <div style="flex: 1">
              <dx-text-box
                id="payHeadIdField"
                displayExpr="HEAD_NAME"
                valueExpr="HEAD_ID"
                label="Additional Cost"
                labelMode="floating"
                [searchEnabled]="true"
                [width]="'100%'"
                style="margin-top: 2px"
                [readOnly]="true"
              ></dx-text-box>
            </div>

            <div style="flex: 1">
              <div style="display: flex; gap: 10px">
                <dx-text-box
                  label="Cost of Production"
                  labelMode="floating"
                  type="date"
                  [width]="'100%'"
                  style="flex: 1"
                  [readOnly]="true"
                ></dx-text-box>
              </div>
            </div>
          </div>

          <!-- Row: Narration spanning both columns -->
          <div style="display: flex; gap: 10px">
            <dx-text-box
              label="Remark"
              labelMode="floating"
              [width]="'100%'"
              style="margin-top: 2px"
              [readOnly]="false"
            ></dx-text-box>
          </div>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>

<div class="form-popup-buttons-container">
  <div class="popup-footer">
    <dx-button
      text="Cancel"
      stylingMode="outlined"
      (onClick)="Cancel()"
      type="normal"
    ></dx-button>
    <dx-button #saveButtonRef [text]="" stylingMode="contained" type="default">
    </dx-button>
  </div>
</div>

<div class="form-popup-buttons-container">
  <div class="popup-footer">
    <dx-button
      icon="fas fa-file-pdf"
      text="PDF"
      type="normal"
      stylingMode="outlined"
      [width]="100"
      hint="View PDF"
    >
    </dx-button>
  </div>
</div>
