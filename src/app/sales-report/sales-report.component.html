<div class="view-wrapper list-page">
  <!-- ================= GRID ================= -->
  <div class="grid-container">
    <!-- Collapsible Filter Panel -->
    <div class="filter-panel" [class.collapsed]="!showParameters">
      <div class="filter-row">
        <dx-select-box
          [width]="120"
          label="Year"
          labelMode="floating"
          [(value)]="selectedYear"
          [dataSource]="years"
          (onValueChanged)="onYearChanged($event)"
        ></dx-select-box>

        <dx-select-box
          [width]="140"
          label="Month"
          labelMode="floating"
          [dataSource]="monthDataSource"
          displayExpr="name"
          valueExpr="value"
          [(value)]="selectedmonth"
          (onValueChanged)="onMonthValueChanged($event)"
        ></dx-select-box>

        <dx-date-box
          [width]="150"
          label="From Date"
          labelMode="floating"
          [(value)]="selected_from_date"
          displayFormat="dd-MM-yyyy"
          [max]="today"
          (onValueChanged)="onFromDateChange($event)"
        ></dx-date-box>

        <dx-date-box
          [width]="150"
          label="To Date"
          labelMode="floating"
          [(value)]="selected_To_date"
          displayFormat="dd-MM-yyyy"
          [max]="today"
          (onValueChanged)="onToDateChange($event)"
        ></dx-date-box>

        <dx-select-box
          [width]="200"
          label="Customer"
          labelMode="floating"
          [(value)]="selectedCustomer"
          [dataSource]="distributorList"
          displayExpr="DESCRIPTION"
          valueExpr="ID"
          [searchEnabled]="true"
          [showClearButton]="true"
        ></dx-select-box>

        <dx-button
          text="Apply"
          type="default"
          stylingMode="contained"
          [disabled]="isLoading"
          (onClick)="load_Sales_data()"
        ></dx-button>

        <!-- <dx-button
          text="Cancel"
          stylingMode="outlined"
          [disabled]="isLoading"
          (onClick)="cancelReport()"
        ></dx-button> -->
      </div>
    </div>

    <!-- Filter panel toggle -->
    <div class="toggle-bar" (click)="toggleParameters()">
      <span class="toggle-arrow" [class.rotated]="!showParameters">
        <i class="dx-icon-chevronup"></i>
      </span>
    </div>

    <dx-data-grid
      #dataGrid
      class="grid theme-dependent"
      [dataSource]="salesDataSource"
      [summary]="summaryColumnsData"
      [loadPanel]="{
        enabled: isLoading,
        showIndicator: true,
        showPane: true,
        shading: true,
      }"
      height="75vh"
      [showBorders]="true"
      [showRowLines]="true"
      [allowColumnResizing]="false"
      [showColumnLines]="true"
      [columnAutoWidth]="true"
      [groupPanel]="{ visible: true }"
      [grouping]="{ autoExpandAll: false }"
      [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [remoteOperations]="false"
      [scrolling]="{ mode: 'virtual' }"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: isFilterOpened }"
      [headerFilter]="{ visible: isFilterOpened }"
      (onExporting)="onExporting($event)"
    >
      <dxo-group-panel [visible]="true"></dxo-group-panel>
      <dxo-grouping
        [contextMenuEnabled]="true"
        [autoExpandAll]="false"
      ></dxo-grouping>

      <dxo-paging [pageSize]="10"></dxo-paging>

      <dxo-export [enabled]="true" [formats]="['xlsx']"></dxo-export>

      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>

      <dxo-filter-row
        [visible]="isFilterRowVisible"
        [applyFilter]="auto"
      ></dxo-filter-row>

      <dxo-toolbar>
        <dxi-item location="before">
          <div
            class="grid-header"
            style="font-weight: 600; font-size: 20px; margin-left: 12px"
          >
            Sales Report
          </div>
        </dxi-item>

        <dxi-item widget="dxButton" [options]="searchButtonOptions"></dxi-item>
        <dxi-item widget="dxButton" [options]="refreshButtonOptions"></dxi-item>
        <dxi-item
          name="exportButton"
          location="after"
          cssClass="export-btn"
        ></dxi-item>
        <dxi-item
          widget="dxButton"
          [options]="columnChooserButtonOptions"
        ></dxi-item>

        <dxi-item widget="dxButton" [options]="summaryButtonOptions"></dxi-item>
      </dxo-toolbar>

      <!-- ================= COLUMNS ================= -->
      <!-- Grouped by Invoice Number: expands/collapses on click -->
      <dxi-column
        dataField="SALE_NO"
        caption="Invoice No"
        [groupIndex]="0"
      ></dxi-column>

      <dxi-column dataField="REF_NO" caption="Ref No"></dxi-column>

      <dxi-column
        dataField="SALE_DATE"
        caption="Date"
        dataType="date"
        [format]="{ type: 'custom', formatter: formatDates }"
      ></dxi-column>

      <dxi-column dataField="CUST_NAME" caption="Customer"></dxi-column>

      <dxi-column dataField="VoucherType" caption="Voucher Type"></dxi-column>

      <dxi-column dataField="HSN_CODE" caption="HSN Code"></dxi-column>

      <dxi-column
        dataField="Quantity"
        caption="Quantity"
        alignment="right"
      ></dxi-column>

      <dxi-column
        dataField="GrossTotal"
        caption="Gross Total"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="GSTSales"
        caption="GST Sales"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="SGST"
        caption="SGST"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="CGST"
        caption="CGST"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <dxi-column
        dataField="RoundOff"
        caption="Net Amount"
        alignment="right"
        [format]="{ type: 'fixedPoint', precision: 2 }"
      ></dxi-column>

      <!-- ================= SUMMARY ================= -->
      <dxo-summary>
        <dxi-group-item
          column="Quantity"
          summaryType="sum"
          displayFormat="{0}"
          [showInGroupFooter]="false"
          [alignByColumn]="true"
        >
        </dxi-group-item>
        <dxi-group-item
          column="GrossTotal"
          summaryType="sum"
          displayFormat="{0}"
          [showInGroupFooter]="false"
          [alignByColumn]="true"
          [valueFormat]="{ type: 'fixedPoint', precision: 2 }"
        >
        </dxi-group-item>
        <dxi-group-item
          column="RoundOff"
          summaryType="sum"
          displayFormat="{0}"
          [showInGroupFooter]="false"
          [alignByColumn]="true"
          [valueFormat]="{ type: 'fixedPoint', precision: 2 }"
        >
        </dxi-group-item>

        <dxi-total-item
          column="Quantity"
          summaryType="sum"
          displayFormat="Total Qty: {0}"
          alignment="right"
        >
        </dxi-total-item>
        <dxi-total-item
          column="GrossTotal"
          summaryType="sum"
          displayFormat="Total Gross: {0}"
          alignment="right"
          [valueFormat]="{ type: 'fixedPoint', precision: 2 }"
        >
        </dxi-total-item>
        <dxi-total-item
          column="RoundOff"
          summaryType="sum"
          displayFormat="Total Net: {0}"
          alignment="right"
          [valueFormat]="{ type: 'fixedPoint', precision: 2 }"
        >
        </dxi-total-item>
      </dxo-summary>
    </dx-data-grid>

    <dx-popup
      [(visible)]="isColumnChooserVisible"
      [width]="420"
      [height]="'auto'"
      [maxHeight]="'80vh'"
      title="Choose Columns"
      [showTitle]="true"
      [showCloseButton]="true"
      [dragEnabled]="false"
      [hideOnOutsideClick]="false"
      [shading]="true"
      shadingColor="rgba(0, 0, 0, 0.4)"
      [position]="{ my: 'center', at: 'center', of: 'window' }"
      [wrapperAttr]="{ class: 'custom-column-chooser-popup' }"
    >
      <div class="column-chooser-content">
        <div class="column-chooser-header">
          <span>Select columns to display</span>

          <dx-button
            text="Reset"
            stylingMode="text"
            (onClick)="resetColumnSelection()"
          ></dx-button>
        </div>

        <div class="column-chooser-list">
          <div class="column-chooser-item" *ngFor="let column of tempColumns">
            <dx-check-box
              [text]="column.caption"
              [(value)]="column.visible"
            ></dx-check-box>
          </div>
        </div>

        <div class="column-chooser-footer">
          <dx-button
            text="Cancel"
            stylingMode="outlined"
            (onClick)="cancelColumnChooser()"
          ></dx-button>

          <dx-button
            text="Apply"
            type="default"
            stylingMode="contained"
            (onClick)="applyColumnChooser()"
          ></dx-button>
        </div>
      </div>
    </dx-popup>
  </div>
</div>
