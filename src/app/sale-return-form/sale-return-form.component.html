<dx-validation-group #journalVoucherGroup>
  <div
    class="invoice-wrapper"
    style="
      height: 85vh;
      display: flex;
      flex-direction: column;

      box-sizing: border-box;
    "
  >
    <div
      class="stacked-toolbar-group"
      style="
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 6px;
        margin-left: 20px;
        margin-right: 20px;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 10px;
        "
      >
        <div style="display: flex; gap: 10px; margin-top: 5px">
          <dx-date-box
            label="Return Date"
            type="date"
            labelMode="floating"
            [width]="200"
            [displayFormat]="'dd-MM-yyyy'"
            [readOnly]="true"
          >
          </dx-date-box>

          <dx-text-box
            label="Supplier Invoice No."
            labelMode="floating"
            [width]="200"
            [readOnly]="true"
          >
          </dx-text-box>
        </div>
        <dx-button
          *ngIf="!isReadOnlyMode"
          text="Fill Pending Invoice"
          icon="event"
          [width]="200"
          stylingMode="outlined"
          class="blue-outline-btn"
          [disabled]="isReadOnlyMode"
          style="margin-top: 15px"
        ></dx-button>
      </div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 10px;
        "
      >
        <div style="display: flex; gap: 10px">
          <dx-select-box
            [dataSource]="supplierList"
            displayExpr="DESCRIPTION"
            valueExpr="ID"
            [width]="410"
            label="Supplier"
            labelMode="floating"
            (onValueChanged)="onCustomerChanged($event)"
            [readOnly]="isReadOnlyMode"
          >
          </dx-select-box>
        </div>

        <div style="display: flex; gap: 2px; justify-content: flex-end">
          <dx-text-box
            label="Narration"
            labelMode="floating"
            [width]="400"
            [readOnly]="isReadOnlyMode"
          ></dx-text-box>
        </div>
      </div>
    </div>
    <div class="salary-grid-wrapper" style="padding: 0 20px">
      <div class="grid-container">
        <dx-data-grid
          #itemsGridRef
          [dataSource]="mainGridData"
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [columnAutoWidth]="false"
          [wordWrapEnabled]="false"
          [rowAlternationEnabled]="true"
          [headerFilter]="{ visible: true, allowSearch: true }"
          [allowColumnReordering]="true"
          [showColumnHeaders]="true"
          [columnAutoWidth]="true"
          [allowColumnResizing]="true"
          [height]="'55vh'"
          [width]="'auto'"
          [columnResizingMode]="'nextColumn'"
          [scrolling]="{ mode: 'virtual' }"
          rowAlternationInterval="2"
          [selection]="{ mode: 'single' }"
          [editing]="{
            mode: 'cell',
            allowUpdating: true,
            allowDeleting: !isReadOnlyMode,
            allowAdding: false,
            useIcons: true,
          }"
          (onEditorPreparing)="onEditorPreparing($event)"
          (onContentReady)="onContentReady($event)"
        >
          <dxo-filter-builder [allowHierarchicalFields]="true">
          </dxo-filter-builder>
          <dxi-column
            dataField="DETAIL_ID"
            caption="Detail ID"
            [allowEditing]="!isReadOnlyMode"
            [visible]="false"
          ></dxi-column>
          <dxi-column
            dataField="GRN_DET_ID"
            caption="GRN Detail Id"
            [allowEditing]="!isReadOnlyMode"
            [visible]="false"
          ></dxi-column>
          <dxi-column
            dataField="ITEM_ID"
            caption="Item ID"
            [allowEditing]="!isReadOnlyMode"
            [visible]="false"
          ></dxi-column>
          <dxi-column
            dataField="TRANSFER_NO"
            caption="Transfer No"
            [allowEditing]="!isReadOnlyMode"
          ></dxi-column>
          <dxi-column
            dataField="TRANSFER_DATE"
            caption="Date"
            dataType="date"
            format="dd-MM-yyyy"
            [allowEditing]="!isReadOnlyMode"
          ></dxi-column>
          <dxi-column
            dataField="ITEM_NAME"
            caption="Item Name"
            [allowEditing]="!isReadOnlyMode"
          ></dxi-column>
          <dxi-column
            dataField="HSN_CODE"
            caption="HSN Code"
            dataType="number"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="RATE"
            caption="Price"
            dataType="number"
            format="#,##0.00"
            [allowEditing]="!isReadOnlyMode"
          ></dxi-column>
          <dxi-column
            dataField="PENDING_QTY"
            caption="Pending Qty"
            dataType="number"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="QUANTITY"
            caption="Qty"
            dataType="number"
            [allowEditing]="!isReadOnlyMode"
          >
            <dxi-validation-rule
              type="custom"
              [validationCallback]="validateQuantity"
              message="Quantity cannot be greater than Pending Qty"
            ></dxi-validation-rule>
          </dxi-column>
          <dxi-column
            dataField="AMOUNT"
            caption="Amount"
            dataType="number"
            format="#,##0.00"
            [allowEditing]="!isReadOnlyMode"
            [calculateCellValue]="calculateAmount"
          ></dxi-column>
          <dxi-column
            dataField="VAT_PERC"
            dataType="number"
            caption="IGST"
            [visible]="showGST"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="CGST"
            caption="CGST"
            dataType="number"
            [visible]="showCGST"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="SGST"
            caption="SGST"
            dataType="number"
            [visible]="showSGST"
            [allowEditing]="false"
          ></dxi-column>
          <dxi-column
            dataField="VAT_AMOUNT"
            dataType="number"
            caption="GST Amount"
            format="#,##0.00"
            [allowEditing]="false"
            [calculateCellValue]="calculateVATAmount"
          ></dxi-column>
          <dxi-column
            dataField="TOTAL_AMOUNT"
            caption="Total Amount"
            dataType="number"
            format="#,##0.00"
            [allowEditing]="false"
            [calculateCellValue]="calculateTotalAmount"
          ></dxi-column>
          <dxo-summary>
            <dxi-total-item
              column="AMOUNT"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="{0}"
              alignment="right"
            ></dxi-total-item>
            <dxi-total-item
              column="TOTAL_AMOUNT"
              summaryType="sum"
              valueFormat="#,##0.00"
              displayFormat="{0}"
              alignment="right"
            ></dxi-total-item>
          </dxo-summary>
        </dx-data-grid>

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 3px;
          "
        >
          <!-- LEFT SIDE → Vehicle No -->
          <div>
            <dx-text-box
              label="Vehicle No"
              labelMode="floating"
              [width]="200"
              [readOnly]="isReadOnlyMode"
            ></dx-text-box>
          </div>

          <!-- RIGHT SIDE → Round Off + Net Amount -->
          <div style="display: flex; align-items: center; gap: 16px">
            <dx-check-box
              text="Round Off"
              [readOnly]="isReadOnlyMode"
            ></dx-check-box>

            <dx-text-box
              label="Net Amount"
              labelMode="floating"
              [width]="120"
              [readOnly]="true"
            ></dx-text-box>
          </div>
        </div>

        <div class="form-popup-buttons-container">
          <div class="approve-container">
            <dx-check-box
              [value]="isReadOnlyMode ? true : salesReturnFormData.IS_APPROVED"
              (valueChange)="
                !isReadOnlyMode
                  ? (salesReturnFormData.IS_APPROVED = $event)
                  : null
              "
              [text]="isReadOnlyMode ? 'Approved' : 'Approve'"
              [readOnly]="isReadOnlyMode"
              stylingMode="outlined"
            >
            </dx-check-box>
          </div>
          <div class="popup-footer">
            <dx-button
              text="Cancel"
              stylingMode="outlined"
              type="normal"
              (onClick)="cancel()"
            ></dx-button>
            <dx-button
              #saveButtonRef
              [text]="
                isSaving
                  ? isReadOnlyMode
                    ? 'Opening...'
                    : salesReturnFormData.IS_APPROVED
                      ? 'Committing...'
                      : 'Saving...'
                  : isReadOnlyMode
                    ? 'PDF'
                    : salesReturnFormData.IS_APPROVED
                      ? 'Commit'
                      : 'Save'
              "
              [disabled]="isSaving"
              (onClick)="isReadOnlyMode ? openPDF() : saveSaleReturn()"
              stylingMode="contained"
              type="default"
            ></dx-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>
